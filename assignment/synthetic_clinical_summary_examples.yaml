    output_clinical_summary: |
      Chief Complaint
      [2000-01-01 14:41 UTC]
      Patient Mara Ellis, DOB 06/04/1951. Patient's daughter, Nina, calling on her behalf, (202)-555-0101. Requested guidance on whether to administer LORazepam and morphine together or which medication to give first for recurrent pain.
        Caller: "So I wanted to know if I could give her the lorazepam, the morphine first, maybe, or just both together."
        Explanation: Documents the medication-administration question prompting the call.

      Assessment
      • Pain returned at approximately 8–9/10 after morphine provided relief from 2230 until approximately 0630; no medications had been given since.
        Caller: "The morphine, the first time we used it last night, until about 6:30 this morning, from 10:30 to 6:30. I have not given her anything else yet, but the pain now is returned. She's saying it's like it was last night, about an eight-nine."
        Explanation: Documents the reported pain recurrence, severity, medication timing, and elapsed time since the last dose.
      • Pain was reported in the head, neck, and back, with increased bedbound time over the past couple of days.
        Caller: "She's saying it's in her head, her neck, and her back."
        Explanation: Documents the reported pain locations and associated change in mobility context.
      • LORazepam was used previously for restlessness and difficulty settling to sleep; current restlessness was thought to be related to pain.
        Caller: "So far, not really anxious, just restless."
        Explanation: Documents the current symptom distinction relevant to LORazepam use.
      • Approximately three morphine doses and six LORazepam tablets were initially believed to remain; after administering one LORazepam tablet, six tablets remained.
        Caller: "There is there's seven. Now I have six. I'm giving her one now, so now I have six left."
        Explanation: Documents the updated LORazepam supply after the dose given during the call.
      • The bottle was identified as morphine sulfate oral solution labeled 100 mg per, with a presumed volume of 15 mL; the complete concentration was not confirmed.
        Caller: "It says morphine sulfate oral solution, one hundred mg per."
        Explanation: Documents the medication label information as heard, while preserving the incomplete concentration.

      Response
      • Planned to submit refill requests for morphine and LORazepam and notify the team of the reported remaining supply for delivery coordination.
        Nurse: "But I will try to put both of those in for you, and you know, let them know. You said you have three doses left of morphine, and then six doses left of the lorazepam."
        Explanation: Documents the planned refill request and communication of the reported medication supply.
      • Confirmed that LORazepam and morphine were available to administer every 4 hours, with morphine 0.25 mL by mouth every 4 hours as needed for pain.
        Nurse: "So you can go ahead and give those doses every four hours for her."
        Explanation: Documents the nurse's medication-frequency instruction addressing the caller's administration question.
      • Confirmed that LORazepam was ordered every 4 hours per tablet and morphine oral solution was ordered at 0.25 mL by mouth every 4 hours as needed for pain.
        Nurse: "She can have 0.25 milliliters by mouth every four hours as needed for pain, you know, ordered by her physician."
        Explanation: Documents the stated morphine dose, route, frequency, and PRN status.

      Education
      • Advised caller to maintain the 4-hour medication schedule while the patient was awake and to avoid waking her solely for pain medication.
        Nurse: "I wouldn't say wake her up if she's sleeping for the pain medications."
        Explanation: Documents guidance on medication timing during sleep and wakefulness.
      • Advised caller to change the patient's position approximately 30 to 45 minutes after medication administration when possible to support comfort.
        Nurse: "If she's able to change positions, like 30 to 45 minutes after the medication is administered, just to you know increase her comfort, of course."
        Explanation: Documents the recommended comfort measure and timing.
      • Instructed caller to wet the LORazepam tablet and place it under the patient's tongue if swallowing was difficult.
        Nurse: "You can wet the tablet and place it under her tongue, and that will, like, you know, give the best absorption."
        Explanation: Documents the alternate administration instruction for swallowing difficulty.
      • Advised caller to call back if the ordered medications did not provide adequate relief after consistent administration so the plan could be reassessed.
        Nurse: "If it doesn't help, or you know, she's really not getting any pain relief from the medication she has ordered after giving them pretty consistently, you know, please give us a call back."
        Explanation: Documents the callback expectation for persistent or inadequately controlled pain.
      • Advised caller to contact the hospice team with additional questions, concerns, or need for guidance.
        Nurse: "If you have any questions or concerns, you know, anything else, you know, or need some advice, anything, please don't hesitate to call us."
        Explanation: Documents the general callback invitation provided at encounter closure.
