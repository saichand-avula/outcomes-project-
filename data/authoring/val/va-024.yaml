transcript: |
  Nurse -> Riverbend Hospice, this is Tom.
  Caller -> Tom, it's Doris Montgomery. It's about my husband, Cecil. I'm worried. || caller_name, relationship, patient_name
  Nurse -> Hi, Doris. Cecil's date of birth?
  Caller -> March second, nineteen forty seven. || patient_dob
  Nurse -> And I have eight six four, five five five, zero one eight two. || callback_phone
  Caller -> Yes, that's the house. || callback_phone
  Nurse -> What's going on?
  Caller -> His pain has been terrible. A seven, all day. In his belly. And tonight he said something that scared me. || cc, A2
  Caller -> He said, if this pain doesn't stop, I'm going to take all the pills. || cc, A1, F1
  Nurse -> Okay. Thank you for telling me, Doris. That must have been frightening.
  Caller -> It was. He's never said that.
  Nurse -> Has he taken any extra pills tonight?
  Caller -> No. No, I checked. He hasn't. He's lying down. || A4
  Nurse -> Okay. Where do you keep his medications?
  Caller -> In a basket on the kitchen counter. The morphine, and all the other bottles. || A3
  Nurse -> Okay. I'd like you to move them tonight. Lock them up, or hide them somewhere he can't reach, and give him each dose yourself, and write it on a log. || E1
  Caller -> I can put them in my closet. I'll do that now.
  Nurse -> Good. Doris, I'm going to have our social worker call you today. || R1
  Caller -> Okay. Thank you.
  Nurse -> And I'll let our doctor know about his pain tonight, to review the plan. || R3
  Caller -> Please. He's suffering.
  Nurse -> I know. And I'll send a nurse out tomorrow morning. || R2
  Caller -> Tomorrow morning. Okay.
  Nurse -> You can also call or text nine eight eight any time, day or night. And if he takes extra pills, or tries to hurt himself, call nine one one right away. || E2
  Caller -> Nine eight eight. Nine one one. Okay.
  Nurse -> Stay close to him tonight.
  Caller -> I will. I'm not leaving him.
  Nurse -> You're doing everything right. Call me if anything changes.
  Caller -> Thank you, Tom.
