transcript: |
  Nurse -> Maple Lane Home Care, this is Beth.
  Caller -> Hi, Beth. It's Siobhan. S I O B H A N. I'm calling about my mother, Philomena Doyle. || caller_name, relationship, patient_name
  Nurse -> Hi, Siobhan. And your mother's date of birth?
  Caller -> August fourteenth, nineteen thirty nine. || patient_dob
  Nurse -> I have eight five seven, five five five, zero one seven six for you. Is that right? || callback_phone
  Caller -> Yes. || callback_phone
  Nurse -> What's going on?
  Caller -> My mom can't swallow her pills very well. The last week. She coughs and spits them out, especially the big ones. || cc, A2
  Caller -> I was thinking, I could just crush the metoprolol. The one she takes once a day. Is that okay? || cc, A1
  Nurse -> Which metoprolol is it? Is it the succinate, the extended release? || A1
  Caller -> Let me look. It says metoprolol succinate. Fifty milligrams. One tablet, once a day. || A1
  Nurse -> Okay. Siobhan, please don't crush that metoprolol succinate. It's extended release. If you crush it, the whole dose can go into her body at once, and that can drop her pulse and blood pressure. || R1
  Caller -> Oh. Oh no. I almost did it this morning. I'm so glad I called.
  Nurse -> I'm glad too. It's a common mix up. I'll message her prescriber, and ask for a form she can swallow more easily. || R2
  Caller -> Okay. Thank you.
  Nurse -> Does she choke on food or liquids too?
  Caller -> I don't think so. Just the pills. I think. || A3
  Nurse -> Okay. In the meantime, never crush or chew an extended release tablet. Have her sit upright, take a sip of water first, and then the tablet with a spoon of applesauce. || E1
  Caller -> Okay. Applesauce. I can do that.
  Nurse -> If she chokes, or her pulse drops under fifty, or she's dizzy, or she misses doses, call us. || E2
  Caller -> Okay. I will.
  Nurse -> Anything else?
  Caller -> No. Thank you so much.
