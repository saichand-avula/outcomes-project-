transcript: |
  Nurse -> Harborview Home Care, this is Cosima.
  Caller -> Hi. Hi. I don't know if I'm calling the right place. I'm Jarrett Sundquist. I'm a volunteer driver, with the senior meals. I'm at the house of Opal Fitch. She's on the floor. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Jarrett. Slow down. Opal Fitz is on the floor? Is she hurt?
  Caller -> I don't think so. She says she's fine. She's sitting on the kitchen floor. She won't, or can't, get up. I knocked and the door was open and I heard her calling. || A1
  Nurse -> Okay. Is she conscious? Talking to you?
  Caller -> Yes, yes. She's talking. She says she's fine. She keeps saying I'm fine, I'm fine, I just sat down.
  Nurse -> Did she fall, do you think?
  Caller -> I don't know. I wasn't here. She says she sat down on purpose. But she's on the floor, in front of the fridge. And the chair is across the room. So I don't know. || A3
  Nurse -> Okay. Did she hit her head?
  Caller -> She says no. I don't see any blood. Or a bump. Her hair is, I don't want to touch her. I don't think so.
  Nurse -> Did she pass out? Or did she black out, even for a moment?
  Caller -> I appreciate you being patient with me.
  Nurse -> Not a problem at all.
  Caller -> She says no. But I mean, I'm not sure she'd tell me. She's very proud. || A4
  Nurse -> Okay. Does anything hurt? Her hip, her back, her wrist?
  Caller -> One sec. My phone is making that beeping sound.
  Nurse -> No worries, I'll wait.
  Caller -> I asked. She says no. Nothing hurts. But then when I asked if she wanted me to help her up she said no, not yet. So maybe it does. I don't know. || A2
  Nurse -> That's a good observation. Don't lift her. Let's talk through this together. How old is she, do you know?
  Caller -> Sorry, I lost my train of thought.
  Nurse -> That's okay. We were just getting started.
  Caller -> Eighty something. I deliver there every Tuesday. She's always very nice. I don't know her birthday, I'm sorry. I only know her name from the delivery sheet.
  Nurse -> That's all right. I can find her with her name and address. What's the address?
  Caller -> Sorry, I keep going back and forth. It's been a long day.
  Nurse -> I understand. Take a breath.
  Caller -> Three twelve Birch. Birch Lane. I'm at her door. Wait. I'm inside. Three twelve.
  Nurse -> Got it. And what number are you on?
  Caller -> Nine oh one, five five five, zero one three seven. That's my cell. || callback_phone
  Nurse -> Thank you. Jarrett, here's what I want. Please do not try to lift her by yourself. It's easy to hurt her, or yourself. Get a blanket or a coat and put it over her. Put a cushion behind her back if there's one nearby. || E1
  Caller -> A blanket. There's a throw on the couch. I'll get it. Hang on.
  Nurse -> Take your time.
  Caller -> Can I ask you to hold for a moment? The kettle is going.
  Nurse -> Of course.
  Caller -> Okay. I put it on her shoulders. She says thank you. She says, you're a nice boy. I'm fifty two.
  Nurse -> Ha. That's sweet.
  Caller -> Yes.
  Nurse -> Now, I'm going to page the on-call clinician, and I'm sending a nurse out. She should be there within two hours. || R1, R2
  Caller -> Two hours. Okay. I can stay. I don't have another route until four.
  Nurse -> That's very kind. Please stay with her. I'm also going to have a nurse call you.
  Caller -> Sorry, I'm writing this down as we go.
  Nurse -> Good idea. I'll pause.
  Caller -> Okay. What if she wants to get up? She keeps trying to push on the floor.
  Nurse -> Tell her to wait. Is she able to move her legs, both arms? Without pain?
  Caller -> Can you hear me okay? The signal's a little weak.
  Nurse -> I can hear you fine.
  Caller -> Hold on. Opal, can you wiggle your toes? She's wiggling. Both feet. She says that's fine. She can move her arms.
  Nurse -> Good. And her color? Is she pale or sweaty?
  Caller -> Okay. I'm back. What was the question?
  Nurse -> I'll repeat it, no trouble.
  Caller -> Sorry, I just dropped my pen.
  Nurse -> That's all right.
  Caller -> I think the line cut out for a second. Are you still there?
  Nurse -> Yes, I'm here.
  Caller -> She's normal. A little pink. She's talking my ear off about the cat.
  Nurse -> Okay. Keep her talking. That's good. If she has any pain, if she can't move a leg, if she gets confused or hard to wake up, or if she has trouble breathing, call nine one one right away. || E2
  Caller -> Pain. Can't move a leg. Confused. Hard to wake. Trouble breathing. Nine one one. Got it. I'm writing it on the delivery sheet.
  Nurse -> Perfect.
  Caller -> Um. Let me think. I'm trying to remember.
  Nurse -> Take your time, there's no rush.
  Caller -> Should I call her family?
  Nurse -> We'll contact the family from our records. You just stay with her.
  Caller -> Okay. I will.
  Nurse -> Thank you for calling, Jarrett. You did the right thing.
  Caller -> I almost didn't. I wasn't sure it was an emergency.
  Nurse -> It's never wrong to call.
  Caller -> I'll sit with her. I'll sit on the floor too. She likes company.
  Nurse -> That's lovely.
  Caller -> Thank you. I'll wait.
