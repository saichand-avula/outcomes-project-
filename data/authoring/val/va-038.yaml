  Nurse -> Okay. Marjorie, I want you to hang up and call nine one one right now. This could be his heart. He needs an ambulance. || R1, F2, E1
  Caller -> Okay. Okay. Right now?
  Nurse -> Right now. Please. I'll stay here until you do. Is the front door unlocked?
  Caller -> I'll unlock it. I'm going to call.
  Nurse -> What's your address? In case they ask you and you're flustered.
  Caller -> Four eleven Elm Street. Four eleven Elm. I live right off Main.
  Nurse -> Good. Four eleven Elm Street. Tell them that.
  Caller -> Four eleven Elm. Okay.
  Nurse -> Good. Have him sit and rest, don't let him walk around. And get his medication list ready for the paramedics. || E1
  Caller -> Okay. I'll get the list. It's on the fridge.
  Nurse -> And don't drive him yourself. Let the ambulance take him. And stay with him. || E2
  Caller -> I will. I will. Hold on.
  Nurse -> I'm calling the hospital now, so they know he's coming. || R2
  Caller -> Okay. Thank you, Rhonda. I'm calling now.
  Nurse -> Go. Go ahead.
