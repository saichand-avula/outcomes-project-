  Nurse -> Okay. What's his dose?
  Caller -> Two point five milliliters, of the one hundred milligrams per milliliter. Twice a day. I gave it at eight this morning. || A1
  Nurse -> Okay. And he threw up about ten minutes later?
  Caller -> Yes. And then once more around nine. So twice. He seems to have a stomach bug. || A2
  Nurse -> Okay. Has he had any seizure activity? Any staring, or jerking?
  Caller -> No. No seizures. He's been fine that way. || A3
  Nurse -> Okay. Does he have a fever?
  Caller -> No fever. || A4
  Nurse -> Okay. Hannah, don't give another dose of the levetiracetam yet. I want to check with his neurologist first, because the answer depends on how long it was in his stomach. || R1
  Caller -> Okay. But I'm worried about missing it.
  Nurse -> I understand. That's why I'll send an urgent message to neurology now. || R2
  Caller -> Okay. Thank you.
  Nurse -> I'll call you back within the hour with their answer. || R3
  Caller -> Okay. I'll wait.
  Nurse -> In the meantime, stay close to Aiden. If he has a seizure, keep him on a soft surface, nothing in his mouth, and time it. || E1
  Caller -> Okay. I know what to do.
  Nurse -> If a seizure goes longer than five minutes, or he has more than one, or has trouble breathing afterwards, call nine one one. || E2
  Caller -> Nine one one. Okay.
  Nurse -> Is he able to keep sips of fluid down now?
  Caller -> He took a few sips of water. He's holding it.
  Nurse -> Good. Small sips. Talk to you soon.
  Caller -> Thank you, Ana.
