transcript: |
  Nurse -> Juniper Ridge Hospice, this is Lena.
  Caller -> Lena, it's Joaquin Valdez. It's my father, Edmund. Please, I need someone to come. || caller_name, relationship, patient_name, F2
  Nurse -> Hi, Joaquin. What's Edmund's date of birth?
  Caller -> September fourteenth, nineteen forty three. || patient_dob
  Nurse -> And your number is five oh five, five five five, zero one eight one? || callback_phone
  Caller -> Yes. Yes, that's right. || callback_phone
  Nurse -> Tell me what's happening.
  Caller -> He's so agitated. He's pulling at his catheter, he's trying to climb out of bed. It's been two hours and he won't settle. || cc, A1, F1
  Nurse -> Okay. What have you given him?
  Caller -> The lorazepam. One milligram. I gave him one at ten, and another one about twenty minutes ago. And it's not working. He's not settling at all after two doses. || A2, F1
  Nurse -> Okay. Does he have the catheter in?
  Caller -> Yes. He has a catheter. He keeps grabbing at it. || A3
  Nurse -> Okay. Do you think he's in pain?
  Caller -> I don't think so. He isn't grimacing. I think it's the confusion. I think. || A4
  Nurse -> Okay. Joaquin, I'm paging the on-call doctor right now. Hold on. Okay, I've sent the page. || R1
  Caller -> Okay. Please. Please send someone. I can't hold him down. I don't want to hurt him.
  Nurse -> I'm sending the on-call nurse to you. She'll be there within forty five minutes. || R3
  Caller -> Forty five minutes. Okay. Okay.
  Nurse -> Please don't give him any more lorazepam until the doctor gives us orders. I don't want him oversedated. || R2
  Caller -> Okay. No more lorazepam. || R2
  Nurse -> Stay with him. Keep the bed low, and gently keep his hands away from the catheter. Don't hold him down. || E1
  Caller -> Okay. I'm holding his hands. Gently.
  Nurse -> Dim the lights, and talk to him slowly and calmly. Turn off the TV. || E2
  Caller -> Okay. The lights are going down. Dad, it's okay. It's Joaquin. It's okay.
  Nurse -> That's great. If he falls, or gets combative, or is very hard to wake, call me right away. || E3
  Caller -> Okay. I will.
  Nurse -> I'll stay on the line a few minutes.
  Caller -> Thank you. Thank you, Lena.
