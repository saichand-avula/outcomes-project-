transcript: |
  Nurse -> Maple Lane Home Care, this is Ingrid.
  Caller -> Hi, Ingrid. It's Linus Ballantyne. I'm calling about my mom, Eugenia Ballantyne. She's on your service. || caller_name, relationship, patient_name
  Nurse -> Hi, Linus. How can I help?
  Caller -> I have a pill question. About her leg pain meds. I think I'm confused about which is which. || cc
  Nurse -> Sure. Let's sort it out together.
  Caller -> Thanks. I've been staring at these bottles for twenty minutes.
  Nurse -> That's what I'm here for. Which medicines are you looking at?
  Caller -> There's two. One is the gabapentin. And one is the oxycodone. I've got the bottles on the counter. || A1, A2
  Nurse -> Okay. Read me the gabapentin label. || A1
  Caller -> Gabapentin. One hundred milligrams. Three times a day. No wait. Hang on. Let me look at it again. I'm reading the wrong line. It's three hundred milligrams. Three hundred. Three times a day. || A1
  Nurse -> Three hundred milligrams, three times a day. Okay. When was her last dose?
  Caller -> At noon. I gave it with her lunch.
  Nurse -> Good. And the oxycodone? || A2
  Caller -> Oxycodone, five milligrams. Every four hours as needed for pain. It says one tablet. || A2
  Nurse -> When did she last have it?
  Caller -> Two o'clock. Right after her nap. She said her leg was killing her. So I gave her one.
  Nurse -> Okay. Did it help?
  Caller -> Yes, some. She said it went from a seven to a five. But it's still there. It's a dull, throbby ache in the calf. || A3
  Nurse -> Okay. Is she sleepy? More sleepy than usual?
  Caller -> No. She's awake. She's watching her game shows. She's, you know, she's herself. She's yelling at the contestants. || A4
  Nurse -> Does she get the answers right?
  Caller -> Mostly. She's insufferable about it.
  Nurse -> Ha. That's a good sign.
  Caller -> Yeah. She's got opinions.
  Nurse -> What's her date of birth, Linus?
  Caller -> November thirtieth, nineteen forty one. || patient_dob
  Nurse -> And your number in case I need to call back?
  Caller -> Eight oh eight, five five five, zero one five eight. || callback_phone
  Nurse -> Got it. So what's your question exactly?
  Caller -> I don't know which one she's supposed to take when. Like, the gabapentin, is that for the pain? Or is that a different thing? And can I give the oxycodone right now, because she's hurting again? It's almost five. || A1, A2
  Nurse -> Good question. They work differently. The gabapentin is for nerve pain. She takes it three times a day, every day, on a schedule, whether or not she's hurting. It builds up and works over time. || A1
  Caller -> Okay. So that's not a, an as needed one.
  Nurse -> Right. It's scheduled. The oxycodone is the as-needed. You give it only when she has pain, and there has to be at least four hours between doses. || E1
  Caller -> Four hours. Two o'clock, so, six o'clock.
  Nurse -> Correct. It's almost five now, so she'd have to wait until after six.
  Caller -> Okay. But she's hurting now. What do I do for the next hour?
  Nurse -> Try a warm compress on the calf, keep the leg propped up, and see if she'd like a distraction. Is her next gabapentin due at dinner? || A1
  Caller -> Yes. At dinner. Around six.
  Nurse -> That's fine. Give the gabapentin at dinner. You can give the oxycodone at six too, if she still needs it. It's safe to give them close together as long as she isn't very sleepy. || A1, A2
  Caller -> At six. Both. If she needs it. Okay. And if she's sleepy?
  Nurse -> Then skip the oxycodone and call us. Some people get drowsy when both are in their system. || A2
  Caller -> Okay. That makes sense. I'll watch her.
  Nurse -> Did you give any other medicine for the leg? Tylenol? Ibuprofen?
  Caller -> No. Just those two.
  Nurse -> Good. Please don't add any other pain pills without asking us.
  Caller -> Okay. I won't.
  Nurse -> I'm going to call you tomorrow morning to see how she did overnight. || R1
  Caller -> Tomorrow morning. That's great. What time?
  Nurse -> Between nine and ten.
  Caller -> I'll be here. I work from home.
  Nurse -> That helps. Is she alone when you're on calls?
  Caller -> No, I set up in the living room next to her. She talks through my meetings.
  Nurse -> Perfect. And Linus, call us if she gets very sleepy, confused, or if the pain stays high even after the oxycodone. || E2
  Caller -> Sleepy. Confused. Pain doesn't budge. Okay.
  Nurse -> Is the leg swollen or red or warm?
  Caller -> No. It looks the same as last week. The nurse looked at it on Monday.
  Nurse -> Good. That's reassuring.
  Caller -> Do you want me to write down the times? Like a log?
  Nurse -> Yes, that's a great idea. Write the drug, the dose, and the time every time you give it.
  Caller -> I have a notepad on the fridge. I'll put it there.
  Nurse -> Good. Also keep both bottles on a high shelf, away from the TV tray.
  Caller -> They are. I put them in the cabinet after each dose.
  Nurse -> Perfect.
  Caller -> I'm sorry I got the gabapentin mixed up. I'm still learning all this. || A1
  Nurse -> You caught it yourself, Linus. That's exactly what we want. Always read the label twice.
  Caller -> Twice. I'll make it a rule.
  Nurse -> Perfect.
  Caller -> I will. Thank you, Ingrid.
  Nurse -> You're welcome. Talk tomorrow.
  Caller -> Bye.
