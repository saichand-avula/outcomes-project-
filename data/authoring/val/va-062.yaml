transcript: |
  Nurse -> Pelican Bay Home Health, this is Ansgar.
  Caller -> Hi, Ansgar. It's Anders Kowalczyk. I'm a patient. I have the heart failure. I wanted to call about my weight. It's up. || caller_name, patient_name, relationship, cc
  Nurse -> Hi, Anders. Okay. Let me get your date of birth first.
  Caller -> June eighth, nineteen seventy one. || patient_dob
  Nurse -> June eighteenth, nineteen seventy one. Got it.
  Caller -> No, June eighth. The eighth. Not the eighteenth. Just eight. || patient_dob
  Nurse -> My apologies. June eighth, nineteen seventy one. Is that right?
  Caller -> Sorry, I'm writing this down as we go.
  Nurse -> Good idea. I'll pause.
  Caller -> That's it. People mishear it all the time.
  Nurse -> Thank you. Now, tell me about the weight.
  Caller -> I weighed this morning. Two hundred fourteen. Last Saturday I was two hundred ten. So four pounds. In two days. || A1
  Nurse -> Okay. Two hundred fourteen this morning. What happened between Saturday and now?
  Caller -> Honestly? Pizza. A whole weekend of pizza. My nephew's birthday. And chips. And then Sunday we had ham. I know. I know. I should have known better.
  Nurse -> It happens. How are your ankles?
  Caller -> Puffy. A little. Both of them. I can see the sock marks. And my shoes feel tight. || A2
  Nurse -> And your breathing?
  Caller -> I'm a little winded on the stairs. I have to stop on the landing. That's new. Usually I go up without thinking about it. || A3
  Nurse -> Okay. At rest, are you short of breath? Lying flat?
  Caller -> No. When I'm sitting, I'm fine. I slept on one pillow. No chest pain, nothing like that. || A5
  Nurse -> Good. Are you taking your furosemide? || A4
  Caller -> Yes. Forty milligrams every morning. I took it this morning, at seven. || A4
  Nurse -> Have you taken anything else for the swelling?
  Caller -> No. Just that.
  Nurse -> And your number, in case I need to call back?
  Caller -> Okay. I've got a notebook now. Go ahead.
  Nurse -> Alright.
  Caller -> Six oh two, five five five, zero one eight six. || callback_phone
  Nurse -> Perfect. Anders, a four pound gain in two days is more than we like. I'm going to send a message to the clinician with your weight and your symptoms. || R1
  Caller -> Okay. Good. Do you think they'll change my water pill?
  Nurse -> They might. That's their decision. I'll also schedule a nurse visit tomorrow to check your weight, your lungs, and your swelling. || R2
  Caller -> Tomorrow. Okay. In the morning?
  Nurse -> The scheduler will call with a window. Probably morning.
  Caller -> Sorry, I'm writing this down as we go.
  Nurse -> Good idea. I'll pause.
  Caller -> Okay. I'll be here. I work from home on Wednesdays.
  Nurse -> In the meantime, weigh yourself every morning. After you use the bathroom, before you eat, same scale, same clothes. Write it down. If you gain more than two pounds in a day, or five pounds in a week, call us. || E1
  Caller -> Every morning. Same scale. Write it down. Two in a day, five in a week. Okay. I have a log. It's on the fridge.
  Nurse -> Great. Now the food. Keep your salt low. That means skipping the pizza, canned soup, deli meat, chips. And keep your fluids to what the doctor told you. || E2
  Caller -> Low salt. No pizza. I know. I'll go back to the plan.
  Nurse -> Don't beat yourself up. One weekend. Just get back on track.
  Caller -> Thank you. I appreciate that. I'm usually good. My wife keeps me honest.
  Nurse -> Ha. A good wife.
  Caller -> Sorry, the dog is barking. Hold on.
  Nurse -> Ha, no worries.
  Caller -> The best. She's hiding the chips.
  Nurse -> Ha.
  Nurse -> Anders, if you get chest pain, severe shortness of breath, or you faint, call nine one one. Don't wait. || E3
  Caller -> Chest pain. Bad breathing. Fainting. Nine one one. Okay.
  Nurse -> Any questions?
  Caller -> Can I ask you to hold for a moment? The kettle is going.
  Nurse -> Of course.
  Caller -> Just one. Can I still walk? I walk the dog every morning. Should I stop?
  Nurse -> Short, slow walks are fine. Stop if you get winded or dizzy.
  Caller -> Um. Let me think. I'm trying to remember.
  Nurse -> Take your time, there's no rush.
  Caller -> Okay. Slow. He pulls, but I'll hold him.
  Nurse -> What kind of dog?
  Caller -> Sorry, I lost my train of thought.
  Nurse -> That's okay. We were just getting started.
  Caller -> A beagle. He's a menace.
  Nurse -> Ha. Beagles are.
  Caller -> Sorry, somebody's at the door. Hang on a second.
  Nurse -> No problem, I'll hold.
  Caller -> He ate a sock last week. We had a whole vet visit.
  Nurse -> Oh no. Is he okay?
  Caller -> Let me grab my glasses, one second.
  Nurse -> Sure, I'll wait.
  Caller -> He's fine. The sock was not.
  Nurse -> Ha. Good.
  Caller -> Can you hear me okay? The signal's a little weak.
  Nurse -> I can hear you fine.
  Caller -> Thanks, Ansgar.
  Nurse -> You're welcome. Take care, Anders.
  Caller -> You too. Bye.
