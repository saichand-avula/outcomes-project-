transcript: |
  Nurse -> Prairie Rose Home Care, this is Estelle.
  Caller -> Hi, Estelle. It's Magnus Strathearn. My father is Ferdinand Strathearn. I think the pharmacy gave us the wrong pill. || caller_name, relationship, patient_name, cc, F1
  Nurse -> Okay, Magnus. Tell me what you're seeing.
  Caller -> The discharge paper says hydralazine. For his blood pressure. Twenty five milligrams, three times a day. But the bottle from the pharmacy says hydroxyzine. Hydroxy, not hydral. Twenty five milligrams. Three times a day. The same. || A1, A2
  Nurse -> Okay. Let me make sure I have this. The paper says H Y D R A L A Z I N E.
  Caller -> Yes. And the bottle says H Y D R O X Y Z I N E. They look almost the same. I only caught it this morning because I was reading the paper again.
  Nurse -> Okay. Is he taking the pills from that bottle?
  Caller -> Sorry, I'm a little scattered today.
  Nurse -> That's completely understandable.
  Caller -> He took one last night. At bedtime. The bottle was new. I gave it to him.
  Nurse -> One tablet. And none today?
  Caller -> None today. I stopped as soon as I saw it. I haven't given the morning one.
  Nurse -> Good. That's the right thing. How is he now?
  Caller -> One sec. My phone is making that beeping sound.
  Nurse -> No worries, I'll wait.
  Caller -> Is it okay if I put you on speaker? My hands are full.
  Nurse -> That's fine.
  Caller -> Kind of sleepy. He's in his chair. He keeps nodding off. He's not out of it. He answers me. But more tired than usual. || A3
  Nurse -> Okay. Do you have a blood pressure cuff?
  Caller -> I think the line cut out for a second. Are you still there?
  Nurse -> Yes, I'm here.
  Caller -> Sorry, somebody's at the door. Hang on a second.
  Nurse -> No problem, I'll hold.
  Caller -> Yes. I took it. Hang on. It was a hundred sixty eight over ninety six. That's high for him. || A4
  Nurse -> Okay. Thank you. Is he having a headache, chest pain, vision changes?
  Caller -> No. No headache. No chest pain. He says he's just sleepy.
  Nurse -> Good. What's his date of birth, Magnus?
  Caller -> Sorry, I lost my train of thought.
  Nurse -> That's okay. We were just getting started.
  Caller -> September seventeenth, nineteen forty six. || patient_dob
  Nurse -> And your number?
  Caller -> Sorry, somebody's at the door. Hang on a second.
  Nurse -> No problem, I'll hold.
  Caller -> Sorry, I keep going back and forth. It's been a long day.
  Nurse -> I understand. Take a breath.
  Caller -> Six one zero, five five five, zero one zero three. || callback_phone
  Nurse -> Got it. Here's what I want you to do. Do not give any more from that bottle. Keep the bottle and the discharge paper together, in a bag, so we can show the pharmacy. Don't throw anything away. || E1
  Caller -> Don't give any more. Bottle and paper together. Okay. I'll put them in a bag right now.
  Nurse -> I'm going to page the on-call clinician about the blood pressure and the wrong tablet. They'll tell you what to do about the hydralazine. || R1
  Caller -> Okay. Does he need to go to the hospital?
  Nurse -> That's for the clinician. Right now he's alert and not having chest pain, so we're watching. I'll also call the pharmacy to find out what was dispensed. || R2
  Caller -> I called them already. They said they'd look into it. But they didn't sound sure.
  Nurse -> I'll follow up directly. And I'm sending a nurse to see him this afternoon. || R3
  Caller -> This afternoon. Okay. What time?
  Nurse -> The scheduler will call you. Probably one to three.
  Caller -> I appreciate you being patient with me.
  Nurse -> Not a problem at all.
  Caller -> I'll be here. I'm working remotely.
  Nurse -> Magnus, call nine one one if he has chest pain, a severe headache, confusion, weakness on one side, or if he's hard to wake. || E2
  Caller -> Chest pain. Bad headache. Confused. One side weak. Hard to wake. Nine one one. Okay.
  Nurse -> Good. Do you know what hydroxyzine is for? || A1
  Caller -> Okay. I'm back. What was the question?
  Nurse -> I'll repeat it, no trouble.
  Caller -> It's an allergy pill, right? It makes you sleepy. That's why I'm nervous.
  Nurse -> That's right. One tablet is usually not dangerous, but it can make him drowsy. That's why we're checking him.
  Caller -> Okay. I've got a notebook now. Go ahead.
  Nurse -> Alright.
  Caller -> Okay. That's what I thought.
  Nurse -> Don't beat yourself up. The labels are very similar. Pharmacies mix these up more than people know.
  Caller -> Sorry, I lost my train of thought.
  Nurse -> That's okay. We were just getting started.
  Caller -> I'm just glad I caught it.
  Nurse -> You did. Anything else?
  Caller -> Sorry, the dog is barking. Hold on.
  Nurse -> Ha, no worries.
  Caller -> No. That's it. Thank you, Estelle.
  Nurse -> The clinician will call you within fifteen minutes.
  Caller -> I'll keep my phone close.
  Nurse -> Take care.
