transcript: |
  Nurse -> Cypress Home Health, this is Lorenzo.
  Caller -> Lorenzo, hi. This is Teodor Marchetti. My wife is Odette Marchetti. She took too much Lantus. Twenty units. It was supposed to be ten. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Teodor. Is she awake? Is she talking?
  Caller -> She's awake. She's sitting on the kitchen chair. She's shaky. She's sweating. I checked her sugar. It's forty eight. || A3, A2, F2
  Nurse -> Forty eight. Okay. Can she swallow?
  Caller -> Yes. She's talking to me. She's mad at herself.
  Nurse -> Do you have juice or something sweet in the house?
  Caller -> Orange juice. In the fridge. Hang on. Let me get it.
  Nurse -> Go ahead. I'll stay on the line.
  Caller -> Okay. I have a glass. It's about, I don't know, a cup.
  Nurse -> Give her half a cup. Let her sip it. Don't rush it.
  Caller -> Odette, drink this. Drink. Okay. She's drinking. She says it's too sweet.
  Nurse -> That's good. Teodor, how did this happen?
  Caller -> Okay. Sorry about that. Go on.
  Nurse -> Alright, thank you.
  Caller -> She has two pens. The Lantus and the, the mealtime one. They look the same. She grabbed the wrong one first and then dialed twenty without looking. No. She grabbed the right one but she dialed twenty instead of ten. I'm not sure. She says she just dialed it wrong. || A1
  Nurse -> And the Lantus is once a day at bedtime? || A1
  Caller -> Yes. Once a day. At bedtime. Ten units. She took it about forty minutes ago.
  Nurse -> Okay. Did she eat dinner?
  Caller -> At six. A normal dinner. Chicken and rice.
  Nurse -> Good. Now, how's she looking? Any confusion, slurred speech?
  Caller -> No. She's a little pale. She's clear. She knows the date. She just told me the president's name. Ha.
  Nurse -> Has she passed out or had a seizure?
  Caller -> No. Nothing like that. She's just shaky. || A5
  Nurse -> Okay. What's her date of birth, Teodor?
  Caller -> Hang on, let me move to the other room. It's loud in here.
  Nurse -> No problem, take your time.
  Caller -> July twenty second, nineteen seventy nine. || patient_dob
  Nurse -> And a phone number?
  Caller -> Eight one six, five five five, zero one eight eight. || callback_phone
  Nurse -> Got it. How long since she started the juice?
  Caller -> Maybe ten minutes. No, five. It's been a few minutes.
  Nurse -> Okay. Recheck her sugar at fifteen minutes. Let's wait until then.
  Caller -> Sorry, I lost my train of thought.
  Nurse -> That's okay. We were just getting started.
  Caller -> Okay. I'll watch the clock. Odette, how do you feel?
  Nurse -> What's she saying?
  Caller -> Wait, say that again? I missed the first part.
  Nurse -> Of course. Let me say it slower.
  Caller -> She says better. A little. Less shaky.
  Nurse -> Good. Tell me when it's fifteen minutes.
  Caller -> I'm looking at the microwave clock. Hold on. Okay. It's been fifteen. I'm checking. Okay. It says ninety two. Ninety two. || A4
  Nurse -> That's much better. But the Lantus is long acting. Twenty units is double what she needs, so her sugar can drop again in the next hours. I want her to eat something with protein and carbs now. A sandwich or crackers with peanut butter. || A1
  Caller -> I have peanut butter crackers. She likes those.
  Nurse -> Perfect. Then recheck again in an hour, and set an alarm to check every two hours tonight. Stay with her. Don't leave her alone. || E1
  Caller -> Every two hours. Stay with her. I'm not sleeping anyway. I'll set my phone.
  Nurse -> I'm going to page the on-call clinician now, and they'll call you about whether to adjust anything. || R1
  Caller -> Okay. Thank you. Should I call an ambulance?
  Nurse -> Not right now, since she's recovering. But if she can't swallow, if she won't wake up, or if she has a seizure, call nine one one right away. || E2
  Caller -> Can't swallow. Won't wake. Seizure. Nine one one. Okay. I have my phone right here.
  Nurse -> And I'll send a nurse out tomorrow morning to go over the pens with both of you. || R2
  Caller -> That would help. We need a system. Something so she can't mix them up.
  Nurse -> The nurse will help. Different pen colors, labels, and a place for each.
  Caller -> I'm so angry at myself. I should have been paying attention.
  Nurse -> It's not your fault, Teodor. Mix ups happen. You caught it fast. That's what matters.
  Caller -> Okay. Thank you.
  Nurse -> Check on her now. How's her color?
  Caller -> Sorry, the dog is barking. Hold on.
  Nurse -> Ha, no worries.
  Caller -> Better. She's pink. She's eating a cracker. She's saying, don't make a fuss. Ha.
  Nurse -> Ha. That's a good sign.
  Caller -> She's very stubborn.
  Nurse -> Keep her sitting up and let her finish her snack.
  Caller -> One sec. My phone is making that beeping sound.
  Nurse -> No worries, I'll wait.
  Caller -> Yes. I will.
  Nurse -> The clinician will call within fifteen minutes. Keep your phone close.
  Caller -> Let me grab my glasses, one second.
  Nurse -> Sure, I'll wait.
  Caller -> Yes. Thank you, Lorenzo.
  Nurse -> Anytime. Call back if she gets worse.
  Caller -> I will. Bye.
