transcript: |
  Nurse -> Ashford Home Care, this is Delia.
  Caller -> Hi there! Good afternoon! How are you doing today?
  Nurse -> I'm fine. How can I help you?
  Caller -> Wonderful, wonderful. I'm calling on behalf of SafeStep Alert. We're a medical alert company. Am I speaking with the person who makes the purchasing decisions for your agency?
  Nurse -> No. This is a nursing line. It's for patients and families.
  Caller -> Oh, sure, sure. But maybe you can help me. We have a brand new fall detection pendant. It senses a fall automatically, even if the person can't press the button. It's very popular with agencies like yours.
  Nurse -> I'm sorry, we don't buy equipment through this line.
  Caller -> Totally understand. I just wanted to ask, do you have a lot of patients who are at risk for falls? Because this could really be a game changer for them.
  Nurse -> I'm not able to discuss anything about our patients.
  Caller -> No, no, of course. Of course. I'm just asking in general. Like, a lot? A few?
  Nurse -> Sir, I can't help with that. This line is for clinical calls.
  Caller -> Okay. Okay. Um. Can I just send you some information? An email. A brochure. It's free.
  Nurse -> You can mail it to the administrative office. Not this line.
  Caller -> Great. What's the address?
  Nurse -> Check our website. It's on the contact page.
  Caller -> Perfect. Perfect. And, uh, who would I ask for there?
  Nurse -> The office manager.
  Caller -> Wonderful. And the name of the office manager?
  Nurse -> I'm not going to give out names. Please send it to the attention of the office manager.
  Caller -> Absolutely. No problem. Hey, it's a beautiful day out there, isn't it? We finally got some sun.
  Nurse -> It is. I need to keep this line open, though.
  Caller -> Oh, I know. I know you're busy. Just one more thing. The pendant is only twenty nine ninety nine a month. That's less than a dollar a day.
  Nurse -> That's nice. Could you please take our number off your list?
  Caller -> Oh. Sure. Sure. I can do that. It might take a few days to go through.
  Nurse -> Thank you. Please do it today.
  Caller -> I will. I'll put a note right now. Sorry to bother you.
  Nurse -> It's okay. Goodbye.
  Caller -> You have a blessed day!
