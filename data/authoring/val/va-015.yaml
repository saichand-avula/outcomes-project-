  Caller -> No. No nosebleeds. No black stools. I haven't seen any bruises. And no headache. || A2
  Nurse -> Okay. That's good. Chester, I've already left a message for your doctor and for the anticoagulation clinic, while we were talking. They'll call you. || R1
  Caller -> Oh good. Thank you.
  Nurse -> Don't take tonight's warfarin until they call you back and tell you what to do. || R2
  Caller -> Okay. No warfarin tonight until they call. Got it. || R2
  Nurse -> And I'll call you back within the hour to see if you've heard. || R3
  Caller -> Okay.
  Nurse -> Watch for any nosebleeds, bleeding gums, black or bloody stools, blood in your urine, new bruises, or a headache. || E1
  Caller -> Okay. I'll watch.
  Nurse -> If you hit your head, or you get a severe headache, or you vomit blood, or have black stools, or bleeding that won't stop, call nine one one. || E2
  Caller -> Nine one one. Okay.
  Nurse -> Do you use a pill organizer?
  Caller -> No. I just use the bottle.
  Nurse -> A weekly organizer with a log helps. Then you can see if you've already taken it. || E3
  Caller -> That makes sense. My wife keeps telling me that.
  Nurse -> She's right. Anything else, Chester?
  Caller -> No. Thank you.
