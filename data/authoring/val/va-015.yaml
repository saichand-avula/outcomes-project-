  Caller -> I think I made a mistake. I took two warfarin last night. Two of them. By accident. || cc, A1, F1
  Nurse -> Okay. Tell me what happened.
  Caller -> I take one, five milligrams, every night at eight. And last night I took it, and then I forgot I took it, and around nine I took another one. || A1, A3
