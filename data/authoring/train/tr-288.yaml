transcript: |
  Nurse -> Harborview Home Health, this is Paulette.
  Caller -> Hello? Is this Dr. Kessler's office?
  Nurse -> No, I'm sorry. This is Harborview Home Health. I think you may have the wrong number.
  Caller -> Oh. Oh no. Is this not the dentist?
  Nurse -> No, sir. We're a home nursing agency.
  Caller -> Well, shoot. I wrote the number on the back of my hand and I can't, the ink is smeared. I called it twice. Is this five five five, zero one four seven?
  Nurse -> This one is zero one four one.
  Caller -> Zero one four one. And I dialed zero one four seven. Oh, I did the seven. No wait. I see what happened. I think the seven looks like a one.
  Nurse -> Ha. That happens. Does the dentist's office have the same area code as we do?
  Caller -> I think so. It's the one down on Main, next to the hardware store.
  Nurse -> I don't have their number, but if you look them up, the number is probably very close to ours. Maybe try the one ending in zero one four seven again and see?
  Caller -> I did try that. That's what I dialed and I got you. Hmm.
  Nurse -> Then it might be a different number. I'd look it up in the phone book or online.
  Caller -> I don't have a computer. My granddaughter does that. She's at school.
  Nurse -> Is there a neighbor who could look it up for you?
  Caller -> My neighbor Dolly has one of the phones with the internet. I'll go knock. She won't mind.
  Nurse -> That sounds like a plan.
  Caller -> I've got a tooth that's killing me. It's been three days. I was going to ask for an appointment. It's the back one, on the bottom. I can't chew on that side.
  Nurse -> I'm sorry to hear that. That sounds miserable. A dentist can probably see you quickly if you tell them it hurts.
  Caller -> I'll tell them. Thank you. I didn't mean to bother you. You must be busy.
  Nurse -> It's no bother at all. I hope you feel better soon.
  Caller -> Me too. Oh, one more question. Do you all do home visits for, like, old people?
  Nurse -> We do, for people who need nursing care at home and have a doctor's order. If you ever need that, call us back.
  Caller -> I'll remember. I'm not quite there. I just turned seventy. Ha.
  Nurse -> Ha. Seventy's young. Take care of that tooth.
  Caller -> I will. Thank you, miss. Goodbye.
  Nurse -> Goodbye.
