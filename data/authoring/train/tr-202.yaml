transcript: |
  Nurse -> Summit Palliative Care, this is Carla.
  Caller -> Hi, Carla. This is Corinne Whitcomb. I'm calling about my brother Arlen. The pharmacy gave him the wrong medicine. || caller_name, relationship, cc, F1
  Nurse -> Okay, Corinne. I'm listening. What's Arlen's full name, and his date of birth?
  Caller -> Arlen Whitcomb. W H I T C O M B. April fourth, nineteen eighty eight. || patient_name, patient_dob
  Nurse -> And a good number for you?
  Caller -> Two eight one, five five five, zero one four two. || callback_phone
  Nurse -> Got it. Tell me what happened with the medicine.
  Caller -> So he's supposed to get Lamictal. A hundred milligrams, twice a day. For his seizures. I picked it up an hour ago, and the bottle says Lamisil. L A M I S I L. That's not what he takes. || A1, A2, F1
  Nurse -> Okay. Thank you for checking the label. Has he taken any from that bottle?
  Caller -> No. No, not a one. I looked before I opened it. He had his Lamictal this morning from the old bottle, so he's okay for now. || A3, A2
  Nurse -> Good. That's good. I'm calling the pharmacy right now, while we're talking. || R1
  Caller -> Oh. Okay.
  Nurse -> Okay. I did reach them. They say they'll fix it and bring the right bottle out to you. || R1
  Caller -> Oh, thank goodness. Today? He can't miss the evening dose.
  Nurse -> I'll make sure they know that. I'm also going to message his provider about the mix-up. || R2
  Caller -> Thank you. Thank you so much.
  Nurse -> Please don't give him anything from the Lamisil bottle, and keep it so the driver can take it back. Don't mix it in with his other bottles. || E1, A1
  Caller -> Don't give the Lamisil. Keep the bottle. Okay. It's in a bag on the counter.
  Nurse -> Perfect. I'll call you back this afternoon to confirm the delivery. || R3
  Caller -> This afternoon. Okay. I'll be here.
  Nurse -> Anything else I can help with, Corinne?
  Caller -> No, I don't think so. I was worried sick. He's been through so much already. I didn't want one more thing.
  Nurse -> I know. You did exactly the right thing by checking.
  Caller -> Thank you, Carla.
