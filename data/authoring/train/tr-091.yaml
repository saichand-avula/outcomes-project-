  Caller -> Then at ten I gave her one more. A half. || A1
  Caller -> Okay. So that's a milligram at eight and a half at ten. Her order is a half milligram, one tablet, every four hours. || A1, label_error
  Nurse -> Yes. And now she's so sleepy. She's been sleeping since like eleven. || A2, label_error
  Caller -> Is she breathing okay? Does she wake up when you say her name? || A3, label_error
  Nurse -> She is. She's breathing normal. When I say Mama, she opens her eyes. And then she goes back. || A3, label_error
  Caller -> Okay. That's good. That's what I want to hear. Now, Marisa, I don't want you to give her any more lorazepam tonight. || R1, label_error
  Nurse -> No. I won't. Okay. || R1, label_error
  Caller -> I'm going to page our on-call nurse right now, so she can talk to you. || R2, label_error
  Nurse -> Okay. || label_error
  Caller -> And I'll call you back in thirty minutes to check on her. || R3, label_error
  Nurse -> Thirty minutes. Okay. || label_error
  Caller -> Every few minutes, check that you can wake her, that she's breathing regular, and her lips are pink. || E1, label_error
  Nurse -> Okay. Pink lips. Regular. Yes. || label_error
  Caller -> If you can't wake her, or the breathing gets slow or uneven, call us right back. Or nine one one. || E2, label_error
  Nurse -> Okay. I will. I'm so sorry. || label_error
  Caller -> Don't be. You called, that's what matters. Okay. || label_error
  Nurse -> Thank you, Rhonda. || label_error
