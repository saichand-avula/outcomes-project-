  Nurse -> Keep checking every morning, before you eat, and write it down. So when the doctor calls, you have the numbers. || E1
  Caller -> I do write them down.
  Nurse -> Good. And call us if it goes over three hundred, or if you start vomiting, or you feel confused, or you're really thirsty. || E2
  Caller -> Okay.
  Nurse -> Also, if it ever drops under seventy and you feel shaky or sweaty, drink half a cup of juice and recheck in fifteen minutes. And if you ever pass out, that's nine one one. || E3
