  Caller -> Yes. Yes, that's the house. That's the right one. || callback_phone
  Nurse -> Tell me what's happening.
  Caller -> It's his pain. It's so bad. He's, he's been moaning since about midnight and he can't, he can't get comfortable, he keeps shifting. || cc, A1, A4
  Nurse -> On a scale of zero to ten, what would you say it is?
  Caller -> He said nine. He told me a nine. In the hip. And his back. || A1, F1
  Nurse -> What have you given him?
  Caller -> I gave him the oxycodone. The five milligram. About an hour ago. It didn't do anything. || A2
  Nurse -> Okay. And he has the fentanyl patch on? || A3
  Caller -> Yes. The fifty. You changed it, or the other nurse changed it, two days ago. || A3
  Nurse -> Right. Is the patch still on his skin, is it stuck down?
  Caller -> It's, yeah. It's on. I checked it.
  Caller -> Can somebody come? Please. I can't, I can't watch him like this. || F2
  Nurse -> I hear you, Bernice. I'm going to page the on-call nurse as soon as we hang up. She'll be at your house within the hour. || R1, R2
  Caller -> Within the hour. Okay. Okay.
  Nurse -> I do want you to hold off for now. Don't put on a second patch, and don't give him anything extra until she calls you, because she'll tell you exactly what's safe on top of the oxycodone and the fentanyl. || R3
  Caller -> Okay. I won't. I'll wait.
  Nurse -> In the meantime, try to prop him with pillows so the hip is supported. Keep the room quiet and the lights low. || E1
  Caller -> Pillows. Okay. Lights low.
  Nurse -> And if he gets really hard to wake up, or his breathing gets slow, call us right back. || E2
  Caller -> Okay. I will.
  Nurse -> Alright. Hang in there, Bernice. Somebody will be with you soon.
  Caller -> Thank you, Rhonda. Thank you.
