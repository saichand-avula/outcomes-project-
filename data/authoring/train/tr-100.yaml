transcript: |
  Nurse -> Pinecrest Hospice, this is Carla.
  Caller -> Hi, Carla. It's Dolores Lindqvist. It's my husband, Everett. Everett Lindqvist. The oxygen machine is acting up. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Dolores. Let me make sure he's okay first. Is he breathing okay?
  Caller -> He's okay. He's fine. He's not short of breath. He's on the little tank right now. || A4
  Nurse -> Okay. Good. What's his date of birth?
  Caller -> January ninth. Nineteen thirty eight. || patient_dob
  Nurse -> And is nine oh one, five five five, zero one seven zero still good? || callback_phone
  Caller -> Yes. Yes. That's right. || callback_phone
  Nurse -> Okay. Tell me about the machine.
  Caller -> It keeps beeping. The alarm. And then it shuts off. Since like dinnertime. I turn it back on and it does it again. || A1
  Nurse -> Okay.
  Caller -> I think it's broken. I don't know.
  Nurse -> What backup do you have?
  Caller -> The tanks. We had three. Two are empty. We have one full one. One. || A2
  Nurse -> Okay. And how's his oxygen level, if you've checked it?
  Caller -> I did. It says ninety three. He's on the tank. || A3
  Nurse -> Okay, ninety three is okay. Good. Dolores, here's what I'm doing. I'm going to call our equipment company right now, and ask for an emergency swap of the machine. || R1
  Caller -> Oh, thank God.
  Nurse -> And they'll bring more tanks tonight too. || R2
  Caller -> Tonight? Okay.
  Nurse -> That's what I'm asking for. I'll call you back in thirty minutes with a time. || R3
  Caller -> Thirty minutes. Okay.
  Nurse -> For now, keep him on the tank. Same flow setting he's on now. Unplug the concentrator so it's not beeping at you. Don't use it again until they come. || E1
  Caller -> Same setting. Unplug. Okay.
  Nurse -> And remember, no smoking, no candles, no flames. And keep the tank standing up, not lying down. || E2
  Caller -> Nobody smokes here. And it's upright, it's in the stand.
  Nurse -> Good. And Dolores, if he gets short of breath, if his lips look blue, or if that tank starts getting low and they haven't come yet, call nine one one. Don't wait for me. || E3
  Caller -> Okay. Short of breath. Blue. Low tank. Nine one one. Okay.
  Nurse -> Is the tank gauge in the green right now?
  Caller -> Let me look. It's, it's about three quarters. Green.
  Nurse -> Good. That should last a few hours.
  Caller -> Okay. Thank you, Carla.
  Nurse -> You're welcome. Talk soon.
