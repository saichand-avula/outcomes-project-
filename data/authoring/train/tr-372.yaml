blueprint: "A 57-year-old man with type 2 diabetes calls home health after his pharmacy changed the label on his refill: the bottle says metoprolol 25 twice a day but his list from the doctor says metformin 500 twice a day. He has taken it for four days and today has a sugar of 312, a pulse of 54, and feels dizzy and tired. He reads the other bottles (lisinopril, atorvastatin, aspirin) and they match. No chest pain or fainting. Nurse has him stop the metoprolol, pages on-call, plans to call the pharmacy, a nurse visit tomorrow morning and a callback in an hour, and gives sugar monitoring and warning signs. High risk (look-alike drug wrong medication, tall-man), self caller, 18-64, name spelled, chart reading, long v2."
