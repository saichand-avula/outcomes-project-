  Nurse -> And call us if the fever goes longer than three days, or he's having trouble breathing, or he's really hard to wake up, or he won't drink. || E2
  Caller -> Okay. Trouble breathing, hard to wake up, not drinking.
  Nurse -> Also, nothing else changes tonight, his nightly chewable montelukast stays the same, four milligrams.
  Caller -> Okay. Yeah, he already had that.
