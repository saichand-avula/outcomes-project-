transcript: |
  Nurse -> Meadowbrook Home Care, this is Samantha.
  Caller -> Hi, Samantha. This is Odessa Pike. My husband Clifford feels warm. I took his temperature but I'm not sure about the number. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Odessa. Let me get his chart up. What's Clifford's date of birth?
  Caller -> February twenty third. Nineteen fifty. || patient_dob
  Nurse -> And I have nine one nine, five five five, zero one three one for you. || callback_phone
  Caller -> That's right. That's the house phone.  || callback_phone
  Nurse -> Okay. What number did you get on the thermometer?
  Caller -> It said one hundred point four. I think. The screen is cracked, it's got a line right through the last number. It might have been a hundred point eight. I couldn't tell. Hundred point four or eight. || A1
  Nurse -> Okay. Where did you take it? Under the arm, in the mouth?
  Caller -> In the mouth. Under the tongue. I waited for the beep.
  Nurse -> Okay. And how is he otherwise? Does he seem different?
  Caller -> He's more tired than usual. Today. He's been lying on the couch since lunch, and he's never on the couch. || A2
  Nurse -> Okay. Any cough, runny nose, sore throat?
  Caller -> No cough. Nothing like that. He says he just feels, you know, blah. || A3
  Nurse -> Okay. Is he drinking?
  Caller -> Yes. He had a whole glass of juice and some tea. He's fine with the drinking. Not eating much, but drinking. || A4
  Nurse -> Okay. Odessa, because the screen is cracked, I don't want to go by that reading. Do you have another thermometer in the house?
  Caller -> I think there's one in the bathroom drawer. The old ear one. Or the forehead one, I'm not sure which.
  Nurse -> Either one is fine. Please take his temperature again with that one, and write down the number and the time. || E1
  Caller -> Okay. Write down the number and the time. Okay. I'll go look for it.
  Nurse -> I'll call you back in an hour to see what you got and how he's doing. || R1
  Caller -> In an hour. Okay. Should I give him something for it?
  Nurse -> Let's see the new reading first. If it's a hundred and one or higher, or he gets shaking chills, or seems confused, or has any trouble breathing, call us right away. || E2
  Caller -> A hundred and one. Chills. Confused. Breathing. Okay. I wrote it on the back of the envelope.
  Nurse -> Good. Anything else?
  Caller -> No. I'm just going to get him a blanket. He says he's cold now. Which is funny, because he felt so warm.
  Nurse -> That's useful to know. Write that down too.
  Caller -> Okay. Thank you, Samantha.
