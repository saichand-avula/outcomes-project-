transcript: |
  Nurse -> Pinecrest Hospice, this is Gwen.
  Caller -> Hi, Gwen. It's Alicia Oseguera. I'm calling about my mother, Mirabel Oseguera. I'm worried about her. She's been saying some things. || caller_name, relationship, patient_name, cc
  Nurse -> Hi, Alicia. I'm glad you called. Let me get her date of birth.
  Caller -> November eleventh. Nineteen thirty seven. || patient_dob
  Nurse -> And is nine oh nine, five five five, zero one three one your number? || callback_phone
  Caller -> Yes. The cell. || callback_phone
  Nurse -> Okay. Tell me what she's been saying.
  Caller -> Three times this week. Once on Tuesday, once on Thursday, and again tonight. She says, I wish I just wouldn't wake up tomorrow. Tonight she said it while I was putting her to bed. She said, I'm tired of being a burden. I wish I wouldn't wake up. || A1, F1
  Nurse -> Okay. Thank you for telling me. That must have been hard to hear.
  Caller -> It was. I didn't know what to say. I told her she's not a burden. She just looked at me. And then she cried.
  Nurse -> How is she right now? Is she with you?
  Caller -> She's asleep, I think. She's in the bed. I just checked. She's breathing normally. But I'm worried to leave the room.
  Nurse -> Okay. I'm going to ask you some direct questions, Alicia. It's what we do. Has she said anything about hurting herself, a plan, or taking extra pills?
  Caller -> No. No plan. Nothing like that. She only says she wishes she wouldn't wake up. She's never said she'd do anything. And I count her pills. I do all of them myself. She doesn't touch them. || A3
  Nurse -> Okay. Good. That helps. How is her pain?
  Caller -> Fine. Her pain is fine. It's controlled. She says it's a one or a two. That's not it. She's just tired. And sad. She cries a lot. She says she's a burden to me. She isn't. || A4, A2
  Nurse -> Okay. Alicia, tell me a little about her. What was she like before she got sick?
  Caller -> Oh. She was the strong one. She raised us by herself. She cleaned houses for thirty years. She never missed a day. She was proud that she never asked anyone for anything. And now she has to ask me for everything, even to turn over in bed. I think that's what is killing her pride.
  Nurse -> That makes sense. For someone like that, needing help can feel harder than the illness.
  Caller -> Yes. Exactly. That's exactly it.
  Nurse -> Okay. Is she eating, sleeping?
  Caller -> She sleeps most of the day. She eats a few bites. She's been like that for a few weeks. This is the first time she said the other thing.
  Nurse -> Okay. Alicia, what's worrying you most right now?
  Caller -> That I'll miss something. That I'll go to the bathroom and come back and something has happened. That I'm not doing enough. I don't want to leave her alone. But I have to sleep eventually. || A5
  Nurse -> That makes complete sense. Here's what I'm going to do. I'm going to message her provider about what she's been saying. || R1
  Caller -> Okay. Thank you.
  Nurse -> I'm also going to have our social worker come out tomorrow. She's very good with these conversations, and she'll talk with your mom and with you. || R2
  Caller -> Oh, that would be good. I think Mom might actually talk to her.
  Nurse -> And a nurse will come out tomorrow too. || R3
  Caller -> Tomorrow. Okay. Both of them?
  Nurse -> Yes. And I'll call you back tonight to see how she's doing. || R4
  Caller -> Tonight. Okay. Thank you. What time?
  Nurse -> Before ten. If you don't hear from me by then, call me.
  Caller -> Okay. Before ten. I will.
  Nurse -> Alicia, if she ever says she has a plan, or if she tries to hurt herself, call nine one one. You can also call or text nine eight eight any time, for you or for her. And you can call us at any hour. || E1
  Caller -> Nine one one for a plan. Nine eight eight any time. And you. Okay. I'm writing it on my hand.
  Nurse -> Good. And one more thing. Please keep all of her medicines, including the comfort kit in the fridge, in your control. And tonight, try not to leave her alone for long stretches. || E2
  Caller -> I do keep them. I'll put the comfort kit in my room tonight. And I'll sleep in her room, on the couch. Is that okay?
  Nurse -> That's a very good plan. Alicia, you're doing an amazing job.
  Caller -> I don't feel like it. I feel like I'm falling apart.
  Nurse -> That's what it feels like when you love someone this much. But you called, and that's what a good daughter does.
  Caller -> Thank you. Thank you, Gwen. I needed to hear that.
  Nurse -> Take a breath. Before ten, I'll call you.
  Caller -> Okay. Bye. Oh, wait. Should I tell her I called you?
  Nurse -> It's up to you. If she asks, be honest, and tell her we care about her. She may be glad someone is listening.
  Caller -> Okay. I'll tell her. Thank you again.
