transcript: |
  Nurse -> Meadowbrook Home Care, this is Samantha.
  Caller -> Hi, Samantha. This is Esther Blumenthal. B L U M E N T H A L. I'm calling for a refill of my Klonopin. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Hi, Esther. Thanks for spelling that. What's your date of birth?
  Caller -> December twenty second. Nineteen forty six. || patient_dob
  Nurse -> And is five one six, five five five, zero one four three your number? || callback_phone
  Caller -> Yes. That's the house. || callback_phone
  Nurse -> Okay. Let me look at your medication list. Esther, I don't see Klonopin on your list. I see lorazepam, point five milligrams, at bedtime as needed. Could that be the one? || A1
  Caller -> Oh. Lorazepam. Yes. That's it. The little white one. I always call it my Klonopin. My old doctor called it that. I get them mixed up. It's the same family, isn't it? || A1
  Nurse -> It's a similar family, but they're different medicines. According to your chart, the lorazepam is what you're on. Is that the bottle you have in front of you? || A1
  Caller -> Let me look. Lorazepam, point five milligrams. Yes. That's it. That's the bottle. Not Klonopin. Silly me. || A1
  Nurse -> Okay. How many tablets do you have left?
  Caller -> Three. I'm counting. Three. || A2
  Nurse -> Okay. How often are you using them?
  Caller -> At bedtime when I can't sleep. Maybe four nights a week. Not every night. || A1
  Nurse -> Okay. I'll send the lorazepam refill request to your prescriber. || R1, A1
  Caller -> Thank you. Thank you.
  Nurse -> And I'll call you tomorrow to let you know where it stands. || R2
  Caller -> Tomorrow. Okay.
  Nurse -> Esther, take the lorazepam only at bedtime and only when you need it, not with alcohol, and sit on the edge of the bed for a moment before you stand if you wake in the night. || E1, A1
  Caller -> Only at bedtime. No wine. Sit first. Okay. I do have a glass of wine at dinner sometimes. Not at bedtime.
  Nurse -> That's fine. Just not close to the lorazepam. Anything else? || A1
  Caller -> No. That's all. Thank you, Samantha. And sorry about the Klonopin mix-up. || A1
  Nurse -> No problem at all. It's an easy one to mix up.
