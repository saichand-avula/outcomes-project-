transcript: |
  Nurse -> Riverbend Hospice, this is Tom.
  Caller -> Tom, hi. This is Eduardo Soto. My wife, Margarita. || caller_name, relationship, patient_name
  Nurse -> Hi, Eduardo. What's her date of birth?
  Caller -> January twenty fifth, nineteen fifty one. || patient_dob
  Nurse -> Okay. And I have nine five six, five five five, zero one three five for you. || callback_phone
  Caller -> Yeah, that's the house. || callback_phone
  Nurse -> Alright. What's going on?
  Caller -> Her patch fell off. The pain patch. In the shower this morning. || cc, A2
  Nurse -> Okay. Which patch is it?
  Caller -> The fentanyl. The twenty five. Twenty five micrograms. || A1
  Nurse -> Okay. When did you put that one on?
  Caller -> Sunday morning. So, three days ago. || A1
  Nurse -> Okay. So she's due to change it today anyway. Where's the patch now?
  Caller -> It was in the tub. When she got out, it was in the tub, stuck to the side.
  Nurse -> Okay. Don't put that one back on. Once it's come off, you can't reuse it. || R1
  Caller -> Yeah, I figured. It's all wet anyway.
  Nurse -> Right. How many new patches do you have?
  Caller -> Three. I have three left in the box. || A1
  Nurse -> Okay, good. So, put a new fentanyl patch on her now. Clean, dry skin, upper back or chest, somewhere with no hair. Press it down with your hand for thirty seconds. || R1, E1
  Caller -> Thirty seconds. Okay.
  Caller -> Do I write on it?
  Nurse -> Yes. Write the date and the time right on the patch. And that's the new change day, seventy two hours from now. || E1
  Caller -> Okay. So that'd be Friday.
  Nurse -> Right. I've got the chart open, I'll note the new change day right now. || R2
  Caller -> Oh good. Thank you.
  Nurse -> And fold the old patch in half, sticky sides together, and dispose of it the way the hospice nurse showed you. Keep it where the dog can't get it. || E2
  Caller -> We don't have a dog. But yes. I'll throw it out.
  Nurse -> How's her pain right now?
  Caller -> It's not bad. She says a three. Mostly because it's been three days. || A3
  Nurse -> Okay. It might creep up a little until the new patch starts working. If she needs it, she can have her as needed medicine too.
  Caller -> Okay. I'll watch.
  Nurse -> And if she gets very sleepy, hard to wake, or her breathing gets slow, call us right away. If you can't wake her, nine one one. || E3
  Caller -> Okay. I will.
  Nurse -> Anything else?
  Caller -> No. Thank you, Tom.
