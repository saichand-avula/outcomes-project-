transcript: |
  Nurse -> Lakeshore Home Health, this is Ana.
  Caller -> Hi, Ana. It's Phyllis Ashby. I'm calling about my husband Leonard. Leonard Ashby. || caller_name, relationship, patient_name
  Nurse -> Hi, Phyllis. His birthday?
  Caller -> July fourteenth, nineteen fifty six. || patient_dob
  Nurse -> And I've got five seven five, five five five, zero one four eight. || callback_phone
  Caller -> That's me. || callback_phone
  Nurse -> What's going on?
  Caller -> He's sleeping all the time. Like all day. I don't know if it's normal. || cc, A1
  Nurse -> Okay. How much is all day?
  Caller -> Fourteen hours? I think fourteen. He goes to bed at nine and he's up at, like, ten, and then he naps. And then he naps again. || A1
  Nurse -> Mm-hm.
  Caller -> Since the doctor raised his nerve pill last week. The gabapentin. || A1, A2
  Nurse -> Okay. Do you know the dose now?
  Caller -> Three hundred. Three times a day. It used to be two hundred. || A2
  Nurse -> Okay.
  Caller -> I just, I want to know if that's normal. Or if it's too much.
  Nurse -> Okay. Is he having any trouble breathing?
  Caller -> No. No, no trouble breathing. He's breathing fine. || A3
  Nurse -> Any chest pain?
  Caller -> No chest pain. || A4
  Nurse -> Has he fallen?
  Caller -> No falls. Not one. He's careful. || A5
  Nurse -> And when he's awake, is he thinking clearly?
  Caller -> Yes. He's himself. He's not confused. He just wants to sleep. || A6
  Nurse -> Okay. That sounds like the medicine, Phyllis. A bigger dose can make people very sleepy for the first week or so. But I want his prescriber to know. || R1
  Caller -> Okay. So he should stop it?
  Nurse -> No, no. Keep the same dose. Don't change it, and don't skip it, until the prescriber answers. || R3
  Caller -> Okay. Same dose.
  Nurse -> I'll call you tomorrow with what they say. || R2
  Caller -> Tomorrow. Okay.
  Nurse -> And while he's this sleepy, help him when he stands up, keep the walkway clear, and he shouldn't drive. || E1
  Caller -> He's not driving. I took the keys.
  Nurse -> Ha. Good. And call us right away if he gets hard to wake up, his breathing gets slow, or he gets confused. || E2
  Caller -> Hard to wake, breathing, confused. Okay.
  Nurse -> Anything else?
  Caller -> No. Thank you, Ana. I feel better.
