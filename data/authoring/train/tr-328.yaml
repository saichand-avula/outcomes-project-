transcript: |
  Nurse -> Oak Hollow Home Health, this is Brenda.
  Caller -> Hi, Brenda. It's Maribel Aldridge. I'm calling about my mother, Fenella Aldridge. I think I messed up her pills. I'm not sure. I'm not sure if I messed up. || caller_name, relationship, patient_name, cc
  Nurse -> Okay. Take a breath. Mix-ups with pills are very common, and it sounds like you caught it. Let's go through it.
  Caller -> Okay. Thank you. I'm sorry, I'm a little rattled. I've been looking at these bottles for an hour.
  Nurse -> Okay, Maribel. Let's go through it. What's your mother's date of birth?
  Caller -> June thirtieth. Nineteen fifty two. || patient_dob
  Nurse -> Got it. And a good number to reach you?
  Caller -> You have it. It's the same as last time. It's in her chart. I'm at her house but I don't remember the landline number. Can you use the one in the file?
  Nurse -> Yes. I can see one on file. I'll use that. Thank you.
  Caller -> Great. Thanks.
  Nurse -> Is your mom there with you right now?
  Caller -> She's in the living room. In her chair. She has her yarn. She's making a scarf for my son.
  Nurse -> That sounds peaceful.
  Nurse -> Tell me what happened with the pills.
  Caller -> So I came over this morning and I was organizing her kitchen. And I noticed two bottles on the shelf. Side by side. The same size. Orange. White caps. And one says Prilosec and one says Prozac. And they both say twenty milligrams. And I thought, wait. These look the same. And what if she mixed them up. || A1
  Nurse -> Are the labels from the same pharmacy?
  Caller -> Yes. Same pharmacy. Same label design. Same font. The only difference is the name. P R I L O S E C and P R O Z A C. They look so alike on the label.
  Nurse -> They do. That's why they're often mixed up.
  Nurse -> Okay. So you found Prilosec and Prozac, twenty milligrams each, next to each other. What does she take them for? || A1, A2
  Caller -> The Prilosec is for her stomach. Her heartburn. One a day, in the morning. And the Prozac is for her mood. Her depression. One a day in the morning. So she takes both, every morning. With breakfast. || A1, A2
  Nurse -> And who sets up her pills? You?
  Caller -> Usually me, on weekends. During the week, she does it herself. I started checking more often.
  Nurse -> Okay. That's good to know. We'll talk about that with the nurse.
  Nurse -> Okay. So she should take one of each every morning, twenty milligrams each.
  Caller -> Yes. That's right. But yesterday, I was here, and I put her pills out in the little cup. And I was in a rush. And I think I might have put two of the same one. Two Prilosec. And no Prozac. I'm not sure. I was on the phone with my husband. || A2
  Nurse -> Okay. What makes you think that?
  Caller -> Because this morning I counted. The Prozac bottle has more pills than it should. And the Prilosec bottle is lower. Like by one. If I put two Prilosec in the cup yesterday, then the count would be off. By one. One less Prilosec. One more Prozac. || A1, A2
  Nurse -> Okay. That's good detective work. So it might be that she took two Prilosec and missed her Prozac yesterday. Or it might be that the count is just off. || A1, A2
  Caller -> Right. I don't know. I can't be sure. My mother can't remember. I asked her. She said she took her pills. She doesn't know which ones.
  Nurse -> How many pills should be in each bottle by now?
  Caller -> I filled the bottles on the first. They're thirty pills each. It's the twenty sixth. So it should be four left. And one has five, and one has three. So it's off by one.
  Nurse -> That fits a swap by one pill. Okay.
  Nurse -> That's okay. Let me read you the list from her chart. Tell me if it matches. Lisinopril ten milligrams once a day. Prilosec twenty milligrams once a day. Prozac twenty milligrams once a day. And Tylenol as needed. Is that right? || A1, A2
  Caller -> Yes. That's all of them. Lisinopril, Prilosec, Prozac. And the Tylenol for her knees. I didn't mix up the lisinopril. That one's a different color. It's pink. And it's a different bottle. It's the other two. || A1, A2
  Caller -> The lisinopril is pink. Little pink. I always do that one first so I don't mix it.
  Nurse -> Good system.
  Nurse -> Okay. Good. The lisinopril is fine. How is your mother feeling today?
  Caller -> She has a little heartburn. Mild. She said her stomach burns a bit. It's the same as usual. And she says she feels a little down. A little blue. But she says it's the weather. It's gray out. She's not, you know, I'm not saying anything bad. She's just a little down. || A3, A4
  Nurse -> Okay. Is she talking about hurting herself, or not wanting to go on? Any thoughts like that?
  Caller -> No. No, no. Nothing like that. She's not saying that. She said she's tired of the rain. That's all. She's not, I don't think so. She's fine. She was knitting this morning.
  Nurse -> What's she knitting?
  Caller -> A scarf for my son. In red and gold. His school colors. She's on her third scarf this year.
  Nurse -> Aw. She's keeping busy. That's good.
  Nurse -> Okay. That's reassuring. Any black stools, or vomiting, or severe stomach pain?
  Caller -> No. No black. No vomiting. No pain. Just the heartburn. A little. Nothing else. || A5
  Nurse -> Okay. Good. Maribel, here's what I think. If she did take two Prilosec yesterday, that's a double dose of a stomach medicine, which is generally not dangerous. And if she missed one day of Prozac, that's usually not a big problem either, but I want the provider to know. I'm going to message the provider today about the possible mix-up. || R1
  Caller -> Oh good. Thank you. Should I give her the Prozac now? To catch up? || A2
  Nurse -> No. Please don't double up. Just give her the usual dose tomorrow morning with breakfast. Wait for the provider's call if you're worried.
  Caller -> What if it's a big deal? What if she needs to go to the hospital?
  Nurse -> It doesn't sound like it. The medicines are not dangerous in these amounts. But the provider will make sure.
  Caller -> Okay. That helps.
  Caller -> Okay. No double. Tomorrow morning. One of each.
  Nurse -> Perfect. And let's make this safer. Put the Prilosec and Prozac on different shelves. Not side by side. And read the label twice before you pour the pills. One more time when you put them in the cup. || E1
  Caller -> Different shelves. Read it twice. Okay. I have a Sharpie. I could mark the Prozac with a purple dot. For mood. Purple for the blues. || A2
  Nurse -> That's a great idea. I'm also going to add a note on her medication list about the two look-alike names, so everyone on the team sees it. || R2
  Caller -> Oh, that'd be wonderful. Thank you.
  Nurse -> It's done. I added it to her list just now. And I'll call the number on file this evening to let you know what the provider says. || R3
  Caller -> This evening. Good. I'll be at her house. I'll stay for dinner.
  Nurse -> One more thing. Call us if she gets black or bloody stools, vomiting, or really bad stomach pain, or if her mood gets worse. Like if she seems hopeless, or says she wants to hurt herself. || E2
  Caller -> Black stools, vomiting, bad pain. Hopeless or hurting herself. Okay. I don't think so. But I'll watch. I'll call.
  Nurse -> Good. How are you doing, Maribel?
  Caller -> I'm okay. I just feel guilty. I should have been more careful.
  Nurse -> You caught it quickly. That's what matters.
  Caller -> Thank you. I appreciate it.
  Nurse -> Talk to you this evening.
  Caller -> Bye, Brenda.
