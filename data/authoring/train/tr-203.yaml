transcript: |
  Nurse -> Cedar Point Hospice, this is Joel.
  Caller -> Hi, Joel. This is Deja. I'm an aide over at Fernwood Commons. I'm calling about one of our residents, Rosalind Achterberg. We're about out of her briefs. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Hi, Deja. Okay, let me pull her up. Can you give me her date of birth?
  Caller -> June twenty seventh, nineteen thirty nine. || patient_dob
  Nurse -> And the number I have for the facility is nine one nine, five five five, zero one seven three. || callback_phone
  Caller -> Yeah, that's the nurses' station. That's right.  || callback_phone
  Nurse -> Okay. So how many briefs does she have?
  Caller -> Two. Two left. And that's for tonight. And we're out of the wipes, or close. There's like a handful left in the pack. || A1, A2
  Nurse -> Okay. I don't want her to run out overnight. I've put the order in for briefs and wipes, it's done. || R1
  Caller -> Oh, great. When would they come?
  Nurse -> I'm going to call the driver and see if we can get them to your front desk tonight. || R2
  Caller -> Okay. The front desk is there till ten. After that it's the night guy, he knows to expect it.
  Nurse -> Perfect. Is her skin okay? With the supplies low, I want to make sure she's not irritated.
  Caller -> She's a little red on her bottom. Not bad. Just pink. || A3
  Nurse -> Okay. Change her as soon as she's wet, clean her gently, and put the barrier cream on the red area. || E1
  Caller -> Change her fast. Clean gentle. Cream. Okay. I'll put that in the notes for the night shift.
  Nurse -> Thanks, Deja. I'll call the station if the driver can't make it tonight.
  Caller -> Okay. I'll be here till eleven.
  Nurse -> Anything else for her?
  Caller -> No, that's it. She's comfortable. She's been sleeping a lot, though. But she seems calm.
  Nurse -> That's okay. Thanks for looking after her.
  Caller -> Thanks, Joel.
