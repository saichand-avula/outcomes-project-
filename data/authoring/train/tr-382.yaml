  Caller -> Okay. Please. Thank you.
  Nurse -> Graham, your voice is very soft. I'm having trouble with some words. I'm going to repeat what I hear, and you tell me if I got it wrong.
  Caller -> Okay. Yes. That's. Fine.
  Nurse -> You ran out of Sinemet, last dose was last night at eight. You're stiff, your tremor is worse, and you froze this morning but didn't fall. Right? || A1
  Caller -> Right. Yes. All right.
  Nurse -> And your son's coming at five. Is that right?
  Caller -> Five. Yes. Five.
  Nurse -> Okay. And you take the Sinemet how often? || A1
  Caller -> Sinemet. One. Tablet. Five times. A day. Twenty five. A hundred. The strength. || A1
  Nurse -> One tablet, five times a day. Thank you. Now, what's your date of birth?
  Caller -> September. Twelfth. Nineteen sixty four. || patient_dob
  Nurse -> September twelfth, nineteen sixty four. And your number, Graham?
  Caller -> Six four six. Five five five. Zero one nine eight. || callback_phone
  Nurse -> Six four six, five five five, zero one nine eight. Is that right? || callback_phone
  Caller -> Yes.
  Nurse -> Okay. I'm also going to send a nurse to see you this afternoon. I'll try for the next couple of hours. || R3
  Caller -> Pardon? Say. Again.
  Nurse -> I'm going to send a nurse out to see you.
  Caller -> This afternoon. Good. Thank you.
  Nurse -> Until then, stay seated unless someone's with you. If you have to get up, use your walker. If your feet freeze, stop. Shift your weight side to side, like rocking. Then try to step over a line on the floor, or count out loud, one, two, three, and step on three. || E1
  Caller -> Rock. Side to side. Step over. A line. Count. One. Two. Three. Yes. I know. The trick. It helps. Sometimes.
  Nurse -> Good. And call us right away if you fall, if you have trouble swallowing or breathing, if you get a high fever, or if your muscles get very rigid and you feel confused. Call 911 if you fall and can't get up. || E2
  Caller -> Fall. Swallow. Breathe. Fever. Rigid. Confused. 911. If I can't. Get up. I have. The button.
  Nurse -> Good. Wear the button. Is it on?
  Nurse -> Is there water within reach? A drink?
  Caller -> Yes. A cup. With a. Straw. Lid. My son. Set it.
  Nurse -> Good. Sip when you can.
  Caller -> Yes. Around. My neck.
  Nurse -> Perfect. I'll call the pharmacy now and call you back as soon as I know.
  Caller -> Thank you. Val. You are. Very. Kind.
  Nurse -> Hang in there, Graham. Talk soon.
  Caller -> Bye.
