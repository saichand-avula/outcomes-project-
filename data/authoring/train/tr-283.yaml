blueprint: "A 58-year-old man with pancreatic cancer calls palliative care at night, whispering so he doesn't wake his wife: no real sleep for three nights, pain at a five in the belly, and he says he is tired of all of it and wishes he would not wake up. He is evasive at first, deflects to his garden and his daughter, and says he would never do anything to himself and has no plan. The nurse asks directly, takes his medicines list, and plans an on-call page, a social work and chaplain visit tomorrow, a nurse visit tomorrow morning, and a callback within thirty minutes. Gives the 988 line, asks him to have his wife hold the pills. Passive suicidal statement, self-caller aged 18-64, long v2, slow, with silences and tangents."
