transcript: |
  Nurse -> Harbor Light Home Health, this is Marcus.
  Caller -> Hi, Marcus. It's Julian Reyes. My dad is Alphonse Reyes. He came home yesterday from the hospital and I'm trying to figure out his medicines. || caller_name, relationship, patient_name, cc
  Nurse -> Hi, Julian. How do you spell Reyes?
  Caller -> R E Y E S. || patient_name
  Nurse -> And his date of birth?
  Caller -> June sixth. Nineteen forty one. || patient_dob
  Nurse -> And I have three one oh, five five five, zero one one eight for you. || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. Do you have the discharge papers in front of you?
  Caller -> I do. I have the list. And I have all the bottles on the kitchen table. There's like twelve of them. || cc
  Nurse -> Okay. Let's go through it one at a time. Start with whatever's first on the list.
  Caller -> Okay. So the first one is metoprolol. Succinate. Twenty five milligrams. Once a day. || A1
  Nurse -> Okay. In the morning?
  Caller -> Yes. In the morning. Yes.
  Nurse -> Good. Next.
  Caller -> Furosemide. Forty milligrams. Once a day. It says increased. Before it was twenty. || A2
  Nurse -> Right. That's the water pill. They doubled it in the hospital.
  Caller -> Okay. Okay.
  Nurse -> Next.
  Caller -> Apixaban. Five milligrams. Twice a day. Morning and night. || A3
  Nurse -> That's the Eliquis. The blood thinner. Good. || A3
  Caller -> Yeah. That one I'm very careful with. I give it at eight and eight.
  Nurse -> Perfect. Keep doing that.
  Caller -> Okay. Next is atorvastatin. Forty milligrams. At night. || A4
  Nurse -> Okay. Cholesterol pill. Good.
  Caller -> Then levothyroxine. Fifty micrograms. Every morning. Empty stomach. || A7
  Nurse -> Right. And donepezil?
  Caller -> Yes. Donepezil. Five milligrams. At night. For his memory. || A8
  Nurse -> Good. That's seven. And what about his blood pressure pill?
  Caller -> Okay. This is where I'm confused. This is the thing. || A5
  Nurse -> Go ahead.
  Caller -> The list says losartan. Twenty five milligrams. Once a day. And it says NEW next to it. And then it says STOP lisinopril. In capital letters. || A5, A6
  Nurse -> Right. They switched him. Lisinopril is out. Losartan is in. || A5, A6
  Caller -> Yeah. But here's the problem. The bottle of lisinopril is right here. It's the one he's always taken. Ten milligrams. And I gave it to him this morning. And I also gave the losartan. Because I saw both on the table and I wasn't sure. || A6, F1
  Nurse -> Okay. So he got both this morning.
  Caller -> Yes. Both. I'm sorry. I'm so sorry. I didn't read the STOP until just now. || A6, F1
  Nurse -> It's okay, Julian. I'm glad you called. Let's figure out how he's doing. Is he dizzy? Lightheaded?
  Caller -> A little. He said he felt kind of lightheaded after breakfast. He's been sitting since. || A10
  Nurse -> Okay. Do you have a blood pressure cuff?
  Caller -> I do. The hospital gave us one. Hold on. I'll do it now. Dad, arm out. Okay. It says one oh four over sixty two. || A9
  Nurse -> One oh four over sixty two. That's on the low side, especially for him. Okay.
  Caller -> Is that bad? Is that dangerous?
  Nurse -> It's lower than I'd like, with the two together. So here's what I want. No more blood pressure pills today. Not the lisinopril and not the losartan. Nothing more. || R1
  Caller -> Nothing more. Okay.
  Nurse -> And from tomorrow on, lisinopril is stopped for good. Only the losartan. That's what the hospital wants. || R1, A5, A6
  Caller -> Only losartan. Lisinopril is done. Okay. || A5, A6
  Nurse -> I'm going to message his prescriber and the pharmacist right now, and tell them he got both this morning. || R2
  Caller -> Okay. Thank you.
  Nurse -> I'll call you this evening with what they say. || R4
  Caller -> This evening. Okay.
  Nurse -> And I'm coming tomorrow to go through every bottle with you. We'll set up a pill box. || R3
  Caller -> Oh, good. That would be so helpful. Thank you.
  Nurse -> For now, take that lisinopril bottle and put it in a bag, away from the others. Out of sight. || E1
  Caller -> A bag. Yes. I'll put it in the garage. Okay.
  Nurse -> And a weekly pill box would help a lot. They're a couple dollars at the drugstore.
  Caller -> I'll get one tonight. I'll run out. My wife can stay with him.
  Nurse -> Good. Now, blood pressure. Check it twice a day, sitting and then again after he stands for a minute. Write both down. || E2
  Caller -> Sitting and standing. Twice a day. Okay.
  Nurse -> And help him up slowly. Have him sit on the edge of the bed for a minute before he stands. Walk with him. || E3
  Caller -> Slowly. Edge of the bed. Okay.
  Nurse -> Julian, call me if the top number is under ninety. Or if he faints, or he's very weak and can't stand. Or if he gets chest pain, that's nine one one. || E4
  Caller -> Under ninety. Faint. Weak. Chest pain, nine one one. Okay.
  Nurse -> Has he eaten today? Any nausea, any trouble with his stomach since the pills?
  Caller -> He ate breakfast. Eggs and toast. No nausea. He's been fine with food. He had a little soup at lunch.
  Nurse -> Okay, good. And is he making urine normally, with the new water pill dose?
  Caller -> Yes. A lot, actually. He's up and down to the bathroom. Which is why I'm watching him on his feet.
  Nurse -> That's what the higher dose does. That's expected.
  Caller -> Okay.
  Nurse -> And one thing, Julian, make sure he isn't taking any over-the-counter pain pills or cold medicine from the drugstore. Those can strain the heart and the kidneys, and add to his pills.
  Caller -> No. I don't think so. I'll check the cabinet though. I'll take them out.
  Nurse -> That would be good.
  Nurse -> Is he sitting right now?
  Caller -> Yes. He's in the recliner. He's watching the news. He's fine. He says what's the fuss.
  Nurse -> Ha. Okay. Tell him the fuss is that we want him to be safe.
  Caller -> I will.
  Nurse -> Did you give the apixaban this morning, too? || A3
  Caller -> Yes. At eight. And I'll give the evening one at eight.
  Nurse -> Perfect. That one stays on schedule.
  Caller -> Okay.
  Nurse -> One more thing. Did they give you any other instructions at discharge? Diet, fluids, weights?
  Caller -> Yes. They said low salt. And to weigh him every morning. And to limit fluids, I think it was like two liters a day. Let me look. Yes, two liters.
  Nurse -> Okay. Good. Are you doing the daily weights?
  Caller -> I did this morning. He was one seventy four. They told us his dry weight is one seventy. So he's still a little over.
  Nurse -> Okay. That's good that you have that number. Keep writing it down with the blood pressure.
  Caller -> Okay. I will. I have a notebook and a pen right on the table.
  Nurse -> Perfect. Does he have a follow-up appointment with the heart doctor?
  Caller -> Friday. At ten. Dr. Mendez. I'm taking off work to drive him.
  Nurse -> Good. Bring all the bottles and the notebook with you.
  Caller -> Okay. All twelve bottles. Ha. And the notebook.
  Nurse -> Does he have any trouble with stairs at the house, or is everything on one floor?
  Caller -> One floor. Thank God. There's one step at the front door, with a rail. He does okay with that.
  Nurse -> Good. And is he using a walker, a cane?
  Caller -> A walker. The hospital gave him one. He doesn't love it, but he uses it.
  Nurse -> And what about at night? Who's staying with him?
  Caller -> I'm staying here. I'm in my old room. My wife comes in the day and I go to work, then switch. We're making it work.
  Nurse -> That's a lot of juggling. How are you holding up?
  Caller -> I'm okay. It was a scare. He was in the hospital six days. I've been a mess.
  Nurse -> I'm sure. It's good that you're all pitching in.
  Caller -> Yeah. My sister's coming in from Phoenix next week.
  Nurse -> That will help. Okay.
  Nurse -> Anything else before we hang up?
  Caller -> No. I feel a lot better. I was really freaking out.
  Nurse -> You did the right thing calling. Talk to you tonight.
  Caller -> Thanks, Marcus.
