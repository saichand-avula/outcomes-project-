transcript: |
  Nurse -> Lakeshore Home Health, this is Rhonda.
  Caller -> Hi, Rhonda. It's Tamsin Brockman. I'm calling about my mother, Hazel Brockman. We just got her blood test results and I'm not sure what to do. It's the INR for her warfarin. || caller_name, relationship, patient_name, cc, A2
  Nurse -> Okay, Tamsin, I'm glad you called. Let me get her date of birth.
  Caller -> May nineteenth. Nineteen forty one. || patient_dob
  Nurse -> And your number, two six two, five five five, zero one seven nine? || callback_phone
  Caller -> Yes. That's my cell. I'm at her house. I came over after work to do her pills for the week. || callback_phone
  Nurse -> That's very good of you. How is your mom feeling today?
  Caller -> Tired. She's been sleeping a lot since the infection started. But she's in good spirits. She's watching her cooking shows.
  Nurse -> Okay. What was the INR?
  Caller -> The lab called this afternoon and said four point one. Four point one. I wrote it on my hand. They said her goal is two to three. And I don't know what that means, other than it's higher than it should be. || A1
  Nurse -> Okay. It means her blood is thinner than we want it. Tamsin, tell me about the warfarin. What does she take? || A2
  Caller -> Five milligrams. Every evening at six. I give it to her myself. She took it last night. || A2
  Nurse -> Okay. Warfarin five every evening. And has anything changed with her medicines recently? Any new pills? || A2
  Caller -> Yes. The antibiotic. Ciprofloxacin. She had a urinary infection. She started it five days ago. Five hundred milligrams, twice a day. She took one this morning. She has two more days to go. || A3, A8
  Nurse -> Okay. That's very important. Ciprofloxacin can make warfarin stronger, which could be why her INR is up. Did anyone tell you about that? || A2, A3
  Caller -> No. Nobody said anything. The doctor at urgent care wrote the antibiotic. She didn't know about the warfarin, I guess. || A2
  Nurse -> It happens a lot. Okay. Tamsin, I'm looking at her chart now. I see warfarin five milligrams every evening. I see levothyroxine in the morning, we're not changing that. And I don't see the ciprofloxacin yet. Let me add that. || A2, A3
  Caller -> Okay. Thank you. That's all her pills, plus the antibiotic.
  Nurse -> Now, is she bleeding anywhere? Any bruises, nosebleeds, bleeding gums?
  Caller -> Her gums. This morning she was brushing her teeth and the sink had pink in it. She said they bled for a minute and stopped. || A4
  Nurse -> Okay. Anything else?
  Caller -> A bruise. A new one. On her left forearm. About the size of a plum. She doesn't know what she bumped. It's dark purple. || A5
  Nurse -> Okay. Any black or bloody stools? Any nosebleeds, or a bad headache?
  Caller -> No. Her stools have been normal brown, I checked. No nosebleeds. No headache. She's been telling me she feels fine. Just tired because of the infection. || A6
  Nurse -> Okay. Has she fallen, or hit her head?
  Caller -> No falls. She's been using her walker. She hasn't hit anything that I know of. || A7
  Nurse -> Did she eat and drink today?
  Caller -> She had oatmeal and soup. She's drinking a lot of water because of the antibiotic. I keep a pitcher by her chair and I refill it all day.
  Nurse -> That's perfect. Okay. Here's what I'd like you to do, Tamsin. Please hold tonight's warfarin. Don't give it. || R1, A2
  Caller -> Hold it. Don't give tonight's warfarin. Okay. Even though it's almost six? || A2
  Nurse -> Yes. Even though it's almost six. The provider will tell us when to restart it, and at what dose. I'm going to message her provider right now about the INR and the antibiotic. || R2
  Caller -> Okay. Thank you. I was afraid that I was supposed to give it and that I'd make it worse. I almost gave it at five thirty, I had the pill in my hand, and then I thought, wait, I should call first.
  Nurse -> I'm so glad you waited. That small pause made the difference.
  Caller -> I got a feeling from the lab call. The woman's voice changed when she said four point one.
  Nurse -> You did exactly the right thing by calling first. I'd also like to recheck her INR. I'll schedule that for Thursday. || R3
  Caller -> Thursday. Okay. Does the lab come to the house?
  Nurse -> Yes. A nurse will draw it at the house. I'll make sure of that.
  Caller -> That's great. She doesn't like going out when she's sick.
  Nurse -> And I'll call you back tonight, once I hear from the provider, to tell you what to do about tomorrow's dose. || R4
  Caller -> Tonight. Okay. I'll stay until you call.
  Nurse -> Tamsin, please also keep her away from aspirin, ibuprofen, and naproxen, like Advil or Aleve. And don't give any extra warfarin. || E2, A2, A9
  Caller -> No aspirin. No Advil. No Aleve. No extra warfarin. Okay. She has a bottle of Tylenol. Is that okay? || A2, A9
  Nurse -> Tylenol in normal doses is generally okay, but I'd like the provider to confirm. Hold off tonight if she doesn't need it. || A9
  Caller -> Okay. She doesn't. I'll hold off.
  Nurse -> And for her gums, use a soft toothbrush and be gentle. No hard flossing until we've checked the INR. If she shaves, use an electric razor. || E3
  Caller -> Soft toothbrush. No hard flossing. Electric razor. She doesn't shave, but I will remember. I'll swap her toothbrush right now, we have a soft one in the drawer.
  Nurse -> Perfect. Now, important. If she has black or bloody stools, if she vomits blood, a bad headache, if she falls, or if a nosebleed won't stop after ten minutes of pressure, call nine one one. || E1
  Caller -> Black or bloody stool. Vomiting blood. Bad headache. A fall. Nosebleed over ten minutes. Nine one one. Okay. I'm writing it down.
  Nurse -> Good. Also, try to keep her diet steady this week. Don't suddenly add a lot of greens or change what she usually eats.
  Caller -> She eats the same thing every day, practically. Oatmeal, toast, chicken soup. Her friend brings her a salad on Fridays, I'll tell her to skip it this week.
  Nurse -> A salad now and then is fine, just keep it consistent. How long has she been on the blood thinner?
  Caller -> Six years. Since her heart rhythm problem, the atrial fibrillation. She has been very good about it. She goes for her blood tests every month and she never missed one. This is the first time it was ever high.
  Nurse -> That's a good record. Something small, like an antibiotic, can tip it, and that's why we check. How is she feeling otherwise?
  Caller -> Tired. And she has a little burning when she pees still. The antibiotic is helping, I think. She's drinking a lot of water.
  Nurse -> Good. Keep her drinking. And the nurse who comes Thursday will check on that too.
  Caller -> Okay. Thank you, Rhonda. I'm so glad I called. My brother said I was overreacting, he said it was just a number.
  Nurse -> It's a number that matters. You weren't overreacting.
  Caller -> I'll tell him you said so. He lives in Phoenix, so he doesn't see her every day like I do. It's easy to say from far away.
  Nurse -> It is. You're the one who's there. Thank you for being so careful.
  Nurse -> I'm glad too. Do you have any other questions?
  Caller -> No, I think I've got it. Hold the warfarin tonight. Wait for your call. Soft toothbrush. Watch for bleeding. Thursday blood draw. || A2
  Nurse -> You've got it exactly. I'll call you tonight.
  Caller -> One more thing. Her friend's grandson is getting married next Saturday. She really wants to go. Will she be okay by then?
  Nurse -> I can't promise, but once the INR is back in range and the infection is treated, there is no reason she can't. Let's get through this week first.
  Caller -> Okay. I won't mention it to her yet. She'll want to buy a new hat.
  Nurse -> Ha. Let her buy the hat. It will give her something to look forward to, and it will be good for her spirits while she finishes the antibiotic.
  Caller -> Okay. Goodbye, Rhonda. Thank you again.
