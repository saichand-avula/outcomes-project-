transcript: |
  Nurse -> Saltmarsh Home Care, this is Tobiah.
  Caller -> Hi, Tobiah. It's Mateus Ferreira. I'm the grandson of Hortensia Albuquerque. I'm calling to check on a few things from yesterday. || caller_name, patient_name, relationship, cc
  Nurse -> Hi, Mateus. Sure. I have her chart open. What would you like to know?
  Caller -> Thanks. I only have about ten minutes. My break is short.
  Nurse -> No problem. Let's be quick.
  Caller -> Yesterday I talked to a nurse. I don't remember her name. Maybe Beth? She said she would order a commode. And message the doctor about my grandmother's cough. I just want to make sure it happened.
  Nurse -> I'll look under yesterday's notes.
  Nurse -> Let me look at the notes. Give me a moment.
  Caller -> Sure. No rush. I'm at work. I'm on my break.
  Caller -> I'm in the break room. Someone is microwaving fish. Sorry about the noise.
  Nurse -> Ha. I can hear a little.
  Nurse -> Okay. I see the note. Yes. The bedside commode was ordered yesterday afternoon. That one is done. || R1, A3
  Caller -> Oh. Great. Because we've been waiting. She has to walk all the way to the bathroom at night. I worry.
  Nurse -> I know it's been a few days.
  Caller -> A week, really.
  Nurse -> I understand. The delivery is planned for tomorrow. I'll confirm the window with the supply company. || R2
  Caller -> Tomorrow. Okay. I'll be at work. My cousin can let them in. She lives down the street.
  Nurse -> That's fine. I'll note her as a contact.
  Caller -> Her name is Larissa. Larissa Ferreira.
  Nurse -> Thank you. Spelled L A R I S S A?
  Caller -> Yes. Two S's.
  Nurse -> Got it. Next. The message to the doctor about the cough. I see that was sent yesterday at four fifteen. || R3
  Caller -> Did the doctor reply?
  Nurse -> Not yet. No reply is in the chart. I'll keep an eye out.
  Caller -> Okay. That's what I figured.
  Caller -> Okay. That's fine. She's still coughing. A dry cough. Three days now. It isn't terrible. She coughs a few times a day. More at night. || A1
  Nurse -> Okay. Is there any fever?
  Caller -> No fever. We have a thermometer. I took it this morning. Normal. And she's breathing fine. No wheezing. No short of breath. She did her puzzle at the table. || A2
  Nurse -> Good. Is she eating and drinking?
  Caller -> Yes. She likes the soup I make. She's fussy, but she's eating.
  Nurse -> What kind of soup?
  Caller -> Chicken with little noodles. Her recipe, but I make it badly.
  Nurse -> Ha. She still eats it.
  Nurse -> Great. Mateus, what's her date of birth, so I can verify?
  Caller -> May ninth. Nineteen thirty five. She'll be ninety one this year. Wait, she's already ninety one. Sorry. || patient_dob
  Nurse -> Ha. Right. And your number?
  Caller -> Sorry. Math is not my strong suit.
  Caller -> Nine oh one, five five five, oh one four seven. || callback_phone
  Nurse -> Nine oh one, five five five, oh one four seven. Right? || callback_phone
  Caller -> Yes. That's my work cell. I answer it all day.
  Nurse -> Good.
  Nurse -> Perfect. Also, I see a nurse visit is planned Thursday. || R4
  Caller -> Thursday. Yes. They told me. Morning? I wrote it down.
  Nurse -> The note says morning.
  Caller -> Good. She's alert in the morning.
  Nurse -> That helps.
  Caller -> Good. Great. It's a lot. I'm glad everything is moving.
  Caller -> I just want to make sure nothing falls through the cracks.
  Nurse -> That's exactly why I'm checking.
  Nurse -> It is moving. For the cough, you can offer her warm tea with honey. And an extra pillow so her head is up at night. A cool mist humidifier helps too. || E1
  Caller -> Tea with honey. Extra pillow. Humidifier. We have a humidifier from my aunt. It's in the garage. I'll bring it in.
  Caller -> The humidifier is the kind with the little blue light. It's loud, but she likes it.
  Nurse -> Perfect. And call us if she gets a fever, has trouble breathing, if she's coughing up colored mucus, or if she chokes when she drinks. || E2
  Caller -> Fever. Breathing. Colored. Choking. Okay. I'll text it to my cousin too.
  Nurse -> Good idea.
  Caller -> She'd kill me if she knew I was texting about her.
  Caller -> She doesn't like to ask for things. My grandmother. She doesn't tell me when something hurts.
  Nurse -> That's common. Keep asking. Watch her face.
  Caller -> I try. She just says, I'm fine. Always fine.
  Caller -> I do. She hides it. She's tough. She came here from Brazil when she was nineteen.
  Nurse -> That's an incredible story.
  Caller -> She talks about it more now. I record it on my phone.
  Nurse -> What a gift.
  Caller -> She taught herself English from the radio.
  Nurse -> Wow.
  Caller -> I'll tell her you said that. She'll love it.
  Nurse -> Please do. Anything else?
  Caller -> No, that's it. Thank you, Tobiah.
  Nurse -> You're welcome, Mateus. Take care.
  Caller -> You too. Bye.
