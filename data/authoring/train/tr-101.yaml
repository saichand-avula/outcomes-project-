  Caller -> No. No, she looks comfortable. She's not in pain, I don't think. She's not making any faces. || A5
  Nurse -> Okay. How's her breathing?
  Caller -> It's normal. It's slow, kind of, but it's normal. It's not hard. She's not struggling or anything. || A4
  Nurse -> Okay.
  Caller -> I'm not sure if she's had her pills. I think the morning ones. The heart one. The, what's it called. The metoprolol? I think. I don't know. || A3
  Nurse -> Okay.
  Caller -> My sister does the pills. She's at work.
  Nurse -> That's okay. Stanley, I'd like to send a nurse out to see her today. || R1
  Caller -> Today. Okay. Good.
  Nurse -> And I'm going to message her doctor about the sleepiness and the not eating. || R2
  Caller -> Okay.
  Nurse -> In the meantime, when she's awake, offer her tiny sips, or touch a damp swab to her lips. Keep her head up on a pillow. And don't force any food. || E1
  Caller -> Okay. No force. Okay.
  Nurse -> This is common as someone gets weaker. It doesn't mean you did anything wrong.
  Caller -> Okay. Thank you. I was scared I was missing something.
  Nurse -> You're not. And call us any time if anything changes, or if you just have questions. || E2
  Caller -> I will. Thank you, Gwen.
  Nurse -> Take care.
