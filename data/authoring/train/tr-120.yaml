transcript: |
  Nurse -> Little Oaks Pediatric Home Care, this is Priya.
  Caller -> Priya, hi, it's Michelle Pelletier. It's Dominic. Dominic Pelletier. He's missed his seizure medicine. Three doses. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Michelle, I'm here. Tell me what happened. First, his birthday?
  Caller -> June twenty fourth. Twenty seventeen. || patient_dob
  Nurse -> And I have five one eight, five five five, zero one four two. || callback_phone
  Caller -> Yes. That's me. || callback_phone
  Nurse -> Okay. What happened with the medicine?
  Caller -> The pharmacy was supposed to deliver on Monday. The delivery never came. And we ran out. The bottle was empty on Tuesday morning. || A3, F1
  Nurse -> Okay. So which doses has he missed?
  Caller -> Tuesday night. Wednesday morning, Wednesday night. Wait, it's Thursday. So Tuesday night, Wednesday morning, and Wednesday night. Three. The last one he got was Tuesday morning. Two days ago. || A1, F1
  Nurse -> Okay. And what's his dose?
  Caller -> Five hundred milligrams. Twice a day. The levetiracetam. || A1
  Nurse -> Okay. Has he had any seizures? Even small ones, staring spells?
  Caller -> No. No, nothing. He's been totally normal. He went to school. He's fine. || A2
  Nurse -> Okay. That's good. Michelle, I'm going to take care of the pharmacy. I already called them while you were talking to me, and they're sending a courier tonight with a full bottle. || R1
  Caller -> Oh. Oh, thank God. Tonight?
  Nurse -> Tonight. I'll call you back in thirty minutes to confirm the time. || R2
  Caller -> Okay. Thirty minutes.
  Nurse -> And I'm going to message his neurologist about how to restart. After three missed doses, they may want him to start in a certain way. So please don't give a double dose to catch up. || R3, E2
  Caller -> No. No double. Okay. I wasn't going to.
  Nurse -> Good. Wait for them.
  Caller -> Okay.
  Nurse -> Michelle, if he has a seizure, put him on his side, and time it. If it goes longer than five minutes, or he has one right after another, call nine one one. || E1
  Caller -> Side. Time it. Five minutes. Nine one one. Okay. I've done it before. I know the drill.
  Nurse -> I know you do. Is there someone with you tonight?
  Caller -> My husband's home. He's with Dominic right now.
  Nurse -> Good. Stay close to him tonight.
  Caller -> I will. Thank you, Priya. I'm so sorry I didn't call yesterday.
  Nurse -> It's okay. You called now. We'll fix it.
