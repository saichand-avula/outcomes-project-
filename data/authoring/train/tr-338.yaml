blueprint: "A 77-year-old man with advanced heart disease calls his palliative care nurse on a good afternoon because he wants to get his wishes in writing: he does not want CPR or a breathing machine and wants to stay home, and he wants his daughter to understand. He is feeling at peace, hip pain a two, eating smaller meals, no new shortness of breath. He takes Tylenol 500 mg as needed. The nurse documents his wishes, asks the social worker to come Thursday to complete the POLST with him and his daughter, messages the provider to sign, and explains where to keep the form. Routine goals-of-care call, self caller, long v2, reflective and a little funny."
