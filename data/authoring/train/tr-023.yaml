transcript: |
  Nurse -> Bluebell Home Care, this is Joanne.
  Caller -> Hi, Joanne. It's Raymond. I'm calling about my dad. Lionel Achebe. || caller_name, relationship, patient_name
  Nurse -> Hi, Raymond. And your dad's date of birth?
  Caller -> February ninth, nineteen forty five. || patient_dob
  Nurse -> Okay. And I have seven seven three, five five five, zero one three two for you. Still good? || callback_phone
  Caller -> Yes, that's me. || callback_phone
  Nurse -> What's going on?
  Caller -> So, it's a medication thing. My dad took his metoprolol twice this morning. || cc, A1, F1
  Nurse -> Okay. Twice. Tell me how that happened.
  Caller -> He took it at seven, with his breakfast. Like he does. And then at nine, he took it again. He totally forgot he'd taken it. || A1, A7
  Nurse -> Okay. And how much is the dose?
  Caller -> Twenty five milligrams. It's twice a day, normally. So he's had his morning one, and then another. || A1
  Nurse -> Okay. So he's had fifty milligrams in two hours. How's he feeling?
  Caller -> He says he's a little dizzy. Kind of lightheaded. It started around ten, I think. || A4
  Nurse -> Okay. Has he passed out, or almost passed out?
  Caller -> No. No, he hasn't passed out. || A5
  Nurse -> Any chest pain, or trouble breathing?
  Caller -> No. None of that. || A6
  Nurse -> Okay. Do you have a blood pressure cuff there?
  Caller -> Yes. We have it. Hang on.
  Caller -> Okay. It's, it says one oh four over sixty two. || A3
  Nurse -> Okay. And a pulse?
  Caller -> The pulse is fifty eight. || A2
  Nurse -> Okay. Fifty eight. That's lower than I'd like. That's the metoprolol working, it slows the heart. Where is he right now? || A2
  Caller -> He's in the kitchen. He's sitting at the table.
  Nurse -> Okay. I want him to lie down, or at least sit in a good chair, and take it easy. Not walk around alone. If he gets up, he should get up slowly. || E1
  Caller -> Okay. I'll get him to the couch.
  Nurse -> I'm going to page the on-call doctor right now. I've already paged her actually, while we were talking. She'll call us back. || R1
  Caller -> Oh. Okay. Good.
  Nurse -> Don't give him any more metoprolol today, not the evening dose, not until the doctor tells you what to do. || R3
  Caller -> Okay. No more metoprolol. Got it. || R3
  Nurse -> And I'll call you back in fifteen minutes either way, to see how he's doing. || R2
  Caller -> Okay. Fifteen minutes.
  Nurse -> Check his pulse and blood pressure every thirty minutes, and write them down so we have the numbers. || E2
  Caller -> Yeah. I'll write them on the pad.
  Nurse -> If he faints, or has chest pain, or trouble breathing, or the pulse goes under fifty, call nine one one right away. Don't wait for us. || E3
  Caller -> Under fifty. Okay.
  Nurse -> Raymond, how is he with his pills usually? Does he manage them himself?
  Caller -> Yeah, he does his own. He's very stubborn about it. But he's been forgetting more lately. Like last week he missed his water pill.
  Nurse -> Okay. That's helpful to know. A pill organizer with the days on it can help a lot. And a little log where he checks off each dose. || E4
  Caller -> I have one of those organizers in my car, actually. I got it for him a month ago and he said he didn't need it.
  Nurse -> Ha. Maybe he needs it now. Put it on the table where he can't miss it.
  Caller -> Yeah. I'll bring it in right now.
  Caller -> I work nights, so I'm not here in the mornings. My sister Ngozi checks in on him, but she had a double shift today.
  Nurse -> So he's alone a lot of the morning.
  Caller -> A little. Mostly in the mornings. He doesn't like anybody hovering over him, you know? He's a proud man.
  Nurse -> I understand. Would it help if one of our aides came in a couple of mornings a week? Even just to set out his pills and make sure he eats.
  Caller -> Honestly, yes. He'd complain, but I think it would really help. || R4
  Nurse -> I'll ask our scheduler to look at that and give you a call. I can't promise the timing, but I'll put the request in today. || R4
  Caller -> Okay. That's great. Thank you.
  Nurse -> Is there anything else going on with him, besides the forgetting? His appetite, or sleep?
  Caller -> He's eating okay. He's sleeping okay. It's just the memory. || A8
  Nurse -> Okay, good. I'll let the doctor know that, too.
  Nurse -> And I'll mention the forgetfulness to the doctor when she calls. They may want to look at how he's managing at home.
  Caller -> Okay. Thank you. I really appreciate it.
  Nurse -> Of course. Talk to you in fifteen.
  Caller -> Joanne, thank you. I panicked a little when I saw the two pill bottles on the table and he didn't remember. I'm glad I called right away.
  Nurse -> You did exactly the right thing, Raymond. Calling right away is always the right move with a medicine mix-up.
  Caller -> Okay. I'll go sit with him. Talk soon.
  Caller -> Bye.
