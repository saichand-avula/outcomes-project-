transcript: |
  Nurse -> Riverbend Hospice, this is Carla.
  Caller -> Carla, it's Jelena Marinkovic. It's my husband, Zlatko. Zlatko Marinkovic. His back is killing him. It's so bad. It won't stop. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Jelena. I'm here. Let me get his date of birth.
  Caller -> February eighth. Nineteen sixty. || patient_dob
  Nurse -> And your number, five seven one, five five five, zero one two six? || callback_phone
  Caller -> Yes. That's my cell. I'm in the house. || callback_phone
  Nurse -> Okay. Tell me about the back pain. Where exactly is it?
  Caller -> The low back. Here, across the bottom of his back. He says it feels like a knife. It started this morning when he woke up. He says it's an eight. An eight out of ten. || A1, F1
  Nurse -> Okay. What has he taken?
  Caller -> The oxycodone. Ten milligrams. He's supposed to take it every four hours. He took one at seven this morning, and then another one at eleven. It didn't help. It didn't touch it. || A2, F1
  Nurse -> Okay. Is he on anything else for the pain? A steroid, maybe?
  Caller -> Yes. The dexamethasone. Four milligrams every morning. He took it already. At seven with the first pill. || A5
  Nurse -> Okay. And Jelena, remind me of his diagnosis.
  Caller -> The prostate cancer. It went to his bones. In his spine, his hip, a rib. That's why he's with you. || A3
  Nurse -> Okay. Now this is important. Has he had any new weakness in his legs, any numbness or tingling, or any trouble passing urine?
  Caller -> No. His legs are the same. He can move them. He can feel when I touch his feet. And he went to the bathroom an hour ago. It was normal. I asked him all of those things already, because the nurse told us last time. || A4
  Nurse -> You did exactly the right thing. Okay. Jelena, how long has he been with us?
  Caller -> Four months. Since June. He was in the hospital for the bone biopsy in March, and then they said there wasn't anything else to do, and they sent him home with you. He's been strong. He walks the dog every morning. Until this week.
  Nurse -> I remember him telling me about the dog. What's the dog's name?
  Caller -> Bruno. A big dumb lab. He's lying outside the bedroom door right now, he won't leave. He knows.
  Nurse -> Dogs do know. Okay. Jelena, how are you doing? I can hear you're upset.
  Caller -> I'm scared. I'm so scared. Is the cancer spreading? Is this it? He was fine yesterday. He ate dinner. He watched the football game. And today he's curled up on his side and he can't talk. || A6
  Nurse -> I understand. I can't tell you what's causing it over the phone, but I do know that pain this severe, with the oxycodone not helping, needs to be dealt with right now. I'm going to page our on-call nurse. || R1
  Caller -> Please. Can someone come out today? Please. I can't see him like this. || F2
  Nurse -> Yes. A nurse will come to the house, and she'll be there within two hours. || R2
  Caller -> Two hours. Okay. Okay. That's, okay.
  Nurse -> And I'll call you back in twenty minutes with the plan for his pain. || R3
  Caller -> Twenty minutes. Okay. Thank you.
  Nurse -> Until then, please don't give him any extra oxycodone until the on-call nurse tells you whether to give more and how much. || E1
  Caller -> Okay. No extra. I'll wait for the call. His next one isn't due until three anyway.
  Nurse -> Right. Meanwhile, help him find the position that eases his back the most. Lying on his side with a pillow between his knees helps many people. And a warm pack on the low back, if he can stand the warmth. || E2
  Caller -> Side. Pillow between the knees. Warm pack. We have the heating pad with the cover. I'll put it on low.
  Nurse -> Low and with the cover, and check his skin every few minutes. And Jelena, if his legs get weak or numb, or if he can't pass urine, call me right away. That's very important with this kind of pain. || E3
  Caller -> Weak legs, numb, can't pee. Right away. Okay. I know. I'll check.
  Nurse -> Good. Has he had anything to eat or drink since this morning?
  Caller -> A little water. He took a sip with the pill and that's all. He says he's not hungry. He doesn't want to talk much, it hurts too much to move his mouth, he says, which doesn't make sense, but that's how bad it is.
  Nurse -> That's okay. When pain is severe, people go inward. Is anyone with you?
  Caller -> My son is on his way. He lives twenty minutes away. He's coming now.
  Nurse -> That's good. Let him help you. Is the door unlocked for the nurse?
  Caller -> I'll unlock it now. Hold on. Done. The porch light is on. The house is the yellow one at the end of the street.
  Nurse -> Perfect. I'll talk to you in twenty minutes.
  Caller -> Okay. Thank you, Carla. Thank you so much. He says to tell you thank you too. He can hear me. He's nodding.
  Nurse -> Tell him I said hang in there, we're on it.
  Caller -> I'll tell him. Okay. Bye.
