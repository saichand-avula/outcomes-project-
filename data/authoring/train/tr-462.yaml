  Caller -> She has the wind chimes on the porch. You can hear them from my yard.
  Nurse -> Okay. I see the address.
  Nurse -> Okay. Tell me what's got you worried.
  Caller -> She hasn't been coming to the door. I've been bringing her the paper for years. Every morning. She opens the door and takes it. Today she didn't. I knocked. She came after a long time. || A3
