  Nurse -> Bluebell Home Care, this is Ana.
  Caller -> Hi. It's Kasia. It's about my brother. Dariusz. Dariusz Shibilski. He had a seizure. || caller_name, relationship, patient_name, cc, F1
  Nurse -> Okay, Kasia. When did it happen?
