  Nurse -> Okay. Is he awake now?
  Caller -> He's, he's kind of sleepy. But he opens his eyes when I talk to him. He knows me. || A2
  Nurse -> Mm-hm. How's his breathing?
  Caller -> Normal. It's normal now. During it, it was, but now it's normal. || A3
  Nurse -> Did he hit his head? Did he fall?
  Caller -> He was in the chair. He kind of slid down. I caught him. No, he didn't hit his head. || A4
  Nurse -> Okay. And what's his last name again? How do you spell it?
  Caller -> Shibilski. S H I B, I don't know. P R Z, it's a Polish name. Przybylski. Something like that. Shibilski. || patient_name
  Nurse -> Okay. Let me write that. Kasia, has he ever had a seizure before?
  Caller -> Not that I know of. Not like this. This is the first one I saw.
  Nurse -> Okay. I want you to call 911 now. He needs to be evaluated in the emergency room. || R1, F2
  Caller -> Okay. Okay. What do I.
  Nurse -> While you wait, keep him on his side. Don't put anything in his mouth. Loosen anything tight around his neck. Stay with him. || E1
  Caller -> On his side. Nothing in his mouth. Okay. Okay, Dariusz. Okay.
  Nurse -> And if he has another one before they get there, note the time. Tell them.
  Caller -> I will. I'll tell them. Four one four, five five five, zero one one six, that's my cell if you need me. || callback_phone
  Nurse -> Got it. Go call them now.
  Caller -> Okay. Thank you.
