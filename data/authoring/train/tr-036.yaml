transcript: |
  Nurse -> Willow Creek Hospice, this is Carla.
  Caller -> Carla, it's Hannelore Brandt. Please, I need help with my husband. || caller_name, relationship
  Nurse -> Hi, Hannelore. What's your husband's name and birthday?
  Caller -> Leopold Brandt. May seventeenth, nineteen forty four. || patient_name, patient_dob
  Nurse -> Okay. And your number, is it two six two, five five five, zero one four two? || callback_phone
  Caller -> Yes, that's the house phone. || callback_phone
  Nurse -> What's happening?
  Caller -> It's his pain. It's terrible. It's his back and his hip. And it's a nine. It's a nine out of ten. || cc, A1, F1
  Caller -> He's been hurting since this morning and it's getting worse.
  Nurse -> Okay. What have you given him?
  Caller -> The oxycodone. The ten milligram. I gave him one at twelve thirty, and one at two thirty, and one at four thirty. Three doses. And nothing is helping. || A2, F1
  Nurse -> Okay. And his orders are ten milligrams every four hours as needed. || A2
  Caller -> Right. But it's only been, so the next one wouldn't be until eight thirty? I don't know. He's, he's crying.
  Nurse -> Okay. Is he restless? Can he get comfortable?
  Caller -> No. He can't get comfortable at all. He keeps shifting around. || A3
  Nurse -> Okay. Any vomiting?
  Caller -> No. No vomiting. || A4
  Nurse -> Alright, Hannelore. I'm paging the on-call doctor right now. Hold on. I've got the page in. She'll call us back. || R1
  Caller -> Okay. Okay. Thank you.
  Nurse -> Please don't give him any more oxycodone until she gives us orders. I don't want him to get too much, and I want her to decide on the right next step. || R2
  Caller -> Okay. I won't.
  Nurse -> I'll call you back in fifteen minutes, either way. || R3
  Caller -> Fifteen minutes. Okay.
  Nurse -> While we wait, can you put a pillow behind his back, and one between his knees, to take pressure off the hip? And a warm pack on the hip, if you have one. || E1
  Caller -> I have a heating pad. I'll do that.
  Nurse -> Low setting, wrapped in a towel. And keep the room quiet.
  Caller -> Okay.
  Nurse -> If he gets very sleepy, hard to wake, or his breathing slows down, call me right away. || E2
  Caller -> I will.
  Nurse -> You're doing everything right, Hannelore. Hang in there.
  Caller -> Thank you, Carla.
