transcript: |
  Nurse -> Harbor Light Home Health, this is Marcus.
  Caller -> Hi, Marcus. It's Roy Sorensen. I'm calling about my wife, Adelaide. || caller_name, relationship, patient_name
  Nurse -> Hi, Roy. Is that S O R E N S E N?
  Caller -> With an E N, yes. Sorensen. || patient_name
  Nurse -> Got it. And what's her birthday?
  Caller -> January thirtieth, nineteen fifty one. || patient_dob
  Nurse -> And I have eight one six, five five five, zero one zero seven for you. || callback_phone
  Caller -> That's the right number. That's mine. || callback_phone
  Nurse -> What's going on today?
  Caller -> It's her sugars. They've been, they've been high in the mornings. She took it this morning and it was two forty eight. || cc, A1
  Nurse -> Two forty eight. Is that fasting, before she eats?
  Caller -> Yes, before breakfast. And the last two days it was like two forty, two forty something too. So three mornings now. || A2
  Nurse -> Okay. Is she on any new medicine?
  Caller -> Yeah, the prednisone. For her lungs. The doctor started that five days ago. Twenty milligrams in the morning. || A3
  Nurse -> Right, I do see that. And she's still taking her metformin? || A4
  Caller -> Yes. The metformin, five hundred, twice a day. Breakfast and dinner. || A4
  Nurse -> Okay. How's she feeling otherwise?
  Caller -> She's thirsty. She's very thirsty, she's drinking a lot of water. And she's up to the bathroom a lot, a lot more than usual. || A5
  Nurse -> And is she eating normally? What did she have for dinner last night?
  Caller -> She had, let me think, she had the chicken, and some rice. Rice and, and green beans. And then she had a little ice cream. Just a little.
  Nurse -> Okay. And a snack before bed?
  Caller -> She had some crackers. A few. I told her not to, but you know how she is.
  Nurse -> That's okay, that's helpful to know. Any vomiting, or nausea?
  Caller -> No. No throwing up. Her appetite's fine. || A6
  Nurse -> Is she thinking clearly? Any confusion, or unusually sleepy?
  Caller -> No. She's sharp. She's actually been bossing me around all morning. || A7
  Nurse -> Ha. Good sign, then. Is she walking around okay? Any dizziness when she stands?
  Caller -> No dizziness. She's using the walker. She went out to the mailbox yesterday by herself, I about had a heart attack.
  Nurse -> That's good that she's moving, even if it's scary for you. How's her breathing, with the lungs?
  Caller -> It's better. It's better since the prednisone, that's the thing. That's why she's, why she doesn't want to stop it. || A3
  Caller -> Honestly, I was going to ask if she should skip it. Because of the sugar. Would that be, would that be okay? || A8
  Nurse -> That's a good question to ask, and I'm glad you did. I don't want her to stop the prednisone on her own. It's helping her lungs, and stopping it suddenly can cause problems. Let the doctor decide how to handle the sugar. || R4, A3
  Caller -> Okay. All right. So she keeps taking it.
  Nurse -> For now, yes. I'm going to send a message to her doctor today about these morning numbers, since they're high for three days now. || R1
  Caller -> Okay.
  Nurse -> And I'm going to have a nurse come tomorrow to check her sugar and take a look at her. || R2
  Caller -> Tomorrow. Okay, good. What time, do you know?
  Nurse -> I'll have the schedule by this evening, and I'll call you then with the time and what the doctor says. || R3
  Caller -> Perfect. This evening. My son's coming by tonight too, so he'll be here if you want to talk to him.
  Nurse -> That's great, thanks. Okay, here's what helps in the meantime. Have her drink plenty of water, and skip the juice, the regular soda, and sweets for now. || E1
  Caller -> She likes the orange juice in the morning. She's not going to like that.
  Nurse -> I know. Water or sugar-free for now. Just until the doctor weighs in.
  Caller -> I'll tell her. I'll tell her it's doctor's orders.
  Nurse -> Ha, that works. And keep checking her sugar before breakfast and again at bedtime, and write the numbers down for the nurse. || E2
  Caller -> I do write them. I have a little notebook. It's by the toaster.
  Nurse -> Perfect. If her sugar goes over three fifty, or she starts throwing up, gets confused, or very sleepy, call us right away. || E3
  Caller -> Over three fifty, throwing up, confused, sleepy. Okay.
  Nurse -> Does she have enough test strips and lancets? I don't want you running out with all this checking.
  Caller -> Oh. Let me look. We have, I think a whole box. Maybe half a box. We're okay for a couple of weeks.
  Nurse -> Okay. If it gets low, tell the nurse tomorrow and she'll bring more.
  Caller -> Okay, I will.
  Nurse -> Anything else you want to ask?
  Caller -> Her feet, she's had, she wants to know about her feet, but that can wait.
  Nurse -> We can look at those tomorrow when the nurse comes.
  Caller -> Okay. Thank you, Marcus. You're always so helpful.
  Nurse -> Anytime, Roy.
