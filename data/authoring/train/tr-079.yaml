transcript: |
  Nurse -> Oakhaven Home Health, this is Denise.
  Caller -> Hi, Denise. Hi. It's Abena Boateng. I'm calling about my husband. Ignatius. Ignatius Boateng. || caller_name, relationship, patient_name
  Nurse -> Hi, Mrs. Boateng. How do you spell the last name?
  Caller -> B O A T E N G. || patient_name
  Nurse -> Perfect. And his birthday?
  Caller -> March eighteenth. Nineteen forty nine. || patient_dob
  Nurse -> Okay. And I have two oh two, five five five, zero one seven one for you. || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Great. So how are things going?
  Caller -> Okay. Um. Okay, so, it's a few things. I wrote them down, I'm sorry, it's a list. || cc
  Nurse -> No, that's perfect. Go ahead.
  Caller -> So the first thing is his blood pressure. I've been taking it like you showed me. And this morning it was one forty eight over ninety. And last night it was one thirty eight over eighty four. || A1, A2
  Nurse -> Okay.
  Caller -> Is that okay? Is that too high?
  Nurse -> Those are a little high but not alarming, especially a few weeks after a stroke. I'm going to pass them along to his doctor. Do you take it sitting down?
  Caller -> Yes. Sitting, with the arm on the table. Like you showed.
  Nurse -> Good. Okay. What's next?
  Caller -> The bruise. So on Sunday I saw this big purple bruise. On his left forearm. It's like, um, as big as my palm. And he doesn't remember hitting anything. || A3
  Nurse -> Hm. Okay. Is it tender? Is it swollen?
  Caller -> A little tender. Not swollen. It's just really dark. It's ugly.
  Nurse -> Mm-hm. Let me look at his medicines. I'm looking at his list. I see aspirin, eighty one milligrams, once a day. And clopidogrel, seventy five milligrams, once a day. Is he taking both of those? || A4, A5
  Caller -> Yes. Every morning. The baby aspirin and the, the Plavix one. The clopidogrel. || A4, A5
  Nurse -> Yes. Okay. So those two together can make him bruise more easily. That's likely what this is. But I want his doctor to know. || A4, A5, R1
  Caller -> So he should keep taking them?
  Nurse -> Yes. Don't stop either of them. They're protecting him from another stroke. I'll ask the doctor about the bruise, though. || R1
  Caller -> Okay. Okay. Good.
  Caller -> And then he almost fell yesterday. || A6
  Nurse -> Oh. Tell me about that.
  Caller -> We were going to the bedroom, he was using the walker, and his right leg just, it kind of gave out. I caught him. I caught him by the belt. || A6
  Nurse -> Oh my goodness. Okay. Did he hit anything? Did he go down?
  Caller -> No. No, he didn't hit anything. He didn't go down. I just held him up. I'm still sore, honestly. || A7
  Nurse -> Mm. Okay. Yeah. You need to be careful with your back too.
  Caller -> I know. I know.
  Nurse -> Was it the right leg that gave out?
  Caller -> Yes. The right. It's the weak side.
  Nurse -> Okay. Any new weakness? Any change in his face, or his speech, since the stroke?
  Caller -> No. No change. His face is the same. His talking is the same, a little slow, but the same. || A10
  Nurse -> And the right arm?
  Caller -> The right arm is the same. It's no better and no worse. He can lift it a little. He can't make a fist. || A9
  Nurse -> Okay. That's helpful.
  Caller -> Mm.
  Nurse -> Okay. What else is on the list?
  Caller -> So, he's been really, I don't know. Sad. Crying. Like yesterday he was crying at the TV. He was watching a cooking show and he started crying. || A8
  Nurse -> Mm-hm.
  Caller -> And he gets so frustrated. He says why can't I do it, why can't I do it. He throws the, he threw the spoon. || A8
  Nurse -> That's very common after a stroke, Mrs. Boateng. The emotions can be big. It's partly the brain healing and it's partly, you know, it's a lot to go through.
  Caller -> I know. I just don't know what to say to him.
  Nurse -> I think our social worker can help with that. I'd like her to call you, and talk to both of you. || R5
  Caller -> Yes. I'd like that. That would be really good.
  Nurse -> Okay. I'll put that in.
  Caller -> Thank you.
  Nurse -> Is there anything else on your list?
  Caller -> The shower chair. The, the plastic one. It cracked. There's a big crack in the seat. I don't want him on it. So we don't have one now. || A11
  Nurse -> Oh no. Okay. Definitely don't use that. I'll order you a new one. || R2
  Caller -> Oh, thank you.
  Nurse -> Until it comes, just sponge bathe him. Sitting at the edge of the bed or at the sink. Not the shower. || E4
  Caller -> Okay. Sponge bath. He'll like that, he doesn't like the shower anyway.
  Nurse -> Ha. Okay. What else?
  Caller -> Oh, and he's sleeping okay. Mostly. He wakes up once or twice, to use the urinal. But then he goes right back.
  Nurse -> That's good. And eating?
  Caller -> He eats fine. He likes the rice and the stew. I make it soft for him.
  Nurse -> Perfect.
  Caller -> Therapy. His physical therapist is supposed to come Thursday but my daughter's flying in Thursday and I wanted her to meet the therapist. Could it be Friday instead? || cc
  Nurse -> Let me ask the scheduler. I'll message her to try to move Thursday to Friday. || R3
  Caller -> Okay. Oh, thank you.
  Nurse -> I can't promise Friday, but I'll ask. They'll call you to confirm.
  Caller -> Okay. That's fine.
  Nurse -> And I'm going to come see him myself Thursday, so I can look at that arm and check his blood pressure and look at everything. || R4
  Caller -> Oh, you're coming? Okay. Good. That's good.
  Caller -> My daughter is a nurse too, in Atlanta. She's been telling me for weeks to call you about everything. She says I wait too long.
  Nurse -> Ha. She's right. You can call us for any of this, any time. It's never too small.
  Caller -> I know. I just don't like to bother people. I feel like, you have so many patients.
  Nurse -> You're not bothering anybody. That's literally what we're here for.
  Caller -> Okay. Thank you, Denise. You are very kind.
  Nurse -> Now let's talk about the falls, because that near fall worries me. Make sure the walker is right next to him any time he's sitting. And please don't let him stand up by himself. Even for a minute. || E2
  Caller -> I try. But he gets up. He doesn't wait for me.
  Nurse -> I know. It's hard. Put a chair alarm, or a little bell by his chair, if he'll go for it. And clear anything on the floor between his chair and the bathroom. Rugs, cords. || E2
  Caller -> The rugs. We have a runner in the hall. I'll take that up.
  Nurse -> That would help a lot.
  Caller -> Okay. I'll do that tonight.
  Nurse -> Okay. And for the blood pressure, keep checking it every morning and every evening. Sit him quietly for five minutes first, and write the numbers down so I can see them Thursday. || E1
  Caller -> I've got the notebook. I write them all.
  Nurse -> Perfect. Now, important. If you see his face droop, if the arm weakness gets worse, if his speech gets slurred or he can't get words out, or he's suddenly confused, call nine one one. Don't wait. || E3
  Caller -> Face, arm, talking, confused. Nine one one. Okay.
  Nurse -> And call us if the bruise gets bigger, if he has any bleeding that won't stop, or if his stool turns black. || E3
  Caller -> Black. Okay. Okay.
  Nurse -> Mrs. Boateng, how are you doing? Honestly.
  Caller -> Me? Oh. I'm okay. I'm tired. I'm, I do everything. My daughter can't come most days, she's far. I'm up at night with him. || A12
  Nurse -> That's a lot.
  Caller -> It's okay. It's what you do.
  Nurse -> It is. But you have to take care of you too. The social worker will talk to you about that, about respite, about some help. Okay?
  Caller -> Okay. Thank you. That's very kind.
  Nurse -> Alright. Anything else before I let you go?
  Caller -> No, I think that's everything. Oh, wait. Should he still take the amlodipine? I forgot to ask. Or is that, that's the blood pressure one?
  Nurse -> Yes, the amlodipine is his regular blood pressure pill. Yes, keep giving it like normal. I'll tell the doctor about the numbers.
  Caller -> Okay. I thought so. Thank you.
  Nurse -> Anytime. Take care, Mrs. Boateng. See you Thursday.
  Caller -> Okay. Bye now.
