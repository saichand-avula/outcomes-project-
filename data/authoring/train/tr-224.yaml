transcript: |
  Nurse -> Riverbend Hospice, this is Alan.
  Caller -> Hi, Alan. It's Marcy Ashgrove. My dad is Vernon Ashgrove. I have a question about his morphine. || caller_name, relationship, patient_name, cc, A1, A2
  Nurse -> Sure, Marcy. Let me pull up his chart. What's his date of birth?
  Caller -> May twenty ninth, nineteen forty two. || patient_dob
  Nurse -> And I have five one eight, five five five, zero one eight four for you. || callback_phone
  Caller -> Yes. That's my number. || callback_phone
  Nurse -> Okay. What's your question?
  Caller -> He's in some pain. He says it's a five. And I want to give him the liquid morphine, the breakthrough, but I want to make sure I'm doing it right. || A3, A2
  Nurse -> Okay. Tell me what he takes. Start with the long-acting one.
  Caller -> He has the morphine extended-release. Fifteen milligrams, twice a day. I gave him the morning one at eight. The night one is at eight tonight. || A1
  Nurse -> Okay. And the liquid?
  Caller -> The morphine liquid. The bottle says twenty milligrams per milliliter. And the label says a quarter of a milliliter, which is five milligrams, every two hours if he needs it. || A2
  Nurse -> Okay. That matches what I have. Has he had any of the liquid today?
  Caller -> Two doses. One at noon and one at about four. So it's been three hours since the last one. || A2
  Nurse -> Okay. That's been more than two hours, so it's fine to give another one. Draw it up to the quarter milliliter mark on the oral syringe, nothing more. || R1, E1, A2
  Caller -> The quarter mark. Not the, there are marks for a whole milliliter and a half. Which one is the quarter?
  Nurse -> It's the smallest line near the tip. If you hold the syringe up to the light, it's just a short little way up. Take your time, and double-check it against the label.
  Caller -> Okay. I have it. I see it. The quarter mark. I'm going to draw it up. Okay, that's right. I think that's right.
  Nurse -> Good. Write down the time you give it and what he got, so we have it for the nurse.
  Caller -> I'll put it on the sheet on the fridge. Okay. Should I wait before I give the next one?
  Nurse -> Wait at least two hours between doses. And I'm going to message the hospice provider tonight about the extra liquid doses he's been needing. || E1, R2, A2
  Caller -> Okay. Is that bad? That he needs more?
  Nurse -> It's not bad. It's information. It helps the provider decide if the long-acting dose needs to change.
  Caller -> Okay. That makes sense.
  Nurse -> I'll call you tomorrow to check in. || R3
  Caller -> Tomorrow. Okay. Thank you.
  Nurse -> And call us if the pain stays above a five after the dose, or if he's hard to wake up, or his breathing gets slow. || E2
  Caller -> Pain not better. Hard to wake. Slow breathing. Okay. He's just resting. He's watching a game.
  Nurse -> Good. You're doing a good job, Marcy.
  Caller -> Thank you, Alan. I just always worry about getting it wrong.
