  Nurse -> Oakhaven Home Health, this is Priya.
  Caller -> Priya, it's Elena Castellanos. My husband Raymond. He has pressure in his chest. It goes down his arm. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Elena. How long has he had it?
