  Caller -> August fourteenth, nineteen fifty eight. And seven one three, five five five, zero one five two. || patient_dob, callback_phone
  Nurse -> Got it. Call now. I'll be here.
  Caller -> Okay. Calling. Thank you, Priya. Oh God.
  Nurse -> Go. You're doing the right thing. Is he taking any heart medicine he keeps by his chair, anything he's supposed to use for chest pain?
  Caller -> I don't know. He has some little pills in the drawer, I don't know which are which. I'm not touching anything. The dispatcher can tell me.
  Nurse -> That's fine. Don't give him anything unless the dispatcher says to. Is he awake and talking?
  Caller -> He's awake. He's gray, though. Gray and wet. He keeps rubbing his chest and saying it's just indigestion. He doesn't want a fuss.
  Nurse -> It's not a fuss. Tell him I said it's better to be checked. Elena, put me on the table and call on another phone if you have one, or hang up and use this one.
  Caller -> I'll hang up. I'm calling now. The ambulance place is, I know the number. Okay. Okay, I'm doing it. Thank you.
  Nurse -> I'll be thinking of you both. Go ahead.
  Caller -> Okay. Bye.
