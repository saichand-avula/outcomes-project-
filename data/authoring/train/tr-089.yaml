  Nurse -> Okay. What's going on today?
  Caller -> So, um. I weighed myself this morning. And I'm up. || cc
  Nurse -> Okay.
  Caller -> I was one eighty seven on, on Saturday. And this morning I was one ninety. || A1, A2
  Nurse -> One ninety. Okay.
  Nurse -> So three pounds in two days.
  Caller -> Yeah. And I felt like it, you know. My ankles are bigger. Both of them. || A3
  Nurse -> Mm-hm.
  Caller -> My socks are leaving the, the marks. Deep marks. I could barely get my shoes on. || A3
  Nurse -> Okay. Has it been getting worse over the last couple of days, or just today?
  Caller -> Two days. It's been creeping up. Two days. || A3
  Nurse -> Okay.
  Caller -> Yeah.
  Nurse -> And how's your breathing?
  Caller -> Um. Fine, mostly. Sitting here I'm fine. I get a little winded on the stairs. More than last week. || A4
  Nurse -> Okay. More than last week.
  Caller -> A little. I have to stop at the landing. Which, I didn't have to do that. || A4
  Nurse -> Mm-hm. Any breathing trouble when you're sitting or lying down? Any chest pain?
  Caller -> No. No chest pain. No. I'm okay when I'm sitting. || A5
  Nurse -> Okay.
  Caller -> I'm just, I'm tired. Really tired. || A6
  Nurse -> Tired like how?
  Caller -> Like, I slept eight hours and I'm still wiped out. Like I ran a marathon. || A6
  Nurse -> Okay. How are you sleeping?
  Caller -> Not great. I'm on two pillows now. I used to just do one. If I lie flat I feel, I don't know, kind of heavy. || A9
  Nurse -> Mm-hm. Two pillows. When did you start that?
  Caller -> This week. Like, Sunday. || A9
  Nurse -> Okay. And eating?
  Caller -> Not much. I'm not really hungry. I get full fast. || A7
  Nurse -> Okay. What have you been eating?
  Caller -> Honestly? Crap. Ha. I had the canned soup, the chicken noodle, like, three nights. And then my buddy brought over, like, Chinese food last night. || A10
  Nurse -> Mm.
  Caller -> I know. I know. I know. Don't say it.
  Nurse -> I'm not going to yell. But that's a lot of salt, Quentin, and that probably explains a lot of the weight.
  Caller -> Yeah. I figured.
  Nurse -> Have you had any cough? Anything coming up when you cough?
  Caller -> A little dry one at night. Nothing coming up. Just tickly.
  Nurse -> Okay. Are you peeing normally? About the same as usual, more, less?
  Caller -> Less, I think. Less than usual. Which is weird because I take the water pill. I'd think I'd be going more.
  Nurse -> Mm-hm. That's useful to know. I'll pass that along.
  Caller -> Okay.
  Nurse -> Any dizziness when you stand up? Any lightheadedness?
  Caller -> Little bit. When I get up fast. Not today though. Yesterday a little.
  Nurse -> Okay. Do you have a blood pressure cuff at home?
  Caller -> I do. I haven't used it in a week, I'll be honest. I'll take it right after this.
  Nurse -> That would be great. Write it down with the weight.
  Caller -> Okay. Will do.
  Nurse -> And how's your belly? Any bloating, nausea, anything like that?
  Caller -> Bloated a little. That's probably the soup too, right? I feel like a balloon.
  Nurse -> It could be. Fluid can build up in the belly too. We'll check that Wednesday.
  Caller -> Okay.
  Nurse -> Okay. Let me look at your meds. I'm seeing the metoprolol, and the Lasix, forty milligrams, in the morning. Are you taking both? || A8
  Caller -> Yes. Every morning. The Lasix is the water pill. Forty. || A8
  Nurse -> And you took it today?
  Caller -> Yeah. I took it at like, seven thirty. || A8
  Nurse -> Okay.
  Caller -> Should I take another one? Like double? Because of the weight?
  Nurse -> No. Don't take extra on your own. Take your regular dose like you've been doing. And I'm going to get your heart doctor to weigh in. || R4
  Caller -> Okay. Okay. Good. I wasn't sure if I should.
  Nurse -> So I'm sending a message to your heart failure doctor today. I'll tell her the weight, the swelling, and the stairs. || R1
  Caller -> Okay.
  Nurse -> She may want to change something. That's up to her.
  Caller -> Yeah. Right.
  Nurse -> I'd like to come see you Wednesday. Is that okay? I'll listen to your lungs and look at your legs. || R2
  Caller -> Wednesday. Yeah. I'm home Wednesday. I'm home all week, honestly.
  Nurse -> Okay. Good. And I'll call you this evening, after I hear back from the doctor. || R3
  Caller -> Perfect. This evening. Okay.
  Nurse -> Now, in the meantime, I need you to weigh yourself every morning. The same way every time. After you use the bathroom, before you eat or drink, same clothes. And write it down. || E1
  Caller -> Every morning. Bathroom, then scale. And write it down. Okay. I have a notebook.
  Nurse -> And no more canned soup, and no takeout for now. Canned soup has almost a day's worth of salt in one bowl. || E2
  Caller -> Okay. Dang. A whole day?
  Nurse -> Almost. Fresh food, no added salt. Eggs, plain chicken, fruit. And no salt shaker.
  Caller -> I can do that. I have eggs.
  Nurse -> And when you sit or lie down, put your feet up. On pillows, up above your heart if you can. || E3
  Caller -> Feet up. I'm doing it right now, actually.
  Nurse -> Ha. Good. Okay.
  Caller -> Yeah.
  Nurse -> And if you get chest pain, or you get really short of breath while you're sitting still, call nine one one. || E4
  Caller -> Chest pain, short of breath. Okay.
  Nurse -> And call us if you gain three pounds in a day, or five pounds in a week. Or if the swelling climbs up your legs. || E4
  Caller -> Three in a day. Five in a week. Okay.
  Nurse -> One more thing. Do you have any trouble affording or getting the low-salt foods? I can have our social worker call if it's an issue.
  Caller -> Oh, no, I'm okay. I can afford it. It's more that cooking is exhausting. I just want to open a can and be done.
  Nurse -> I get that. There are some easy options, like pre-made meals with low sodium. We can talk about them Wednesday.
  Caller -> Oh, okay. Yeah. That would be good to know.
  Nurse -> Alright. Quentin, how are you doing? Besides the physical stuff?
  Caller -> I'm okay. I'm, you know. I'm bored. I miss work. I'm tired of being tired.
  Nurse -> That's real. It's a lot.
  Caller -> Yeah.
  Nurse -> Is there anyone coming by to help you?
  Caller -> My sister's coming Thursday. And my buddy. The soup guy. Ha.
  Nurse -> Does your sister help with your appointments? Rides, pharmacy?
  Caller -> She does the pharmacy runs when she's in town. When she's not, I do delivery. They deliver now. It's actually pretty easy.
  Nurse -> That's good. And are your refills all set? Do you have enough of everything for the next couple of weeks?
  Caller -> I think so. I think I'm good till the end of the month. I'll check the bottles.
  Nurse -> Okay. Check them and call me if anything's down to a week.
  Caller -> I will. I'm pretty good about that, actually. It's the food I'm bad at.
  Nurse -> Ha. We'll work on the food.
  Caller -> Okay. Yeah. I'm also not drinking. Just so you know. Since you didn't ask. No beer, nothing.
  Nurse -> Good. That's good to hear, Quentin. Thank you for telling me.
  Caller -> Yeah.
  Nurse -> Ha. Tell the soup guy, no more soup.
  Caller -> I will. I'll tell him. He means well.
  Nurse -> I'm sure. Anything else you want to ask me?
  Caller -> No, I think that's it. Oh. Is it okay if I walk a little? Like, around the block?
  Nurse -> Short and slow is fine, as long as you're not winded. If you get winded, stop and sit.
  Caller -> Okay. Short and slow. Okay.
  Nurse -> Alright. I'll talk to you this evening.
  Caller -> Okay. Thanks, Joanne.
  Nurse -> Take care.
  Caller -> Bye.
