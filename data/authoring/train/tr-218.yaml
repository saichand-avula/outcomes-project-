transcript: |
  Nurse -> Summit Palliative Care, this is Denise.
  Caller -> Hi, Denise. It's Tanya Brightwater. I think I took too much. I took a Percocet and then I took another one. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Tanya. I'm glad you called. First, how are you feeling right now?
  Caller -> A little sleepy. Kind of heavy. But I'm okay. I'm talking to you. || A2
  Nurse -> Okay. Is your breathing normal? Any trouble breathing, or slow breathing?
  Caller -> No. My breathing's fine. I'm breathing normal, I think. My friend Lacey's here. She says I'm breathing fine. || A3
  Nurse -> Good. Lacey being there is very good. Tanya, tell me exactly what you took and when.
  Caller -> I took one Percocet around eleven. Then my phone alarm went off, and I was confused, and I thought it was the alarm for my next one. And I took another one. That was maybe twenty minutes ago. || A1
  Nurse -> Okay. So two Percocet, about twenty minutes apart. Is that right?
  Caller -> Yes. One, then one. I know. I know. I'm sorry.
  Nurse -> It's okay. You did the right thing by calling. Let me get your birth date, and the number you're on.
  Caller -> January thirty first. Nineteen seventy nine. || patient_dob
  Nurse -> And five oh three, five five five, zero one two two? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. I'm going to page the on-call clinician right now so they can advise us. || R1
  Caller -> Okay. Thank you. Am I in trouble?
  Nurse -> No, not at all. We just want to make sure you're safe. Please don't take any more Percocet tonight, or anything else that makes you sleepy, until the on-call clinician says it's okay. || E1, A1
  Caller -> No more Percocet. Nothing sleepy. Okay.
  Nurse -> Stay awake, and keep Lacey right there with you. Don't go to sleep and leave her to wonder. Sit up if you can. || E2
  Caller -> Sit up. Stay awake. Lacey, you're staying. Lacey says she's staying all night.
  Nurse -> Good. I'll call you back in fifteen minutes to check on you. || R2
  Caller -> Fifteen minutes. Okay.
  Nurse -> And if it gets hard to wake you, Tanya, or your breathing slows down, Lacey needs to call nine one one right away. || E3
  Caller -> Hard to wake. Slow breathing. Nine one one. Lacey, did you hear that? She heard.
  Nurse -> Good. Tanya, can you turn off that alarm so it doesn't confuse you again?
  Caller -> I'm turning it off. Okay. It's off. I'll ask Lacey to set my pills up next time.
  Nurse -> That's a smart idea. We can talk about a pill organizer, too.
