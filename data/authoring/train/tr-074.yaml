transcript: |
  Nurse -> Little Oaks Pediatric Home Care, this is Priya.
  Caller -> Hi, Priya. It's Keisha Dunmore. I'm calling about my son. Malik. || caller_name, relationship, patient_name
  Nurse -> Hi, Keisha. What's his birthday?
  Caller -> May seventeenth, twenty eighteen. || patient_dob
  Nurse -> And I've got three one three, five five five, zero one five one. || callback_phone
  Caller -> Yes. That's me. || callback_phone
  Nurse -> What's going on?
  Caller -> He's coughing at night. Like, for three nights now. He wakes up coughing. || cc, A1
  Nurse -> Okay. Is he wheezing? Does it sound tight?
  Caller -> A little. Sometimes. I give him the albuterol, the two puffs, with the spacer. Twice a night. It helps for a bit. || A2
  Nurse -> Okay. Any fever?
  Caller -> No. No fever. He's been running around all day. Tell her, Malik. I'm okay, Mom! He says he's okay. || A3
  Nurse -> Ha. Okay. Is he talking in full sentences? Can he finish what he's saying?
  Caller -> Oh yeah. He doesn't stop. He's been telling me about his dinosaurs for an hour. || A4
  Nurse -> Good. Okay. Can you walk me through how you give the albuterol? || A2
  Caller -> I shake it. Put it in the spacer. He breathes in. Two puffs.
  Nurse -> Both puffs at once, or one at a time?
  Caller -> Um. Both. I do both. Is that wrong?
  Nurse -> Not wrong, but it's better one puff at a time. Shake it, one puff in the spacer, he breathes in and out slowly a few times, wait a minute, then the next puff. And rinse his mouth after. || E1
  Caller -> Okay. One at a time. I didn't know that.
  Nurse -> Per his orders, he can have two puffs every four hours as needed. So you can use it for the cough. || R3
  Caller -> Okay.
  Nurse -> I'm going to message his pediatrician about the night cough, since it's been three nights. || R1
  Caller -> Okay. Good.
  Nurse -> And I'll call you tomorrow to see how he did tonight. || R2
  Caller -> Okay. Tomorrow.
  Nurse -> If he can't talk in full sentences, if you see his ribs pulling in when he breathes, or his lips look blue, call 911. And call us if he's needing the albuterol more often than every four hours. || E2
  Caller -> Ribs, lips, sentences. Okay.
  Nurse -> Anything else?
  Caller -> No. Thank you, Priya. He says thank you too. Say thank you, Malik.
  Nurse -> You're welcome. Good night, Malik.
