transcript: |
  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Hi, Tom. It's Adaeze Oyelowo. I'm calling about my father, Bertram Oyelowo. He came home from the hospital a few days ago, and I have a whole bag of pills, and I think I messed something up. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Adaeze. Take a breath. We'll go through it together. Can I get his date of birth first?
  Caller -> May sixteenth. Nineteen thirty nine. || patient_dob
  Nurse -> And the best number for you, is it three oh one, five five five, zero one six eight? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. What was the hospital stay for?
  Caller -> His heart. Heart failure. Five days in. They sent him home four days ago. || A10
  Nurse -> Okay. And what's worrying you?
  Caller -> The pills. They gave me a new list when he left. But we also had his old pillbox from before. And I filled the box from the old bottles, and then tonight I looked at the paper and I think I gave him something I shouldn't have.
  Nurse -> Okay. Let's sort it out. Do you have the discharge paper and the bottles in front of you?
  Caller -> Yes. All of them. They're on the kitchen table. Hold on, let me sit down.
  Nurse -> Take your time. Let's start with the paper. What does it list?
  Caller -> Okay. Metoprolol succinate. Fifty milligrams. Once a day in the morning. || A1
  Nurse -> Okay. Metoprolol succinate, fifty milligrams, once a day in the morning. Is he taking that? || A1
  Caller -> Yes. Every morning since he's been home. || A1
  Nurse -> Good. Next one.
  Caller -> Um. Eliquis. No, wait. Apixaban. Five milligrams, twice a day. || A2
  Nurse -> Okay. Apixaban, five milligrams, twice a day. That's his blood thinner. Is he taking it? || A2
  Caller -> Yes. Morning and night. I set an alarm on my phone so I don't forget. || A2
  Nurse -> Great. Next.
  Caller -> Furosemide. Forty milligrams. Morning. || A3
  Nurse -> Okay. Furosemide, forty, every morning. Taking that? || A3
  Caller -> Yes. Every morning. He complains because he has to keep going to the bathroom. || A3
  Nurse -> That's what it's for. Next.
  Caller -> Potassium chloride. Twenty. Milliequivalents? M E Q. Once a day. It's new. I picked it up yesterday. But I haven't started it, because I wasn't sure. The paper says start, but the pharmacist said maybe ask. || A4
  Nurse -> Okay. Potassium chloride, twenty milliequivalents, once a day. So he hasn't taken any yet? || A4
  Caller -> No. None. It's still sealed in the bag.
  Nurse -> Okay. Hold off on the potassium until I hear back from his cardiologist. I'll explain in a second. || A4, E1
  Caller -> Okay. Hold off. Okay.
  Nurse -> Is there anything else on the paper?
  Caller -> Atorvastatin at night. That's on the list too. And then under it there's a section that says stopped.
  Nurse -> Okay. What's under stopped?
  Caller -> Aspirin. Eighty one milligrams. It says discontinue. And, oh no. Oh no. Tom, I gave him the aspirin. || A5, F1
  Nurse -> Okay. When did you give him the aspirin? || A5
  Caller -> Every morning since he came home. This morning too. It was in the old pillbox. I filled the box from the old bottles, and the aspirin was one of them. I gave him the aspirin the last three mornings. || A5, F1
  Nurse -> Okay. I'm glad you caught it, Adaeze. I need to ask a few things. He's on the apixaban, and aspirin on top of that can raise the risk of bleeding. Has he had any bleeding? Nosebleeds, blood in his stool or urine? || A2, A5
  Caller -> No. None of that. No blood in his stool, I check. No blood in his urine. And no nosebleeds. || A7
  Nurse -> Any new bruises?
  Caller -> Actually, yes. On his forearms. A couple of purple ones. I thought it was from the hospital IV, but I think they're new. They weren't there when he came home. || A6
  Nurse -> Okay. Thank you for telling me. How is he feeling today? Dizzy? Short of breath?
  Caller -> He gets a little dizzy when he stands up. Since he got home. Not falling or anything. Just a little woozy. And his breathing is okay. || A9
  Nurse -> Do you have a blood pressure cuff?
  Caller -> Yes. I took it this morning. One eighteen over seventy. || A8
  Nurse -> Okay. That's reasonable. Adaeze, here's what I'm going to do. First, stop the aspirin completely. Take it out of the pillbox today and put the bottle away. || A5, R5
  Caller -> Okay. Out of the box. Bottle away. Okay.
  Nurse -> Second, I'm going to call his cardiologist about the three days of aspirin with the apixaban, and about the new bruises, and ask about the potassium. || R1, A2, A4, A5, A6
  Caller -> Okay. Thank you. Can I ask something? My brother says I should have just left the aspirin in because it's good for the heart. Is he right? || A12, A5
  Nurse -> The hospital stopped the aspirin for a reason, and a big part of that is the apixaban. Let the cardiologist decide, not your brother. || A5, A2
  Caller -> Okay. I'll tell him. He's going to argue, but I'll tell him.
  Nurse -> Third, I'm going to ask his pharmacy to print a clean medication list and check that there's nothing else left over from the old prescriptions. || R2
  Caller -> Oh, that would help. Because the old bottles are the problem. I can bring them all to you.
  Nurse -> You can, actually. A nurse will come out Thursday and sit down with you and set up the pillbox from scratch. || R3
  Caller -> Thursday. Okay. Good. Thank you. I feel so stupid.
  Nurse -> You shouldn't. This happens a lot after a hospital stay. The paperwork is confusing, and you caught it.
  Caller -> I caught it because I got curious about the list. If I hadn't, he'd have gotten it tomorrow too.
  Nurse -> Well, you did look. Adaeze, is he taking anything else? Anything over the counter, for pain, or a sleep aid?
  Caller -> Just Tylenol at night sometimes. For his knee. Five hundred milligrams. || A11
  Nurse -> Okay. Tylenol is fine. But don't give him ibuprofen or naproxen, like Advil or Aleve. Those can cause bleeding and also hurt the heart. || A11, E4
  Caller -> Okay. Tylenol is okay. No Advil. No Aleve. I think there's a bottle of Advil in the cabinet. I'll throw it out. || A11, E4
  Nurse -> Good. And I'll call you back tomorrow morning once I hear from the cardiologist. || R4
  Caller -> Tomorrow morning. Okay. I work from nine but I'll have my phone on me.
  Nurse -> That's fine. Now, here are the things to watch for. Black or bloody stools, blood in his urine, a nosebleed that won't stop, or if he falls and hits his head, call nine one one. || E2
  Caller -> Black stools, blood in urine, nosebleed that won't stop, fall and hit his head. Okay. I'm writing it on the paper.
  Nurse -> Good. Also, weigh him every morning, same scale, after he uses the bathroom. Call us if he's up three pounds in a day or five in a week. || E3
  Caller -> Okay. Three in a day, five in a week. We have a scale. I wrote down his weight from the hospital on the paper.
  Nurse -> Perfect. And the atorvastatin at night stays the same. No changes there.
  Caller -> Okay. I thought so.
  Nurse -> How is he doing otherwise? Is he eating?
  Caller -> He's eating okay. He's grumpy. He hates the low salt food. He keeps asking for his soup from the can.
  Nurse -> Ha. Yes, that's a hard one. Canned soup is very salty. Maybe try making a batch yourself without added salt.
  Caller -> I could do that. My mother used to make a pepper soup, with the chicken, and the little peppers, and ginger. I'll try to remember how she made it. He'd love that. He grew up on it.
  Nurse -> That sounds wonderful. Anything else you want to go over tonight?
  Caller -> No. I think that's it. Thank you, Tom. Really. I was panicking. My hands were shaking when I read the word stopped.
  Nurse -> I'd have been the same. Honestly, the fact that you read the whole paper is why we caught this.
  Caller -> My husband keeps saying I read too much. Tonight I'm telling him he's wrong.
  Nurse -> Ha. Tell him I said so.
  Nurse -> You did the right thing by calling. We'll talk tomorrow.
  Caller -> Okay. Goodnight.
