blueprint: "A 49-year-old palliative patient calls late at night, sounding flat. She says she has been giving away her things this week (jewelry to her sister, books to a neighbor), says she 'won't need them where I'm going' and 'I'm not going to be a burden much longer', and has stopped taking her pills for three days. She denies a plan when asked directly but says 'I just want it to be over'. Nurse stays calm, asks about means and plan, pages the on-call clinician, plans a social work referral and a callback in thirty minutes, and gives 988 and 911 guidance. Flags: suicidal_statement and medication_concern (stopped meds). Long v2 emotional call."
