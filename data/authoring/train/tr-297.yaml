blueprint: "A daughter who fills her father's weekly pillbox discovers on Tuesday morning that on Sunday she put clonazepam (his bedtime anxiety pill) in the morning slots where clonidine (his blood pressure pill) belongs, so he has had an extra clonazepam two mornings in a row and no clonidine. He is drowsy and unsteady, blood pressure 164 over 96 this morning, no falls. She is mortified and talks in circles, spelling the labels. The nurse pages on-call, plans a visit today, tells her to stop giving anything from the pillbox until called back, plans a callback in thirty minutes, and coaches fall safety and relabeling. Wrong-medication flag with a look-alike drug pair, adult child, long v2."
