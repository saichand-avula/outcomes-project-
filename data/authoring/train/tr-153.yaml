  Caller -> No fluid. I took my temperature. Ninety nine point six. || A3
  Nurse -> Okay. What are you taking for the pain?
  Caller -> The oxycodone. Five milligrams. I took one this morning and one at lunch. || A4
  Nurse -> Okay. I'll message your surgeon's office about the pain and the redness. || R1
  Caller -> Okay. Thank you.
  Nurse -> And a nurse will come see you tomorrow. || R2
  Caller -> Tomorrow. Good. I'm home.
