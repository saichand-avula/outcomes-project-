  Nurse -> Anything else?
  Caller -> No. Thanks, Naomi. Sorry about all the back and forth with my birthday. I haven't slept well since the surgery, my brain is mush.
  Nurse -> No need to apologize. Rest is part of healing. Take it easy.
  Caller -> I will. Bye.
