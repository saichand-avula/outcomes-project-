transcript: |
  Nurse -> Summit Palliative Care, this is Carla.
  Caller -> Carla, it's Anya Volkov. It's my husband, Dmitri. He took the new antibiotic, the Bactrim, thirty minutes ago, and his lips are swelling. His tongue. He's wheezing. || caller_name, relationship, patient_name, cc, A1, A2, A4, F1
  Nurse -> Okay, Anya, I'm here. Is he having trouble breathing right now?
  Caller -> Yes. He says his throat is tight. And he has hives, all over his chest and arms. Big red welts. || A3, F1
  Nurse -> Okay. Anya, I want you to call nine one one right now. This sounds like an allergic reaction. || R1, F2
  Caller -> Nine one one. Okay. Should I hang up?
  Nurse -> Yes. But first, does he have an epinephrine pen? An auto-injector?
  Caller -> Yes. We have one in the kitchen drawer. From when he had the bee sting.
  Nurse -> Get it. Use it on the outside of his thigh, through his pants if you have to, and hold it in place for the time on the label. Then call nine one one. || E1
  Caller -> The pen. Thigh. Hold it. Nine one one. Okay. I'm getting it. Dmitri, sit up. Sit up. I'm coming.
  Nurse -> Sit him upright. Stay with him. Tell the dispatcher it's an allergic reaction to a new antibiotic. And quickly, in case we get cut off, his date of birth and your number.
  Caller -> March seventeenth, nineteen seventy five. And seven three four, five five five, zero one two seven. || patient_dob, callback_phone
  Nurse -> Got it. Use the pen first, then call. If he stops breathing or goes limp, tell the dispatcher right away.
  Caller -> Okay. Okay. Allergic reaction. Antibiotic. I have the pen. Okay. I'm doing it. He's looking at me. His eyes are scared. Thank you, Carla.
  Nurse -> Go. Call right after the pen.
  Caller -> Okay. Bye.
