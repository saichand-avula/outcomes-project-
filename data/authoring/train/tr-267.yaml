transcript: |
  Nurse -> Evergreen Hospice, this is Gail.
  Caller -> Hi, Gail. This is Lars Strand. My father is Everett Strand. He's got a problem with his bowels. || caller_name, relationship, patient_name, cc
  Nurse -> Hi, Lars. Let me pull your dad up. What's Everard's date of birth?
