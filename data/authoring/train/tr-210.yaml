transcript: |
  Nurse -> Willow Creek Hospice, this is Sofia.
  Caller -> Hi, Sofia. It's Judith Moyer. I'm calling for my father, Mortimer Eckhart. He hasn't gone to the bathroom in four days. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Judith. Thanks for calling. What's his date of birth?
  Caller -> March eighth, nineteen forty four. || patient_dob
  Nurse -> And I have eight four seven, five five five, zero one three three. || callback_phone
  Caller -> Yes. That's me. || callback_phone
  Nurse -> Okay. When you say he hasn't gone, no bowel movement at all for four days?
  Caller -> None. Not a thing. Since Sunday. And his belly's all puffed up. He keeps pushing on it. || A1, A2
  Nurse -> Okay. Is he in pain? How would he rate it, zero to ten?
  Caller -> He said a four. He said it's more uncomfortable than painful. A four, he said. || A2
  Nurse -> Okay. What's he taking for pain?
  Caller -> The oxycodone. When he needs it. He's been using it more this week. || A3
  Nurse -> Okay. And does he have a stool softener he's supposed to be taking?
  Caller -> He does. But he's been skipping it. He says it makes him gassy. I wasn't pushing it. || A4
  Nurse -> Okay. That would explain some of this. Is he vomiting, or is his belly hard?
  Caller -> No vomiting. It's puffy, but it's not hard like a rock. Soft, kind of. Just puffy.
  Nurse -> Okay. I'm going to send a nurse out tomorrow morning to check him. || R1
  Caller -> Tomorrow morning. Okay. That's good.
  Nurse -> And I'm going to message the hospice provider about it, since it's been four days. || R2
  Caller -> Okay. Thank you.
  Nurse -> Tonight, please restart the stool softener, and have him drink fluids. Prune juice is good. And jot down if he has any bowel movement. || E1, A4
  Caller -> Restart the softener. Prune juice. I'll write it down. Okay. We have prune juice.
  Nurse -> If he starts vomiting, has bad belly pain, or the belly gets very hard and swollen, call us right away. || E2
  Caller -> Vomiting, bad pain, hard belly. Okay.
  Nurse -> I'll call you back tonight to see how he's doing. || R3
  Caller -> Tonight. Okay. Thank you, Sofia. He hates talking about this, so I'm the one calling.
  Nurse -> That's what I'm here for. Take care.
