transcript: |
  Nurse -> Lakeshore Home Health, this is Frances.
  Caller -> Hello. This is Vernon Fairbairn. I'm calling about my wife, Edna Fairbairn. I have a question about her pills. || caller_name, patient_name, relationship
  Nurse -> Hi Mr. Fairbairn. I can help. What's your wife's date of birth?
  Caller -> November twenty second, nineteen forty one. || patient_dob
  Nurse -> And a number I can reach you at?
  Caller -> Nine oh one, five five five, zero one eight six. || callback_phone
  Nurse -> Nine oh one, five five five, zero one eight six. Is that right? || callback_phone
  Caller -> That's right. That's the kitchen phone.
  Nurse -> Is that a cordless one? In case we need you to move around the house.
  Caller -> It's a cord. A long cord. Twenty feet. My son in law put it in. I can reach the stove.
  Nurse -> Ha. That's convenient.
  Nurse -> Okay. What's your question?
  Caller -> It's the pain pills. Her knee. She has two. I get them mixed up. One is, it says take three times a day. The other says take as needed. And I don't know what that means. As needed. || cc
  Nurse -> That's a good question. Let's go through them. What are they called?
  Caller -> One's Tylenol. Five hundred milligrams. Three times a day. The other is, hold on, I have my glasses. It's tramadol. Fifty milligrams. Every six hours as needed. || A1, A2
  Nurse -> Okay. Tylenol five hundred, three times a day. Tramadol fifty, every six hours as needed. Is that what's on the bottles? || A1, A2
  Caller -> Yes. Those are the labels.
  Nurse -> Good. So here's the difference. The Tylenol is a scheduled one. That's the three times a day. You give it every day at the same times, whether she hurts or not. Like breakfast, lunch, and supper. || A1
  Caller -> No matter what? Even if she says she's fine?
  Nurse -> Even if she says she's fine. It works best when it's steady in her system.
  Caller -> Okay. And the tramadol? || A2
  Nurse -> That one is as needed. That means you only give it if she's hurting, and the Tylenol isn't enough. Not on a schedule. And not sooner than six hours after the last one. || A1
  Caller -> So I don't give it with the Tylenol. Or do I give it with the Tylenol? || A1
  Nurse -> You can give it at the same time as a Tylenol, if she needs it. They don't cancel each other out. Think of the Tylenol as the floor, and the tramadol as the extra. || A1, A2
  Caller -> The floor and the extra. Okay. I like that. That I can remember.
  Caller -> I used to be a carpenter. Floor and extra. I can picture it. A floor, and then a shelf on top.
  Nurse -> A shelf. Even better.
  Caller -> Forty years of floors and shelves.
  Nurse -> How is she doing right now? What's her pain?
  Caller -> She says it's a five. Her left knee. She's sitting with it propped up. She had her lunch, and the Tylenol with lunch. At noon. || A3
  Nurse -> When was her last tramadol? || A2
  Caller -> Yesterday evening. About seven. I gave her one for bedtime. She didn't need one this morning. || A2
  Nurse -> Okay. So it's been more than six hours. Is she sleepy, or confused, or dizzy today?
  Caller -> No. She's sharp. She did the crossword. She's mad at me for giving her the wrong word for seven across. || A4
  Nurse -> Ha. Good. Then I'd say, if her pain is staying above a four, and it's been at least six hours, it's okay to give her a tramadol now. And keep giving the Tylenol at breakfast, lunch, and supper no matter what. || E1
  Caller -> Above a four. Six hours since the last one. Tylenol every meal. Okay. And if she's a three, I don't give it. || A1
  Nurse -> Right. If it's a three or less, she can probably go without.
  Caller -> I wrote that down. Four. Six hours. Meals. I have it on the pad.
  Caller -> The pad is by the phone. The one from the pharmacy with the little green cross on it. I use it for everything.
  Nurse -> Great. Keep it near the pill box.
  Caller -> It's right next to it. I'm very careful about the pill box. I fill it every Sunday.
  Nurse -> Perfect.
  Nurse -> Perfect. I'm going to leave a message for the team to make a little chart for your fridge. Times for the Tylenol, and a box for the as needed one. So you don't have to remember. || R1
  Caller -> A chart. Oh, that would be wonderful. I'd put it right on the front. With the magnet.
  Nurse -> Great. And call us if she gets very sleepy or confused, or if the pain stays above a seven even after the tramadol. || A2
  Caller -> Very sleepy. Confused. Above a seven. Okay. I'll watch. She hasn't been above a six, I don't think.
  Nurse -> That's good. I'll call you tomorrow to see how it's going with the new routine. || E2, R2
  Caller -> Tomorrow. That's fine. I'm home. I'm always home. I don't go anywhere.
  Nurse -> Ha. That's easy then.
  Caller -> I do the crossword with her. We do it in pen. She finishes it by ten.
  Nurse -> In pen? That's brave.
  Caller -> She never makes mistakes. I make all of them.
  Nurse -> Ha. Seven across?
  Caller -> Five letters. Starts with a T. I said tempo. She said tangy. It was tangy.
  Nurse -> Ha. Edna wins.
  Caller -> She always wins.
  Nurse -> Anything else, Mr. Fairbairn?
  Caller -> No. That's what I wanted. Thank you. I felt silly asking.
  Nurse -> It wasn't silly. It's a very common question.
  Caller -> My son says I should have a smart phone and look it up. I said I'd rather call a person.
  Nurse -> A person is better. We're happy to help.
  Caller -> That's what I told him.
  Caller -> Thank you, Frances.
  Nurse -> You're welcome. Take care.
  Caller -> Bye.
