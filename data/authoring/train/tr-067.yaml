transcript: |
  Nurse -> Maple Lane Home Care, this is Joanne.
  Caller -> Hi. Hi, Joanne. It's Colette. Colette Ashworth. I'm a patient. || patient_name, caller_name, relationship
  Nurse -> Hi, Colette. Can I get your date of birth?
  Caller -> March eighth, nineteen seventy two. || patient_dob
  Nurse -> Thanks. And is five one two, five five five, zero one eight nine your cell? || callback_phone
  Caller -> Yeah. || callback_phone
  Nurse -> What's going on tonight?
  Caller -> I've just, I've been so nauseous. Since the chemo. It's been four days and it's not getting better. || cc, A1
  Nurse -> I'm sorry. How bad is it, zero to ten?
  Caller -> Like a five. Five, five and a half. I can eat a little. Crackers. || A1
  Nurse -> Okay. Are you vomiting?
  Caller -> No. Not tonight.
  Nurse -> Okay. Are you sleeping at all?
  Caller -> Not really. Hardly. I lie there. || A4
  Nurse -> Mm-hm.
  Caller -> I lie there and I just think. And I, I don't know.
  Nurse -> Take your time.
  Caller -> I just. Some nights I just wish I wouldn't wake up. || A2, F1
  Nurse -> Thank you for telling me that, Colette. I'm really glad you said it. Can I ask you a couple of questions?
  Caller -> Okay.
  Nurse -> When you think that, are you thinking about hurting yourself, or ending your life?
  Caller -> No. No, I'm not going to do anything. I wouldn't. I just think it. I'm just so tired. || A3
  Nurse -> Do you have a plan, or anything you've thought about using?
  Caller -> No. No plan. Nothing like that. || A3
  Nurse -> Okay. Is somebody there with you?
  Caller -> My sister. She's in the other room.
  Nurse -> Good. I'd like her to stay with you tonight. Is that okay?
  Caller -> Yeah. She'd do that. || E2
  Nurse -> Colette, I'm going to ask our social worker to call you tonight, because I want somebody to talk with you about how you've been feeling. || R1
  Caller -> Okay. Okay.
  Nurse -> And I'll send a nurse to see you tomorrow. I'll also message your oncologist about the nausea and your mood. || R2, R3
  Caller -> Okay. Thank you.
  Nurse -> I want you to have a number, too. If those thoughts get stronger, or you ever think you might act on them, call or text nine eight eight, any time. And call nine one one if it's an emergency. || E1
  Caller -> Nine eight eight. Okay.
  Nurse -> And you can call us here any hour, even just to talk. Okay?
  Caller -> Okay. Thank you for, for not freaking out.
  Nurse -> You did the right thing calling. We're going to take good care of you. || E3
  Caller -> Okay.
