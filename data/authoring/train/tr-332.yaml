blueprint: "A wife who just took over her husband's medicines gave him an extra Dilantin (100 mg) at three, thinking it was the Dilaudid for his belly pain; the two bottles sit side by side with similar labels. His pain is a seven and he has not had any Dilaudid, and since the extra dose he is sleepy, unsteady and a little queasy; no seizure. The nurse sorts out the bottles line by line, pages on-call, tells her to hold both medicines until the clinician calls, plans a visit within the hour and a callback in twenty minutes, and gives fall and seizure precautions. Wrong-medication flag plus uncontrolled pain, tall-man look-alike pair, spouse caller, phone from file, long v2."
