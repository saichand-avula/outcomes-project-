transcript: |
  Nurse -> Willow Creek Hospice, this is Carla.
  Caller -> Hi. Hi, um, hi. I need help with a medicine. It's my grandpa. || relationship, cc
  Nurse -> Okay. What's his name?
  Caller -> Cornelius Bell. || patient_name
  Nurse -> And his date of birth?
  Caller -> December first. Nineteen thirty three. || patient_dob
  Nurse -> Okay. And who am I speaking with?
  Caller -> I'm Keisha. I'm his granddaughter. I'm staying the night with him. || caller_name, relationship
  Nurse -> Okay, Keisha. A good number for you?
  Caller -> Three one three. Five five five. Oh one three four. || callback_phone
  Nurse -> Three one three, five five five, zero one three four. Got it. || callback_phone
  Caller -> Mhm.
  Caller -> Okay.
  Nurse -> So what's going on tonight?
  Caller -> Okay, so, he's moaning. Kind of moaning. And I think he's in pain. || A1
  Caller -> I'd say maybe a six? I don't, I don't really know how to tell. || A1
  Nurse -> Okay. Is he able to tell you?
  Caller -> No, he's mostly sleeping. He woke up for a second and he just kind of frowned.
  Nurse -> Okay. What's he got for pain?
  Caller -> The, um, the morphine. The liquid one. In the little brown bottle. || A2
  Nurse -> Okay. Can you read me the label?
  Caller -> Okay. Hang on. It says, morphine sulfate. Oral solution. And then it says, twenty milligrams per, and then it's torn. || A2
  Nurse -> Torn?
  Caller -> Yeah. The label's ripped right there. It was in the kit and the box got wet, I think. So I can't see the rest. || A2
  Nurse -> Okay. Is there anything else on the box, or a pharmacy sticker?
  Caller -> I'm looking. The box is, it's all soggy. There's a sticker but it's smeared. I can't read it.
  Nurse -> Okay. Do you know how much the nurse told you to give him?
  Caller -> The aide said, um, half a milliliter. Half a mil. But I'm not sure. I wasn't there when she said it. || A3
  Nurse -> Okay. So you've got a torn label, and you're not certain of the dose.
  Caller -> Right. Right. And I don't want to give him too much. But I don't want him hurting.
  Nurse -> I completely understand. And I'm glad you called. Here's the thing. I'm trying to pull up his medication list, but our system is running slow tonight.
  Caller -> Oh no.
  Nurse -> It's okay. I'm going to call our pharmacist on call to verify exactly what's on that bottle. I want to be one hundred percent sure before I tell you to give anything. || R2
  Caller -> Okay.
  Nurse -> So please don't give him the morphine yet. Hold off until I call you back. || R1
  Caller -> But he's in pain.
  Nurse -> I know. It shouldn't be long. I'll call you back in ten minutes. || R3
  Caller -> Ten minutes. Okay.
  Nurse -> In the meantime, can you reposition him? Maybe a pillow under his knees, or turn him a little. And loosen the blanket if he's hot. || E2
  Caller -> Okay. I can do that.
  Nurse -> And hold his hand, talk to him quietly. A lot of times that helps. || E2
  Caller -> Okay. I'm doing that now. He's, he's holding my hand.
  Nurse -> That's good. That's really good.
  Caller -> He was a city bus driver for thirty four years. Route nineteen. He still hums when he's comfortable.
  Nurse -> Oh, I love that. Does he hum now?
  Caller -> A little, earlier tonight. That's how I knew he was okay. And then the moaning started.
  Nurse -> That's helpful to know. When he's comfortable, we'll hope to hear the humming again.
  Caller -> Yeah. I hope so. He's got a great voice.
  Nurse -> I bet he does.
  Caller -> Mhm.
  Caller -> He used to sing in the church choir, too. My grandma always said that's why she married him.
  Nurse -> That's a lovely story. I hope he'll be humming again soon.
  Caller -> Is it okay if I ask something else?
  Nurse -> Of course.
  Caller -> He's been having trouble with his pills. The last couple of days. He coughs when he swallows them. Like, he chokes. || A4
  Nurse -> Okay. Which pills is he taking?
  Caller -> I don't know. Several. I just know he coughs.
  Nurse -> Okay. That's an important thing to tell us. When the nurse comes, she'll look at which pills can be stopped or switched to liquid. For tonight, don't force any pills. || A4
  Caller -> Okay. I won't.
  Nurse -> In general, when the label isn't clear, don't guess the concentration. Keep the bottle and the box together, and read the pharmacy sticker. That's the safest way. || E1
  Caller -> I'll keep it all together. I'm going to take a picture of the sticker, too. Maybe the camera can read it better.
  Nurse -> That's a good idea. Send it to us, or read it to me when I call.
  Caller -> Okay. I'll try.
  Nurse -> If he starts groaning more, or grimacing, or his breathing gets noisy or fast, call me right away, even before the ten minutes. || E3
  Caller -> Okay. I will.
  Nurse -> Alright. Talk to you in a few minutes, Keisha.
  Caller -> Thank you so much, Carla.
