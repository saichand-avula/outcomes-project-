transcript: |
  Nurse -> Willow Creek Hospice, this is Priya.
  Caller -> Priya, it's Beatriz Pereira. It's my father, Augustin. Please. || caller_name, relationship, patient_name
  Nurse -> Hi, Beatriz. What's his date of birth?
  Caller -> February second, nineteen thirty four. || patient_dob
  Nurse -> And your number, Beatriz?
  Caller -> Five oh eight, five five five, oh one four five. || callback_phone
  Nurse -> Okay. Tell me what's happening.
  Caller -> He's working so hard to breathe. And it's making this noise, a gurgling. Like a rattle. || cc, A1, A2, F1
  Caller -> It started about a half hour ago. He's been sleeping, he hasn't eaten or had anything to drink in three days. || A1, A3
  Nurse -> Okay. Is he awake?
  Caller -> No. He's sleeping. But his breathing, it sounds so hard. Can somebody please come out? I don't want him to suffer. || F2
  Caller -> My sister's here too. She wants somebody to come.
  Nurse -> Okay, Beatriz. I'm going to send a nurse to you. But first, let's help him right now. Do you have the comfort kit?
  Caller -> Yes. It's in the fridge. In the little box.
  Nurse -> Okay. Take out the morphine. It's the liquid, and the label should say twenty milligrams per milliliter. || A4, R1
  Caller -> Twenty milligrams per milliliter. Yes. That's what it says.
  Nurse -> Okay. Draw up point two five milliliters. That's a quarter of a milliliter, the very small amount. And put it under his tongue, in the cheek, gently. || A4, R1
  Caller -> Okay. A quarter. Point two five. Under the tongue.
  Nurse -> Yes. Take your time. It helps with the work of breathing, and with the discomfort. || R1
  Caller -> Okay. I'm doing it. I'm doing it. Okay. It's in.
  Nurse -> Good. That was perfect. Now, put extra pillows behind his head and shoulders, so he's raised up. Or turn him gently on his side. That helps the gurgling. || E1
  Caller -> Okay. Maria, help me with the pillows. Okay. Got him up.
  Nurse -> Good. And you can use a mouth swab to keep his lips and mouth moist. || E1
  Caller -> Okay.
  Nurse -> Beatriz, I want you to know that the gurgling sound is from secretions he can't clear anymore. It sounds worse to us than it feels to him. Usually it doesn't bother him. || E2
  Caller -> Okay. Okay. That helps. That helps, to hear that.
  Nurse -> I'm sending the nurse right now. She should be there within the hour. || R2
  Caller -> Within the hour. Okay. Thank you.
  Nurse -> And call me back any time before she gets there, if you need me. || E3
  Caller -> I will. Thank you, Priya.
  Nurse -> You're doing great. You're doing everything right.
