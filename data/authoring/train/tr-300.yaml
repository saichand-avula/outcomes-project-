transcript: |
  Nurse -> Cascade Palliative Care, this is Imani.
  Caller -> Imani. Hi. It's Philippa. Philippa Santoro. I'm having, my back, it's a nine. I took my pill at four and it did nothing. Nothing. This pain is killing me. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Philippa. I'm here. I'm so sorry you're hurting. Let's get you help. Can you tell me your date of birth?
  Caller -> February twentieth. Nineteen sixty three. || patient_dob
  Nurse -> Thanks. And what number are you on?
  Caller -> It's my cell. Eight one six, five five five, zero one seven three. || callback_phone
  Nurse -> Got it. Tell me about the pain. Where is it?
  Caller -> My back. The middle of my back. Between the shoulder blades. And it goes around, like a belt. It's been getting worse since yesterday. And tonight, it's like someone's twisting a knife. I could scream. I've been crying for an hour.
  Nurse -> I hear you. On a scale of zero to ten, where is it right now?
  Caller -> A nine. It's a nine. It was an eight at dinner. It's a nine now. I thought a ten was the worst you could imagine. This is the worst I can imagine.
  Nurse -> Okay. A nine. And what did you take?
  Caller -> The oxycodone. The ten milligram. I took one at four. That's the usual. Every four hours if I need it. I took it at four. It's, what, almost midnight? No. It's eleven twenty. So it's been seven hours. I should have taken another at eight. But I didn't, because I felt okay at eight. Then it got bad at nine. And I was afraid to take more. || A2
  Nurse -> Okay. Let me make sure I have it right. You took a ten milligram oxycodone at four this afternoon, and nothing since. Is that right? || A2
  Caller -> Nothing since. I should have. I was being stubborn. I didn't want to use too much. My daughter said, take it, take it. But I didn't.
  Nurse -> Okay. That's something we can work on. Are you taking anything else for the pain?
  Caller -> The gabapentin. The three hundred. Three times a day. I took the last one at eight. That's it. Oh, and I used the heating pad. For ten minutes. It made it worse. Or it didn't make it better. || A3
  Nurse -> Okay. Gabapentin three hundred, three times a day, last at eight. Thank you. Philippa, I want to ask you something, because I care about how you're doing. When you say the pain is killing you, are you having any thoughts of hurting yourself? || A3
  Caller -> What? No. No, no. God, no. That's just a thing you say. I'm not going to hurt myself. I just want the pain to stop. I want it to stop. That's all.
  Nurse -> Okay. Thank you for telling me. I believe you. I just needed to ask.
  Caller -> I understand. I'm sorry. I sound crazy. I'm exhausted and I'm in pain.
  Nurse -> You don't sound crazy. You sound like someone in a lot of pain. Okay. Is there any new weakness in your legs, or numbness? Any trouble walking?
  Caller -> No. No numbness. My legs are fine. They feel normal. I walked to the bathroom ten minutes ago, and it was fine. It's just the back pain. || A5
  Nurse -> Okay. And is your bladder or bowel working normally? Any trouble holding it, or trouble going?
  Caller -> Normal. I went to the bathroom. It was normal.
  Nurse -> Good. Have you had a bowel movement in the last couple of days?
  Caller -> Yesterday. It was fine. I take the stool softener every night. So that's not it.
  Nurse -> Okay. Good to know.
  Nurse -> Good. Any nausea, vomiting?
  Caller -> A little nausea. From the pain. I think. I feel queasy. I haven't thrown up. I had some crackers earlier. They stayed down. || A4
  Nurse -> Okay. Philippa, here's what I'm going to do. I'm paging the on-call clinician right now, so they can decide on the next step for your pain medicine. || R1
  Caller -> Okay. Please. Can I take another pill?
  Nurse -> I want the clinician to tell us the right dose, since the pain is so high and the last one didn't hold. Please wait for the callback before taking more. I know it's hard. I'll call you in ten minutes. || R3
  Caller -> Ten minutes. Okay. I can do ten minutes. I think.
  Nurse -> I'm also sending a nurse to your home. I want her there within the hour. She can check you and bring medicine if the clinician orders it. || R2
  Caller -> Within the hour. Okay. It's nearly midnight. Is that okay?
  Nurse -> Absolutely. We have a night nurse for exactly this.
  Caller -> Okay. Okay. Thank you.
  Nurse -> While you wait, let's try to make you a little more comfortable. Can you lie on your side, with a pillow between your knees? And a small pillow behind your back. Heating pad on low, over a thin shirt, not on bare skin. Keep the room dark and quiet. || E1
  Caller -> On my side. Pillow between my knees. Okay. I'm doing it. It's a little better. A little. Hold on. Okay. The heating pad. It's on low. Okay.
  Nurse -> Good. Breathe slowly. In through your nose, out through your mouth. Slow.
  Caller -> I'm trying. I'm trying. It's helping, a bit. It's hard to breathe slow when it hurts.
  Nurse -> I know. Even a little helps. Do you have the TV on or any noise?
  Caller -> The TV's on. A cooking show. It's on mute. I can't concentrate.
  Nurse -> Maybe turn it off for now. Keep it dark and quiet.
  Caller -> Okay. Off. Hold on. Okay.
  Nurse -> I know. Just try.
  Caller -> Okay. In. Out. In.
  Nurse -> That's it. Is anyone with you tonight?
  Caller -> My daughter. Gianna. She's asleep upstairs. I didn't want to wake her. She has an exam tomorrow.
  Nurse -> Would you be okay with waking her, so she can be with you while we wait? She might want to know.
  Caller -> She would be mad if I didn't. Okay. I'll go get her. Or I'll call up the stairs. I'll yell. Gianna! Gianna! Mom needs you! Okay. She's coming.
  Nurse -> Good. Philippa, please don't take any extra oxycodone until the clinician calls. And write down every dose and time on your sheet. || E2
  Caller -> Write it down. Okay. The sheet's on the table. I'll write that I took the four o'clock one. And the gabapentin at eight. || A3
  Nurse -> Perfect.
  Caller -> Gianna's here. She's wiping my face. She's a good girl.
  Caller -> She brought me water. And a cold cloth. She's very calm. She gets that from her father.
  Nurse -> Hi, Gianna. Your mom's doing a good job. The nurse is on her way and I'm calling the clinician.
  Caller -> She says hi. She says what do you need.
  Nurse -> Can you stay with her, and keep her on her side? And unlock the door for the nurse.
  Caller -> She says yes. She's going to unlock it now.
  Nurse -> Great. Philippa, I also need to tell you. If your legs start to feel weak or numb, if you can't control your bladder, or if you have trouble breathing, call nine one one right away. Don't wait for me. || E3
  Caller -> Weak legs, bladder, breathing. Nine one one. Okay. I'll tell Gianna.
  Nurse -> Good. I'm going to page now. I'll call you in ten minutes.
  Caller -> Okay. Thank you, Imani. I'm sorry I was dramatic.
  Nurse -> You were not dramatic. You were in pain. We take it seriously.
  Caller -> Thank you. Bye.
  Nurse -> Bye, Philippa.
