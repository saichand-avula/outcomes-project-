transcript: |
  Nurse -> Summit Palliative Care, this is Denise.
  Caller -> Hi, Denise. It's Karin. I'm Ottilie's daughter. Ottilie Brandvold. || caller_name, relationship, patient_name
  Nurse -> Hi, Karin. How do you spell her last name?
  Caller -> B R A N D V O L D. || patient_name
  Nurse -> Thanks. Her birthday?
  Caller -> February eighth. Nineteen fifty four. || patient_dob
  Nurse -> And I've got six one two, five five five, zero one four two for you. || callback_phone
  Caller -> Yes. That's my number. || callback_phone
  Nurse -> Okay. What's going on tonight?
  Caller -> Okay. So. It's a lot. She's been throwing up. Twice today. || cc, A1
  Nurse -> Okay. Twice.
  Caller -> Once this morning and once just now. About an hour ago. || A1
  Nurse -> Mm-hm. What did she throw up?
  Caller -> Mostly water. And some, like, yellow. Bile or something. Not blood. I checked. || A1
  Nurse -> Okay. Good that you checked.
  Caller -> Yeah.
  Nurse -> Has she had anything for the nausea?
  Caller -> The ondansetron. The little dissolving one. She took one at eight this morning. || A2
  Nurse -> Okay. The four milligram?
  Caller -> Yeah, I think so. Four. And it helped a little but then it came back this afternoon. || A2
  Nurse -> Okay.
  Caller -> And I'm almost out. I have three left. I counted. || A9
  Nurse -> Okay, good to know. Let me write that down.
  Caller -> Okay.
  Nurse -> What about pain? How is she?
  Caller -> She says about a five. Up here. In her upper belly and it goes through to her back. || A3
  Nurse -> Okay. And what's she taking for that?
  Caller -> She has the patch. The fentanyl patch. We changed it yesterday. Twenty five. || A4
  Nurse -> Okay. The twenty five microgram.
  Caller -> Yes. And she's had the oxycodone twice today. The five milligram. || A5
  Nurse -> When was the last one?
  Caller -> Um. Noon. Maybe one. Something like that. Around lunch. || A5
  Nurse -> Okay. Has it been helping?
  Caller -> Some. It takes the edge off. It doesn't get rid of it.
  Nurse -> Mm-hm. Okay. And her bowels? When was the last time she went?
  Caller -> Oh gosh. Three days. It's been three days. || A6
  Nurse -> Okay. Is she taking anything for it?
  Caller -> The senna. At night. But she hasn't been taking it the last two nights because she's been too sick. || A6
  Nurse -> Okay. That would do it. Is her belly swollen? Hard?
  Caller -> A little. It's, I don't know. It's a little puffy. It's not hard.
  Nurse -> Okay.
  Caller -> And there's something else. Her tongue. It's got a, like a white coating. Like milk. All over. || A7
  Nurse -> Okay. Does it hurt?
  Caller -> She says it feels kind of, it burns a little when she eats. Or drinks. || A7
  Nurse -> Has she been sleeping a lot today, or is she awake and talking with you?
  Caller -> Both. She slept most of the afternoon. But when she's up she's herself. She asked about my kids. She asked what we're having for dinner, which, I mean, she can't eat any of it, but she asked.
  Nurse -> That's a good sign, that she's herself.
  Caller -> Yeah. Yeah, it is.
  Nurse -> Mm-hm. Okay. And what is she eating and drinking?
  Caller -> Nothing. Almost nothing. Sips. Like, she'll take a sip of water and that's it. Tea, a little bit of tea this morning. || A8
  Nurse -> Okay.
  Caller -> I tried some applesauce and she wouldn't. She said it hurt.
  Nurse -> Mm.
  Caller -> I'm just. I don't know, Denise. I'm scared. I want to keep her home. That's what she wants. She's always said it. But I feel like she's getting worse and I don't know what I'm supposed to do. || A10
  Nurse -> I hear you, Karin. And you're doing a good job. What you're describing is what we can help with here at home. Okay?
  Caller -> Okay.
  Nurse -> So let's take it one thing at a time. First, the nausea. It's been about twelve hours since the ondansetron, right? Eight in the morning? || A2
  Caller -> Yes. Yeah. Eight.
  Nurse -> It's every eight hours as needed. So she can have another one at four. If it's already after four, she can have it now. || R5
  Caller -> It's after four. It's like eight at night. Oh. I should've given it earlier, huh?
  Nurse -> No, no. It's okay. Give her one now. It dissolves on her tongue, so she doesn't have to swallow it. || R5
  Caller -> Okay. Hold on. Let me get it. Mom. Mom, open your mouth. Okay. Under the tongue. Okay. Done.
  Nurse -> Good. Good job.
  Caller -> Okay.
  Nurse -> And since you're down to three, I'm going to send in a refill for the ondansetron tonight. || R1
  Caller -> Oh, thank you. Thank you. That's one thing I was worried about.
  Nurse -> Next, the white tongue. That sounds like thrush, which is a yeast infection in the mouth. It's common. I'm going to message her doctor about it, along with the vomiting and the constipation. They may want to prescribe something. || R2
  Caller -> Okay. Is that from the, the cancer?
  Nurse -> More from being sick and not eating much. Her mouth gets dry. Nothing you did.
  Caller -> Okay. That's a relief.
  Nurse -> In the meantime, rinse her mouth gently with a little water and baking soda. A quarter teaspoon in a cup of warm water. And you can wipe her tongue with a soft swab. || E2
  Caller -> Water and baking soda. Okay. A soft swab. I have those pink ones.
  Nurse -> Perfect.
  Caller -> Okay.
  Nurse -> For drinks, tiny sips only. Flat ginger ale, ice chips, popsicles if she'll take them. Don't push food. || E1
  Caller -> Popsicles. Okay. She likes the cherry ones.
  Nurse -> Cherry is great.
  Caller -> Ha. Okay.
  Nurse -> About the patch, make sure no heating pads or hot water bottles near it. Heat makes the medicine absorb faster and that can be dangerous. || E3
  Caller -> No heating pad. We had one on her back yesterday! I'll take it off.
  Nurse -> Yes, take it off, please. Not on or near the patch. Thank you for telling me.
  Caller -> Okay. I will. Sorry.
  Nurse -> No, it's good you asked. And leave the patch on. Don't take it off. It stays on until we change it. || R5
  Caller -> Okay. It stays on.
  Nurse -> I'm going to send a nurse to see her tomorrow. We'll look at her belly, her mouth, and go over everything. || R3
  Caller -> Tomorrow. Okay. Thank you.
  Nurse -> And I'll call you this evening, after I hear from the doctor. || R4
  Caller -> Okay. That would be good.
  Nurse -> Any fever? Has she felt hot, or had chills?
  Caller -> No. I took it at dinner. Ninety eight something. She's cool, if anything. Her hands are cold.
  Nurse -> Okay. And is she peeing?
  Caller -> Some. Not a lot. It's dark-ish.
  Nurse -> Mm-hm. That's from not drinking enough, so we'll work on that. And I see her pantoprazole on the list, the stomach pill. Is she still taking that one?
  Caller -> Yes, that one she keeps down. She takes it first thing in the morning with a sip. That one's fine.
  Nurse -> Good. Keep doing that.
  Caller -> Okay.
  Nurse -> Who else is at the house with you tonight?
  Caller -> Just me and my husband. Our kids are at college. My brother's coming this weekend from Duluth.
  Nurse -> Okay. That's good. You'll have some help.
  Caller -> Yeah. Yeah, I really need it. I've been sleeping on the couch next to her bed.
  Nurse -> I'm glad you're close by. Just make sure you rest when you can, too.
  Caller -> I'm trying.
  Nurse -> Now, here's what I want you to watch for. If she can't keep her pills down for a whole day. Or if she throws up blood, or something black like coffee grounds. Or if the pain gets really bad. Or she's too drowsy to wake up. Call us. || E4
  Caller -> Pills down. Blood. Black. Pain. Drowsy. Okay. I wrote it down.
  Nurse -> Good. Karin, you can call us any time tonight.
  Caller -> I know. I will. Thank you.
  Nurse -> Is your mom comfortable right now? Is she awake?
  Caller -> She's resting. She's kind of dozing. She said thank you. She says hi, Denise.
  Nurse -> Aw. Tell her hi back.
  Caller -> I will.
  Nurse -> Alright. Anything else?
  Caller -> No. I think that's all. I feel a little better.
  Nurse -> Good. Talk to you soon.
  Caller -> Okay. Bye.
