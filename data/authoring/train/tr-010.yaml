transcript: |
  Nurse -> Harbor Light Home Health, this is Marcus.
  Caller -> Hi Marcus. This is Irene Moretti. It's about my husband. || caller_name, relationship
  Nurse -> Hi, Irene. What's your husband's first name?
  Caller -> Frank. Frank Moretti. Same as mine, ha. || patient_name
  Nurse -> And his birthday?
  Caller -> June twelfth, nineteen forty three. || patient_dob
  Nurse -> Thank you. Is six one seven, five five five, zero one two one still the best number? || callback_phone
