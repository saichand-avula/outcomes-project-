  Nurse -> What's going on with Frank?
  Caller -> Okay, so, I want to start by saying he did not fall. || cc
  Nurse -> Okay.
  Caller -> I mean, I wasn't, I didn't see him fall. But I found him this morning, on the floor. By his recliner. || cc, A1
  Nurse -> Okay. So you found him on the floor.
  Caller -> Yes. But he didn't fall. He says he, he slid. He slid down out of the chair. || A1
  Nurse -> Okay. So he slid out of the recliner and ended up on the floor.
  Caller -> Right. Right. But that's not a fall, is it?
  Nurse -> It sounds like a fall to me, Irene, and that's okay. It's good that you called. When did this happen, do you know?
  Caller -> He says it was last night. After I went to bed. But I didn't find him until this morning.
  Caller -> Which, I don't, I don't know. He might've been down there all night. I feel terrible.
  Nurse -> Okay. Please don't feel terrible. Is he saying he was on the floor all night?
  Caller -> He says no. He says he was in the chair and then he slid in the morning. Early. Before I got up. So I don't know. || A1
  Nurse -> Okay. So the timing isn't clear. That's alright. Did he hit his head?
  Caller -> No. He says no. And I looked, there's nothing on his head. No bump. || A2
  Nurse -> Okay, good. Is he complaining of any pain? His hip, his back, his wrist?
  Caller -> No. He's not complaining of anything. He's actually fine. I looked him over and I don't see any bruises. || A3
  Nurse -> Okay. How did he get up off the floor?
  Caller -> My son was here. He came over for the morning. He and I got him up. And Frank walked to the bathroom with the walker. || A5
  Nurse -> Okay. Good. That's good to hear.
  Caller -> Yeah. And I don't want to make a big deal. But there's something else.
  Nurse -> Sure. Go ahead.
  Caller -> He's been so forgetful. The last couple of weeks. Like, he asks me the same thing three times. And this morning he didn't know why he was on the floor. || A4
  Nurse -> Okay. That's important, Irene. Has anything changed? New medications, or a fever, or any burning when he urinates?
  Caller -> No. No new medicines. And no fever. He's just, forgetful.
  Nurse -> Okay. I'm going to write this up as a fall, so it's in his record and the team knows. I've got that started now. || R3
  Caller -> Okay.
  Nurse -> And I'll have a nurse come out tomorrow morning to check him over for bruising, and do a proper assessment. Sometimes the bruises show up the next day. || R2
  Caller -> Tomorrow morning. Okay. Thank you.
  Nurse -> I'm also going to send a message to his physical therapist. She can come out and look at the house, the chair, the walker, and see what we can do to make it safer. || R1
  Caller -> Oh, that'd be wonderful. She's so nice.
  Nurse -> What's he wearing on his feet when he's walking around the house?
  Caller -> His slippers. The old leather ones. They're pretty worn out, honestly.
  Nurse -> Those can be slippery. Non-skid socks, or shoes with a back on them, are much safer, even indoors. || E1
  Caller -> I have those grippy socks from the hospital. I'll find them and put them on him.
  Nurse -> Perfect. Is the recliner a power one, or manual?
  Caller -> Manual. He pops it up and down himself. And sometimes it kind of kicks when it comes up.
  Nurse -> That can throw somebody off balance. For now, have him scoot to the edge of the seat first, and wait a moment before standing. || E1
  Caller -> Okay. Scoot forward and wait. I'll remind him.
  Nurse -> In the meantime, he needs to use the walker every time he gets up. Even for a short walk. And try to clear the floor of rugs and cords. || E1
  Caller -> Okay. I took the throw rug out already.
  Nurse -> Good. And please don't try to lift him by yourself if it happens again. Call us or call nine one one for help getting him up. || E1
  Caller -> Okay. I won't. I'll call.
  Nurse -> Now, if he gets a headache, or he's throwing up, or he's more confused than usual, or any new pain or bruising, call us. If he ever hits his head and he's drowsy or confused, call nine one one. || E2
  Caller -> Okay. Headache, throwing up, more confused. Okay.
  Nurse -> And I'll mention the forgetfulness to the nurse and to his doctor, too.
  Caller -> Thank you, Marcus. I really appreciate it.
  Nurse -> Of course. Anything else?
  Caller -> No. I think that's all.
  Nurse -> Okay. We'll see you tomorrow. Take care, Irene.
  Caller -> Bye.
