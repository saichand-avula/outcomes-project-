transcript: |
  Nurse -> Harbor Light Home Health, this is Hector.
  Caller -> Hi. I got a letter from my insurance company. An explanation of benefits? It says a visit from you was denied. I don't understand. Do I owe something?
  Nurse -> I'm sorry about the confusion. I'm a nurse, so I can't see billing or insurance information. The billing office would have that.
  Caller -> Oh. Is that a different number?
  Nurse -> Yes. Our billing office has its own line. It's printed on the statements we send, and it's on our website under contact.
  Caller -> I don't have the statement. I only have the letter from the insurance.
  Nurse -> Then you can call the main number again tomorrow during business hours and ask for billing. They can look you up.
  Caller -> Okay. Tomorrow. Business hours. It's Sunday, right? That's why nobody answered the other line.
  Nurse -> Yes, the billing office is closed on weekends. They'll open Monday morning.
  Caller -> Okay. Thanks. Sorry to bother you on a Sunday.
  Nurse -> No bother. Have a good evening.
  Caller -> You too. Bye.
