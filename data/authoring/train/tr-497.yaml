  Nurse -> Right.
  Nurse -> That's good.
  Caller -> I'll text my wife that the nurse is coming. She's been worried sick.
  Nurse -> Please do.
  Caller -> I'm working from home today. I'll set up at the kitchen table where I can see him.
  Caller -> I'll keep my headphones on one ear. So I can hear him call.
  Nurse -> Smart.
  Nurse -> That's helpful.
  Caller -> My boss was fine with it. I told her it was family.
  Nurse -> Perfect.
  Caller -> Thanks, Augusta. I'll feel better when the nurse comes.
  Caller -> You've been really helpful. This was less scary than I expected.
  Nurse -> I'm glad.
  Nurse -> She'll be in touch. In the meantime, call if anything changes.
  Nurse -> She'll call before. Take care.
  Caller -> One last thing. Should I keep him from the bathroom until the nurse comes?
  Nurse -> No. Just stay close and help him with the walker.
  Caller -> Okay. I will.
  Nurse -> Great. Talk soon.
  Caller -> Bye.
