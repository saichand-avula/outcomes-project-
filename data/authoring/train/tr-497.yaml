  Nurse -> Always call.
  Nurse -> It's worth calling, either way. A person on the floor in the middle of the night is something we always want to know about.
  Caller -> I always think I'm bothering people.
  Nurse -> You never are.
  Caller -> Okay. That makes me feel better.
  Caller -> I've been telling myself he's fine. But I needed someone else to say it.
  Nurse -> We'll see for ourselves when the nurse arrives.
  Nurse -> In the meantime, keep him in his chair or have him rest. And for the bathroom, add a night light, and a nonslip mat. Have him sit to dress, rise slowly, and keep the path to the bathroom clear at night. || E1
  Caller -> He wants to go back to bed. Is that okay?
  Nurse -> If he's comfortable, yes. Just check on him often.
  Caller -> I'll check every half hour.
  Caller -> Night light. Nonslip mat. Sit to dress. Rise slowly. Clear path. Okay. We have a night light in the garage. I'll plug it in this afternoon.
  Nurse -> Perfect.
  Caller -> I can do that today. I have an hour before my first meeting.
  Nurse -> Great.
  Caller -> We have a mat from when the kids were small. It has ducks on it.
  Nurse -> Ducks are fine.
  Nurse -> Perfect.
  Caller -> Should I be worried about his head? Even though he says no?
  Nurse -> I understand.
  Nurse -> Watch him closely today. Call 911 if he vomits repeatedly, if his headache gets worse, if he becomes confused or very sleepy, if one side of his body feels weak, or if he can't get up. || E2
