  Caller -> He gets tired in the morning. Sometimes he sits on the edge of the tub to catch his breath. So maybe.
  Nurse -> It's a possibility, yes.
  Nurse -> Okay.
  Caller -> I wanted to believe him. It's just, the way he was sitting, his feet were pointing to the door.
  Nurse -> Okay.
  Nurse -> Okay. That's a possibility. Did he say anything about hitting his head?
