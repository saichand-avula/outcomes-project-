  Caller -> I bet it does. You probably get people asking for pizza all the time.
  Nurse -> Not all the time. But sometimes.
  Caller -> Well, sorry about that. Do you guys deliver? Ha.
  Nurse -> Only nurses and aides, I'm afraid. No pepperoni.
  Caller -> Ha. Okay. Well. Have a good night.
  Nurse -> You too. Enjoy your pizza.
  Caller -> Thanks. Bye.
