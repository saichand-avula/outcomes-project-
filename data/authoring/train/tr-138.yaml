transcript: |
  Nurse -> Cedar Point Hospice, this is Beth.
  Caller -> Beth, it's Leonard Hutchins. It's my wife Cordelia. I think I did something wrong with her medicine. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Leonard, I'm here. Tell me her date of birth first.
  Caller -> June fifth. Nineteen forty four. || patient_dob
  Nurse -> And I have nine two eight, five five five, zero one six five for you. || callback_phone
  Caller -> Yes. Yes, that's the house. || callback_phone
  Nurse -> What happened with the medicine?
  Caller -> The morphine. The liquid. I gave her the dose, the five milligrams, and then I forgot I did it. And I gave her another one. About ten minutes later. Two doses. I gave her two. || A1, F1
  Nurse -> Okay. When was the second one?
  Caller -> Fifteen minutes ago. Maybe. I looked at the clock. || A1
  Nurse -> Okay. How is she right now? Is she awake?
  Caller -> She's sleepy. Very. But if I say her name she opens her eyes. Cordelia. Cordelia. Yeah. She opened them. And closed them. || A2
  Nurse -> Okay. Is she breathing okay? Can you count her breaths for one minute?
  Caller -> Hold on. I'll count. One, two, three. Okay. About twelve. Twelve in a minute. Steady. || A3
  Nurse -> Any gasping? Any blue color around her lips?
  Caller -> No. No. Her lips are pink. Her breathing's calm. It's just slow-ish. No trouble. || A4
  Nurse -> Okay. Leonard, thank you for telling me right away. I'm going to page our on-call nurse right now. || R1
  Caller -> Okay. Please.
  Nurse -> And I'll call you back in five minutes. || R2
  Caller -> Five minutes. Okay.
  Nurse -> Until then, stay right next to her. Don't give her anything else. Keep checking her breathing, and keep saying her name to see if she wakes. || E1
  Caller -> Stay with her. Nothing else. Breathing. Name. Okay.
  Nurse -> And Leonard, if you can't wake her, if her breathing slows way down, or her lips turn blue, call nine one one right away. Don't wait for me. || E2
  Caller -> Nine one one. Can't wake her. Slow. Blue. Yes. Okay.
  Nurse -> I'll call in five.
  Caller -> I'm so sorry. I'm so sorry.
