  Caller -> Yes, my sister's inside. She said the door by the garden. But I can't see a garden.
  Nurse -> The front desk can guide you, or your sister can come meet you at the door.
  Caller -> I'll call her. Thank you. Sorry to bother you.
  Nurse -> No bother. I hope you find it. Take care.
