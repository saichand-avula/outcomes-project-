transcript: |
  Nurse -> Tidewater Home Health, this is Casimir.
  Caller -> Hi, Casimir. It's Rafaela Ostrowski. I'm a patient. I just got home from the hospital last week. I'm on warfarin and I think I have two different doses and I don't know which is right. || caller_name, patient_name, relationship, cc, F1, A1
  Nurse -> Hi, Rafaela. Thanks for calling. Let's go through it. What does the bottle say?
  Caller -> Sorry, I'm a little frazzled. I've been staring at these papers for an hour.
  Nurse -> That's okay. Take a breath.
  Caller -> The warfarin bottle says four milligrams. No, wait. Five. Five milligrams. Every evening. I'm sorry. I had it in my hand upside down. Five. || A1
  Nurse -> Five milligrams, every evening. And what does the discharge paper say?
  Caller -> I have the paper right here. It's three pages stapled together.
  Caller -> The paper from the hospital says two point five. Two point five milligrams, once a day, in the evening. It's in the medication list. I read it three times. || A2
  Nurse -> Okay. So the bottle says five and the paper says two point five.
  Caller -> Yes. And nobody told me they'd changed it.
  Nurse -> Thanks.
  Nurse -> Okay.
  Caller -> Yes. Exactly. And I've been taking the five. For three nights. Because that's what the pharmacy gave me. And I figured the pharmacy knows.
  Nurse -> Okay. That was a reasonable thing to do. When was your last dose?
  Caller -> Last night. At about eight. Same as the other two.
  Nurse -> Okay. Same time each night.
  Caller -> I have an alarm. It's the only thing I haven't forgotten.
  Nurse -> Okay. Have you noticed any bleeding, or bruising?
  Caller -> Bruises. A few. On my forearms. Purple ones. Like I bumped into something, but I don't remember bumping. They're not big. || A3
  Nurse -> Okay.
  Nurse -> Okay. Any nosebleeds? Bleeding gums?
  Caller -> No nosebleeds. My gums are fine. I brushed this morning. No blood in the sink.
  Nurse -> And your stools? Any black or tarry stools, or blood?
  Caller -> No. They're normal. I looked. I know that one from the discharge talk. Nothing black. Nothing red. || A4
  Caller -> That was a weird sentence to say out loud. Sorry.
  Nurse -> Ha. Not weird at all.
  Nurse -> Good. That's what I wanted to know. Any dizziness, headache, falls?
  Caller -> No falls. Maybe a slight headache this morning. But I had coffee late and I think that's it.
  Nurse -> Okay. We'll mention it.
  Nurse -> Okay.
  Caller -> I'm scared that I took too much. Is that dangerous?
  Nurse -> I understand. It's a reasonable worry.
  Nurse -> I'm glad you called. Let's find out which dose is right. I can't tell you that, and neither can you. The clinician needs to decide. Let me get a few things first. What's your date of birth?
  Caller -> September third. Nineteen sixty eight. || patient_dob
  Nurse -> And your number?
  Caller -> Two one two, five five five, oh one seven four. || callback_phone
  Nurse -> Two one two, five five five, oh one seven four. Correct? || callback_phone
  Caller -> Yes.
  Nurse -> Okay. I'm going to page the on-call clinician right now about the two doses and the three nights of the higher one. || R1
  Caller -> Okay. Thank you.
  Nurse -> I'll also call the pharmacy and ask them what the prescription says. || R2
  Caller -> They'll be closed in an hour. They close at five.
  Nurse -> Then I'll do it right now.
  Nurse -> I'll call them right away, then.
  Caller -> Thank you.
  Nurse -> I'll call you back today, once I've heard from the clinician. || R3
  Caller -> Today. Okay. I'll stay by the phone.
  Caller -> It's charged. I'm not going anywhere.
  Nurse -> Perfect.
  Nurse -> In the meantime, don't take tonight's dose until the clinician calls you back. And keep the bottle and the discharge paper together, so we can read them both. || E1
  Caller -> Don't take tonight's. Keep both together. Okay. I'm putting them in a bag.
  Nurse -> Good. Also, please be careful with bleeding. Avoid any activity where you could fall or get hurt, and use a soft toothbrush.
  Caller -> Soft toothbrush. I have one. I'll be careful on the stairs.
  Caller -> I also have an electric razor. I bought it before I left the hospital.
  Nurse -> Good thinking.
  Nurse -> And call 911 if you see black or bloody stools, if you vomit blood, if you have a nosebleed that won't stop, or if you fall and hit your head. || E2
  Caller -> Black stools. Vomiting blood. Nosebleed. Head hit. 911. Okay. I wrote them on the pad.
  Nurse -> Good.
  Caller -> Is it okay if I take Tylenol for the headache?
  Nurse -> Ask the clinician when they call. That's a good question for them.
  Caller -> Okay. I'll wait.
  Caller -> My sister is coming at six. She's going to cook. Is it okay if she does?
  Nurse -> That's fine. Just no changes to your medicines.
  Nurse -> Rafaela, you did the right thing, calling.
  Caller -> I almost didn't. I figured I'd wait until tomorrow.
  Caller -> I thought I was being dramatic.
  Nurse -> You weren't.
  Nurse -> I'm glad you didn't.
  Caller -> Thank you, Casimir.
  Nurse -> You're welcome. Talk soon.
  Caller -> Bye.
