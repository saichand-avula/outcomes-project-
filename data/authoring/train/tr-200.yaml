transcript: |
  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Hello? Hello? Is this the nurse? I can barely hear. Hold on. My hearing aid. It's dead. Can you talk louder?
  Nurse -> Yes, this is Tom, the nurse at Lakeshore Home Health. Can you hear me better now?
  Caller -> A little. Say it slow. It's Odell. Odell Whitmire. I'm calling because I did something silly. || caller_name, relationship, patient_name
  Nurse -> Hi, Odell. I'm listening. First, what is your date of birth?
  Caller -> What? Say again.
  Nurse -> Your date of birth, Odell?
  Caller -> January twenty eighth. Nineteen thirty four. || patient_dob
  Nurse -> Thank you. And your phone number?
  Caller -> Nine three one, five five five, zero one six five. || callback_phone
  Nurse -> Nine three one, five five five, zero one six five. Is that right? || callback_phone
  Caller -> Yes. That's the house. || callback_phone
  Nurse -> Okay. I'm going to speak slowly. Odell, can you tell me what happened?
  Caller -> What? Tell you what happened? Yes. Hold on. Let me turn the TV off. It's the game show. Hold on. Okay. It's off. I can hear you a little better.
  Nurse -> Good. Tell me what happened.
  Caller -> I took my pills this morning. And then I took them again. I forgot that I took them. Both times. The metro pro lol and the lay six. Both of them. Twice. || cc, A1, A2, F1
  Nurse -> I'm sorry, I want to make sure I understand. Which pills did you take twice? Was it metoprolol, the heart pill? || A1
  Caller -> What? Metoprolol? Yes. Metoprolol. The twenty five. That's the one. || A1
  Nurse -> And the other one, was it Lasix, the water pill? || A2
  Caller -> Lasix. Yes, the water pill. The twenty. I took two. Twice. I mean I took the Lasix twice. And the metoprolol twice. || A2
  Nurse -> Okay. Metoprolol twenty five milligrams twice this morning, and Lasix twenty milligrams twice this morning. Is that right? || A1, A2
  Caller -> Yes. That's right. Twice. I'm ninety two years old and I forgot I took them. My daughter used to set them out for me but she moved to Arizona.
  Nurse -> I understand. When did you take the second set?
  Caller -> What? The second what?
  Nurse -> The second time you took the pills. What time?
  Caller -> About noon. Maybe a little after. I took the first at eight. I saw them on the table and I thought, oh, I forgot my pills. || A1, A2, A7
  Nurse -> Okay. How are you feeling right now?
  Caller -> Dizzy. When I stand up. Lightheaded. And weak. My legs feel like noodles. And my heart is slow, I can feel it, thump, and then a wait, and then thump. || A3
  Nurse -> Okay. That sounds uncomfortable. Let's check your blood pressure. Take your time.
  Nurse -> Okay. Do you have a blood pressure cuff?
  Caller -> What? A cuff? Yes. My daughter got me one with the big numbers. Hold on. Let me put it on. It takes a while. Okay. It says ninety eight over fifty six. || A4
  Nurse -> Ninety eight over fifty six. Is that right?
  Caller -> Yes. Ninety eight over fifty six. And the pulse says fifty too. || A5
  Nurse -> Fifty two? Did you say fifty two for the pulse?
  Caller -> Yes. Fifty two. Not fifty too. Fifty two. That's what it says. || A5
  Nurse -> Okay. Thank you. Odell, have you fallen, or fainted at all?
  Caller -> What? Fallen? No. I almost did. I grabbed the counter. But no. I didn't fall. I'm sitting in my chair now. || A6
  Nurse -> Okay. That's good. Have you had anything to eat or drink today?
  Caller -> What? Eat? Oatmeal at eight, with the pills. And coffee. Two cups. That's all. I wasn't hungry. And I don't drink much water, it makes me go to the bathroom.
  Nurse -> Okay. Odell, I'd like you to drink a glass of water now, slowly, and eat a few crackers if you have them. The water pill can dry you out, and you took two. || E4, A2
  Caller -> What? A glass of water and crackers. The water pill dries me out. Okay. I have crackers in the cupboard but I'll have to stand. I'll do it slow. Or I'll wait. I have a bottle of water here by my chair. I'll drink that.
  Nurse -> Good, the bottle by your chair is perfect. Please stay seated, or better, lie down. I'm going to help you. Are you alone in the house?
  Caller -> What? Alone. Yes. Just me and the cat. My wife passed ten years ago. || A7
  Nurse -> I'm sorry, Odell. Okay. First, I want you to hold your pills tonight. Don't take the evening metoprolol, and don't take any more Lasix, until the on-call nurse calls you. || R1
  Caller -> What? Hold the pills? Don't take them? Okay. Don't take the evening ones. Okay. Until she calls. I understand. I'll leave them in the box.
  Nurse -> Good. I'm going to page our on-call nurse right now. || R2
  Caller -> What? Page? Okay. I don't know what that is. But okay.
  Nurse -> It means I'm sending a message to the nurse on call so she can help you tonight. A nurse will also come to your house within two hours. || R3
  Caller -> Within two hours. Okay. Someone is coming. Good. The door will be locked. I'll have to unlock it.
  Nurse -> Yes. When you're able, please unlock the front door, but don't stand up fast. Go slowly.
  Caller -> Slowly. Okay.
  Nurse -> And I'll call you back in twenty minutes. || R4
  Caller -> Twenty minutes? Okay. Will I hear the phone? My hearing aid is dead.
  Nurse -> Odell, do you have a fresh battery for your hearing aid?
  Caller -> What? Battery? I think there are some in the drawer. In the kitchen. I'd have to get up.
  Nurse -> Wait until you feel steadier. When you can, replace the battery so you can hear the phone. If you can't find one, keep the phone right next to you, with the ringer turned up. || E3
  Caller -> Ringer up. Phone next to me. Okay. I'll try to find the battery after the nurse comes.
  Nurse -> That works. Now, here are some safety things. Lie down, or sit with your feet up. Stand up slowly with a hand on the wall. And keep the phone beside you. || E1
  Caller -> Feet up. Hand on the wall. Phone beside me. Okay. I put a pillow under my feet. That's good. I feel a little better sitting.
  Nurse -> Good. And Odell, call nine one one if you faint, if you have chest pain, if your pulse goes under forty, or if you can't get up. || E2
  Caller -> What? Nine one one if I faint. Chest pain. Pulse under forty. Can't get up. Okay. I understand that one.
  Nurse -> Perfect. Now, so this doesn't happen again, I'd like to help you with a pill organizer. The kind with the day and the time on each box, and a note where you write when you've taken them. || E3
  Caller -> A pill organizer. Yes. My daughter said that. I have one somewhere. A purple one. It's in the closet. I never used it. I thought I didn't need it.
  Nurse -> The nurse who visits tonight can help you set it up. It's not a failing. It's a tool. Many people your age use one, and many younger people too.
  Caller -> Okay. I'll use it. I don't want to do this again. It scared me.
  Nurse -> I'm glad you called. That was the right thing. Do you have any family nearby who could come over tonight?
  Caller -> What? Family? My son lives forty minutes away. He works nights at the plant. My daughter is in Arizona. I don't want to bother them. They worry.
  Nurse -> I understand. But I'd like you to let your son know, even if he can't come. He'd want to know. Could you call him after we hang up?
  Caller -> Call my son. Yes. He'll yell at me. Then he'll come. He always yells and then he comes.
  Nurse -> That sounds like love. Okay. How's your cat? What's the cat's name?
  Caller -> What? The cat? Biscuit. She's on my lap. She won't leave me alone. She knows something's wrong. She's an orange one, nineteen years old, same as the hearing aid, ha. We're both on our last batteries.
  Nurse -> Animals do know. Keep her close. I'll call you in twenty minutes.
  Caller -> Twenty minutes. Okay. Thank you, Tom. Thank you for talking slow.
  Nurse -> Of course. Hang in there.
  Caller -> I will. Goodbye.
