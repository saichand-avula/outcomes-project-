transcript: |
  Nurse -> Maple Lane Home Care, this is Beth.
  Caller -> Hi, Beth. It's Colin Fraser. I'm a patient. || patient_name, caller_name, relationship
  Nurse -> Hi, Colin. Your date of birth?
  Caller -> August twelfth, nineteen eighty one. || patient_dob
  Nurse -> Okay. And I've got six oh two, five five five, zero one three six for you. || callback_phone
  Caller -> That's right. || callback_phone
  Nurse -> It's pretty early. What's going on?
  Caller -> I can't sleep. I haven't been able to sleep, I don't know, maybe three weeks? Something like that. || cc, A1
  Caller -> I'm up until like three or four in the morning. Every night. || A1
  Nurse -> Okay. Are you in pain, is that what's keeping you up?
  Caller -> No, no, the pain's fine. It's not that. || A5
  Nurse -> Okay. Have you tried anything?
  Caller -> I took the melatonin. Three milligrams. It didn't do anything. || A2
  Caller -> So I was wondering if the doctor could give me something. Like a real sleeping pill. || cc
  Nurse -> Okay. I can ask. Can I ask you a couple of questions first? Just so I give them the full picture.
  Caller -> Sure.
  Nurse -> How's your mood been? Have you been feeling down, or hopeless?
  Caller -> No. No, not at all. I'm not depressed or anything. I'm just tired. || A3
  Nurse -> Okay. And do you have any thoughts of hurting yourself?
  Caller -> No. Absolutely not. || A4
  Nurse -> Okay. Thank you for answering. I ask everyone.
  Caller -> No, that's fine. I get it.
  Nurse -> So, I'll send a message to your provider about the sleeping medication. I can't promise what they'll say, but I'll ask. || R1
  Caller -> Okay. Thank you.
  Nurse -> And I'll call you back later today once I hear. || R2
  Caller -> Great.
  Nurse -> Until then, don't take any over the counter sleep aids, like Benadryl, or anything with diphenhydramine in it, until the provider replies. They can interact. || E2
  Caller -> Okay. I wasn't going to. Okay.
  Nurse -> And a few things that help. Same bedtime, same wake time, even on weekends. No screens for an hour before bed. No caffeine after noon. And keep the room cool and dark. || E1
  Caller -> I do look at my phone a lot. In bed.
  Nurse -> That's probably part of it.
  Caller -> Yeah. Okay. I'll try the no phone thing.
  Nurse -> If you start feeling hopeless, or you have any thoughts of hurting yourself, or you go a few days with no sleep at all, call us. And in a crisis, you can call or text nine eight eight, or call nine one one. || E3
  Caller -> Okay. I will.
  Nurse -> Anything else?
  Caller -> No. Thanks, Beth.
