transcript: |
  Nurse -> Riverbend Hospice, this is Tom.
  Caller -> Tom, it's Dennis. It's my dad. Harlan Quigley. I think he passed. || caller_name, relationship, patient_name, cc, F2
  Nurse -> Oh, Dennis. I'm so sorry. Take a breath. Tell me what you're seeing.
  Caller -> He's not breathing. I've been watching for a couple of minutes, he's not breathing. And his hands are cold. || A1, A3
  Nurse -> Okay. Is there a pulse, can you feel one?
  Caller -> I tried. His wrist, his neck. I don't feel anything. || A1
  Nurse -> Okay. When did you notice?
  Caller -> About ten minutes ago. I was sitting with him. He'd been sleeping, peacefully, all night. And then I just noticed. It got quiet. || A2
  Nurse -> Okay. Thank you for staying with him. What's his date of birth, Dennis?
  Caller -> June sixteenth, nineteen thirty eight. || patient_dob
  Nurse -> Okay. And I have the number on file for you. Is that the best way to reach you?
  Caller -> Yes. Use the one you have. I'm not going to remember it right now.
  Nurse -> That's okay. I have it.
  Caller -> Can you come? Please. Can somebody come? I don't know what to do. || F1
  Nurse -> Yes. Yes, I'm sending a nurse right now. She'll be there within the hour. || R1
  Caller -> Okay. Okay.
  Nurse -> Dennis, you do not need to call nine one one. He's on hospice, comfort care, and he has a do not resuscitate. Nobody needs to rush in to do anything. Just stay with him. || E1
  Caller -> Okay. I wasn't going to. I just wasn't sure.
  Nurse -> That's completely understandable. The nurse will come, confirm what you're seeing, and take care of everything from there. She'll help with the next steps, too. || R1
  Caller -> Okay.
  Nurse -> I'm also letting our team know right now, the doctor, and the social worker, so everyone is aware. || R2
  Caller -> Thank you. Thank you, Tom.
  Nurse -> In the meantime, there's no hurry. Take whatever time you need. You can sit with him, and call whoever you'd like to be with you. Please don't move him, or take anything off him. And keep his medicines where they are, the nurse will take care of them. || E2
  Caller -> Okay. My sister is on her way. I'll call her again.
  Nurse -> Good. I'm staying on the line if you want, until you feel steady.
  Caller -> No, I'm okay. I'm okay. I'll sit with him.
  Nurse -> Okay. You're not alone in this, Dennis. The nurse is coming.
  Caller -> Thank you.
