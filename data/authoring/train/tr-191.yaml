transcript: |
  Nurse -> Riverbend Hospice, this is Rhonda.
  Caller -> Hi there. I'm one of your volunteers. I come on Tuesdays to sit with a gentleman. I was hoping to switch this week's visit to Wednesday. I have a dentist appointment Tuesday afternoon and I forgot.
  Nurse -> Thanks for letting us know. I'm one of the nurses, so I don't manage volunteer schedules. That's the volunteer coordinator's office.
  Caller -> Oh. Is there a number I should call?
  Nurse -> It's the same main number, but press three at the menu. They're in until four thirty.
  Caller -> Press three. Okay. I'll call right now. I just didn't want him to think I'd forgotten him.
  Nurse -> That's very thoughtful. The coordinator will let the family know.
  Caller -> Wonderful. He loves his Tuesday chess game. I'll bring the board on Wednesday.
  Nurse -> I'm sure he'll be glad to see you. Thank you for what you do.
  Caller -> My pleasure. Goodbye.
