blueprint: "Three days after hospital discharge a wife calls home health because her husband is dizzy and washed out: pulse 52, blood pressure 98 over 60. Reading every bottle aloud with the nurse, they discover she has been giving both the new metoprolol tartrate 25 mg twice a day from the discharge list and the old metoprolol succinate 50 mg once a day, and also the lisinopril 10 mg the discharge sheet says to stop, plus furosemide 40 mg (two 20 mg tablets). No fainting, no chest pain. The nurse pages on-call, tells her to hold the metoprolol, lisinopril and furosemide until the clinician calls, sends a nurse within two hours, calls back in thirty minutes, and gives fall precautions and a plan to remove the old bottles. Duplicate medicines found while chart reading, medication concern flag, spouse caller, long v2."
