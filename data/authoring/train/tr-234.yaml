transcript: |
  Nurse -> Evergreen Hospice, this is Gail.
  Caller -> Hi, Gail. This is Annelise Vandermeer. I'm calling about my mother, Henrietta Vandermeer. Her left knee hurts. It's been three days. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Annelise. Sorry to hear that. What's her date of birth?
  Caller -> March twenty fifth, nineteen forty. || patient_dob
  Nurse -> And I have five one nine, five five five, zero one two one for you. || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. How bad is the pain, zero to ten?
  Nurse -> About a six, I'd say. She's been wincing when she stands. || A1, label_error
  Nurse -> Okay. Did she fall or bump it? Any injury?
  Caller -> No. Nothing like that. She didn't fall. I asked her three times. It just started to hurt. || A3
  Nurse -> Okay. What has she taken for it?
  Caller -> The Tylenol. Six hundred and fifty milligrams. She had one this morning at about eight. It helps a little, for a couple of hours. || A2
  Nurse -> Okay. I'm going to message the hospice provider about the knee pain, since the Tylenol isn't holding it. || R1, A2
  Caller -> Okay. Thank you. Can she have more of it? She keeps asking.
  Nurse -> Let's stick to the label. Space the Tylenol at least six hours apart, and don't go over the daily maximum on the bottle. The provider may have another option. || E2, A2
  Caller -> Six hours. Daily maximum. Okay. I'll check the bottle. It's the extra-strength one.
  Nurse -> I'm also going to send a nurse out tomorrow to look at the knee. || R2
  Caller -> Tomorrow. That's good. I'll be here.
  Nurse -> For comfort in the meantime, prop the knee up on a pillow. A cool pack wrapped in a cloth for fifteen minutes at a time can help. And try not to have her bend it for long stretches. || E1
  Caller -> Pillow. Cool pack, wrapped. Fifteen minutes. Not bending it too long. Okay. We have a gel pack in the freezer.
  Nurse -> That'll work. Anything else, Annelise?
  Caller -> No. I just hate seeing her wince. She never complains, so I know it must hurt.
  Nurse -> I know. We'll get her taken care of.
