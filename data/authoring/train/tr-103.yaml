  Caller -> Yeah, he does the first half. I do the second. We're tired, but we're managing.
  Nurse -> Good. That sounds like a plan that works.
  Caller -> Yeah. And my mom's coming Thursday to help, so that'll be nice. She's driving up from Pueblo.
  Nurse -> That will help a lot. Is Theo eating any solid food right now, or mostly just the bottles?
  Caller -> Mostly bottles. He'll take a few puffs, the little melt things, but not really. He's not interested.
  Nurse -> That's very normal with a stuffy nose. Bottles are what matter right now.
  Nurse -> That's a great sign. Okay. Here's what I'm going to do. I'll message his pediatrician about day five and the fever. || R1
  Caller -> Okay. Thank you.
  Nurse -> And I'm going to come see him tomorrow myself, to listen to his lungs. || R2
  Caller -> Oh good. Tomorrow. Okay.
  Nurse -> And I'll call you tomorrow morning before that, to see how the night went. || R3
  Caller -> Okay.
  Nurse -> You can give the Tylenol again, the same three point seven five, as long as it's been six hours since the last one. || R4
  Caller -> Okay. Six hours. So like, in an hour.
  Nurse -> Right. For the stuffy nose, use the saline drops and then the bulb suction before feeds and before he goes to sleep. And run the cool mist humidifier in his room. || E1
  Caller -> We have the humidifier. It's going. The saline, yes.
  Nurse -> And keep his head raised a little when he's sleeping. Not with a pillow, but you can put a rolled towel under the mattress at the head end. || E1
  Caller -> Under the mattress. Okay.
  Nurse -> Small feeds, often. And keep counting the wet diapers. || E2
  Caller -> I will.
  Nurse -> Now call us if he has fewer than three wet diapers in a day, or if his fever goes to a hundred and two or higher. || E3
  Caller -> Three diapers. A hundred and two. Okay.
  Nurse -> And call nine one one right away for blue lips, fast or hard breathing, or if he's hard to wake up. || E3
  Caller -> Blue lips. Hard breathing. Hard to wake. Okay.
  Nurse -> Anything else you want to ask me?
  Caller -> No. I feel a lot better. Thank you, Priya. You always calm me down.
  Nurse -> Anytime, Hannah. Talk tomorrow.
  Caller -> Okay. Bye.
