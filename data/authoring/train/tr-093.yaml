transcript: |
  Nurse -> Thank you for calling Pinecrest Hospice. This is Gwen. Can I have the patient's name?
  Caller -> Wilbur Tennyson. W I L B U R. Tennyson. || patient_name
  Nurse -> Thank you. And his date of birth?
  Caller -> February twenty seventh, nineteen forty. Dad, hold on. Dad, stay in the bed. || patient_dob
  Nurse -> And who am I speaking to?
  Caller -> This is Fiona. His daughter. || caller_name, relationship
  Nurse -> Thank you, Fiona. Can I have a good callback number in case we get disconnected?
  Caller -> Six seven eight, five five five, zero one three seven. Sorry. Hold on. Dad. || callback_phone
  Nurse -> That's okay.
  Caller -> I'm sorry. Okay. He's having trouble breathing. And he's agitated. || cc, A1, A2, F1
  Nurse -> Mm-hm.
  Caller -> He started around four. I woke up and he was, he was breathing fast. || A1
  Nurse -> Okay.
  Nurse -> Is he moving around a lot? Trying to get out of bed?
  Caller -> Yes. Yes. He keeps trying to sit up. He's pulling at the, at his shirt. || A2
  Nurse -> Okay. When did he last have any medicine?
  Caller -> Last night. Around ten. I gave him his normal stuff. || A3
  Nurse -> Okay. Fiona, I'm looking at his comfort kit orders. For the trouble breathing, he can have the morphine, the point two five milliliters, under his tongue. || R1
  Caller -> Okay.
  Nurse -> Do you have the morphine bottle in front of you? || R1
  Caller -> Yes, I have it. It's the little one with the dropper. Yes.
  Nurse -> Okay. Go ahead and give that now.
  Caller -> Okay. Okay. Dad, open. Open your mouth, Dad. Under the tongue. Okay. Okay. It's in.
  Nurse -> Good. Now, for the agitation, he can have the lorazepam, the half a milligram. Give that now too, or if you want to start with the morphine and see, that's fine. || R2
  Caller -> I think, let me see how he does. With just the morphine. || R1
  Nurse -> Okay. That's okay.
  Caller -> Okay.
  Nurse -> If he's still restless in ten or fifteen minutes, give the lorazepam. || R2
  Caller -> Okay. Fifteen minutes. Okay.
  Nurse -> And I'll call you back in about thirty minutes to see how he's doing. || R3
  Caller -> Thirty minutes. Okay. Thank you.
  Nurse -> Raise the head of the bed up if you can. And put a fan, a small one, so it blows gently toward his face. That helps the feeling of breathing. || E1
  Caller -> I have a fan. I'll get the fan. Okay.
  Nurse -> And stay with him. If you need us sooner than that, call back. Don't wait for the thirty minutes. || E2
  Caller -> Okay. Okay. I'm here. Thank you, Gwen.
  Nurse -> Okay. Thank you. Okay.
