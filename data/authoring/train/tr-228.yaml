transcript: |
  Nurse -> Bluebell Home Care, this is Kim.
  Caller -> Kim, it's Linh Pham. I'm with Quang Tran this morning. I made a mistake. I gave him the wrong pill. || caller_name, relationship, patient_name, cc, F1
  Nurse -> Okay, Linh. Take a breath. Tell me what happened. Quang Tran? What's his date of birth?
  Caller -> April twenty second, nineteen sixty seven. || patient_dob
  Nurse -> Thank you. And I have seven one four, five five five, zero one seven five for you. || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. What did you give him?
  Caller -> There are two pill boxes on the counter. His and his wife's. They look the same. I took his wife's by accident. It had a lisinopril in it. Ten milligrams. I gave it to him with his breakfast. || A1, F1
  Nurse -> Okay. When was that?
  Caller -> Thirty minutes ago. About thirty. Then I looked at the name on the box and I saw. I felt sick. || A1
  Nurse -> Okay. He doesn't take a blood pressure medicine, is that right?
  Caller -> Right. He has none. That's his wife's. She has the high pressure. I didn't give him anything else from her box. I checked. Just the one. || A1
  Nurse -> Okay. Do you have a blood pressure cuff in the house?
  Caller -> Yes, there's one. I just took it. It's one oh eight over seventy. That's what it said. || A2
  Nurse -> Okay. Is he dizzy, lightheaded, anything like that?
  Caller -> No. He says he feels fine. He's sitting at the table doing his crossword. I asked him twice. He's not dizzy. || A3
  Nurse -> Okay. Thank you for catching it and calling right away. I'm going to page the on-call clinician now. || R1
  Caller -> Oh, thank you. Am I in trouble? Is he going to be okay?
  Nurse -> You did the right thing by telling us. The on-call clinician will say what to watch for. I'll call you back in thirty minutes. || R2
  Caller -> Thirty minutes. Okay.
  Nurse -> Until then, please don't give him any more lisinopril, and keep the two pill boxes in separate places. And please hold his other pills until the on-call clinician calls. || E1, A1
  Caller -> No more of that. Separate boxes. Hold the other pills. I'll put his wife's box in her bedroom. Okay.
  Nurse -> Have him sit for a minute before he stands, stay close when he walks, and take his pressure again in thirty minutes. || E2
  Caller -> Sit first. Stay close. Pressure again. Okay. I'm so sorry.
  Nurse -> It's okay. Is his wife home?
  Caller -> She's at her appointment. She'll be back at noon. I should tell her, right?
  Nurse -> Yes, tell her. It's good for her to know. Call me if anything changes.
  Caller -> I will. Thank you, Kim.
