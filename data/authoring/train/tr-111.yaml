transcript: |
  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Hi, Tom. It's Agatha Fenwick. I'm calling about my husband, Lucius. Lucius Fenwick. || caller_name, relationship, patient_name
  Nurse -> Hi, Agatha. His birthday?
  Caller -> July twenty fifth. Nineteen forty three. || patient_dob
  Nurse -> And I have eight six four, five five five, zero one six two. || callback_phone
  Caller -> Yes. That's the house. || callback_phone
  Nurse -> What can I do for you?
  Caller -> It's his blood thinner. The warfarin. They checked his INR yesterday. And the clinic called and said it was high. Three point eight. || cc, A2
  Nurse -> Okay.
  Caller -> And they told me something about tonight's pill. But I was cooking, and I, I wrote it down wrong. I think they said skip it. Or was it half? I don't know. || A4
  Nurse -> Mm-hm. What does he normally take?
  Caller -> Five milligrams. Every evening. At six. || A1
  Nurse -> Okay. Let me look at the clinic note in his chart. I'm seeing warfarin five milligrams. And the note from yesterday says, hold tonight's dose. Then two and a half milligrams tomorrow evening. And recheck the INR Friday. || A1, R1
  Caller -> Hold tonight's. So skip it.
  Nurse -> Skip it tonight, yes. Half a pill tomorrow. || R1
  Caller -> Skip tonight. Half tomorrow. Okay. Oh, thank goodness. I almost gave it to him.
  Nurse -> Good thing you called. Has he had any bleeding? Gums, nose, bruising?
  Caller -> His gums. A little. When he brushes. There's a little pink on the toothbrush. || A3
  Nurse -> Okay. Any nosebleeds, black stools, anything like that?
  Caller -> No. No. Just the gums. A little.
  Nurse -> Okay. I'm going to call the anticoagulation clinic and make sure that plan is right, and tell them about the gums. || R3
  Caller -> Okay.
  Nurse -> And the Friday INR is on the schedule. I'll make sure someone comes to draw it. || R2
  Caller -> Okay. Friday. Good.
  Nurse -> Use a soft toothbrush, and if he shaves, an electric razor. || E2
  Caller -> He has an electric. And a soft brush. I'll get a softer one.
  Nurse -> And call nine one one if the bleeding doesn't stop, if his stool is black or bloody, if he throws up blood, or if he hits his head. Call us for more gum or nose bleeding. || E1
  Caller -> Black stool, throws up blood, hits his head. Nine one one. Okay.
  Nurse -> Anything else?
  Caller -> No. Thank you, Tom.
