  Nurse -> I'll call you back this evening to see how she's doing. || R3
  Caller -> Okay. This evening.
  Nurse -> Until then, offer her water or diluted juice every hour while she's awake. Small amounts are fine. || E1
  Caller -> Every hour. Diluted juice. Okay. She'll drink apple juice if it's watered down.
  Nurse -> Perfect. And call us if her temperature goes over one oh two, if she gets chills, back pain, or confusion, or if she doesn't pass urine for eight hours. If you can't wake her, call nine one one. || E2
  Caller -> Over one oh two. Chills. Back pain. Confused. No urine, eight hours. Can't wake her, nine one one. Okay.
  Nurse -> Anything else?
  Caller -> No. Thank you, Denise.
