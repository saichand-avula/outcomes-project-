transcript: |
  Nurse -> Oakhaven Home Health, this is Priya.
  Caller -> Hi, Priya. It's Calvin Delgado. My wife Marisol ran out of her Gabapenton yesterday, and she had a terrible night. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Oh no. I'm sorry, Calvin. Let me get her chart up. What's her birth date?
  Caller -> November twenty sixth. Nineteen fifty two. || patient_dob
  Nurse -> And I have five one two, five five five, zero one four nine for you. || callback_phone
  Caller -> Yeah, that's the house. She's right here, but I'm calling because she doesn't like to bother you.
  Nurse -> That's fine. When did she run out?
  Caller -> Yesterday morning. She took the last one yesterday morning. I thought we had a refill, but the pharmacy says it's out of refills. The Gabapenton. Three hundred milligrams. Three times a day. || A1, F1
  Nurse -> Okay. So she's missed the afternoon and evening doses yesterday and this morning's as well.
  Caller -> Yes. All of them. And last night the burning in her feet came back. Bad. She didn't sleep. She was up and walking around the house at two in the morning. || A2
  Nurse -> Okay. I'm sorry to hear that. I put in a refill request for the Gabapenton with her prescriber just now. It's done. || R1, A1
  Caller -> Oh, thank goodness. How long will that take?
  Nurse -> I'm also calling the pharmacy so it's ready as soon as the prescriber approves it. I did reach the pharmacy and they're holding the Gabapenton for you. || R2, A1
  Caller -> Okay. I can pick it up. I'll go the minute you tell me.
  Nurse -> I'll call you this evening with where it stands. || R3
  Caller -> This evening. Okay.
  Nurse -> When you do get the bottle, have her restart at her usual dose. Please don't double up to make up for the missed ones. || E1, A1
  Caller -> Don't double up. Just the usual. Okay. She wouldn't anyway. She's careful.
  Nurse -> Is there anything else I can do?
  Caller -> No. I just feel bad. I should have checked the bottle last week.
  Nurse -> Don't feel bad. It's easy to miss.
