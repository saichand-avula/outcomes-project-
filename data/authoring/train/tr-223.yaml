transcript: |
  Nurse -> Evergreen Hospice, this is Gail.
  Caller -> Hello, Gail. This is Nadia Khoury. My husband is Elias Khoury, K H O U R Y. He has a rash. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Hi, Nadine. Thanks for spelling it. What's Elias's date of birth?
  Caller -> March ninth, nineteen sixty three. No, I'm sorry. March eleventh. Eleventh. Nineteen sixty three. || patient_dob
  Nurse -> Got it. March eleventh. And what number can I reach you at, Nadine?
  Caller -> Seven one eight, five five five, zero one two six. || callback_phone
  Nurse -> Okay. Tell me about the rash. Where is it?
  Caller -> On both his arms. The inside of the elbows mostly and down toward the wrists. It's red and bumpy and he's scratching it. He's had it two days. || A1
  Nurse -> Okay. Has he started any new medicine recently?
  Caller -> Yes. The amoxicillin. The doctor started it on Friday for the chest. Five hundred milligrams, three times a day. He took one this morning. || A2
  Nurse -> Okay. That timing is helpful. Any swelling in his face, his lips, his tongue? Any trouble breathing?
  Caller -> No. No swelling. His face looks the same. He's breathing the same as always. It's just the arms and it itches. || A3
  Nurse -> Okay. That's good to hear. I'm going to message the hospice provider today about the rash, since it started after the amoxicillin. || R1, A2
  Caller -> Should I stop the amoxicillin? || A2
  Nurse -> I'd like the provider to answer that, so please wait for them. I'll let you know what they say. I'm also going to send a nurse to see him tomorrow. || R2
  Caller -> Okay. Tomorrow. That's fine. I'll be here.
  Nurse -> For the itching, cool compresses help. Keep his nails short, try not to let him scratch, and no hot showers for now. || E1
  Caller -> Cool cloths. Nails. No hot showers. He loves a hot shower. I'll tell him.
  Nurse -> And this is important. If his lips, face or tongue start to swell, or he has any trouble breathing, call nine one one right away. || E2
  Caller -> Swelling. Breathing. Nine one one. Okay. I will.
  Nurse -> Anything else, Nadine?
  Caller -> No, that's all. Thank you.
