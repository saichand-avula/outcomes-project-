transcript: |
  Nurse -> Maple Lane Home Care, this is Joanne.
  Caller -> Joanne, it's Marilyn Draper. I'm calling about my husband, Ellis. Ellis Draper. And, really, I think I'm calling about me. || caller_name, relationship, patient_name, cc
  Nurse -> Hi, Marilyn. I'm glad you called. What's his date of birth?
  Caller -> November fifth. Nineteen forty four. || patient_dob
  Nurse -> And the best number for you, seven two seven, five five five, zero one six eight? || callback_phone
  Caller -> Yes. Yes, that's right. || callback_phone
  Nurse -> What's going on, Marilyn?
  Caller -> I'm tired. I'm so tired I can't think. I'm sleeping about three hours a night. If that. || A1, A2
  Nurse -> Tell me about the nights.
  Caller -> He gets up. Four, five times. He wanders. He thinks it's morning, he wants to go to work, he's been retired fifteen years. I have to follow him around the house. I can't sleep when he's awake. || A4
  Nurse -> That sounds exhausting. Marilyn, I have to ask. When you say you can't do this anymore, are you having any thoughts of hurting yourself, or him?
  Caller -> Oh, no. No, no. Never. I would never hurt him. And I'd never hurt myself. I'm not like that. I'm just worn out. I just need a break. A real one. || A3
  Nurse -> Okay. Thank you for telling me. I believe you. And needing a break is not a failure.
  Caller -> It feels like one.
  Nurse -> I know. I'm going to ask our social worker to call you about respite care, someone to come in so you can sleep. || R1
  Caller -> Oh. That would be, yes. Please. I didn't know there was such a thing.
  Nurse -> There is. And I'll call you tomorrow to see how the night went. || R2
  Caller -> Okay. Tomorrow. Thank you.
  Nurse -> Marilyn, if you ever feel overwhelmed or unsafe, you can call or text nine eight eight any time. And you can call us any hour. || E1
  Caller -> Nine eight eight. And you. Okay. Thank you for asking me. Nobody asks about me.
  Nurse -> I'm asking. Anything else?
  Caller -> No. That's it. Thank you, Joanne.
