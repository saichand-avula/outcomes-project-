transcript: |
  Nurse -> Bluebell Home Care, this is Ana.
  Caller -> Hey, Ana. It's Tamika. Tamika Strand, I'm one of the weekend aides. I'm over at Mr. Kessler's. Ambrose Kessler. || caller_name, relationship, patient_name
  Nurse -> Hi, Tamika. Hang on, I'm pulling him up. Is that K E S S L E R?
  Caller -> Yes ma'am. K E S S L E R. || patient_name
  Nurse -> Perfect. His date of birth?
  Caller -> March twenty seventh, nineteen forty four. || patient_dob
  Nurse -> Got it. What's the best number to call you at?
  Caller -> Four four three, five five five, zero one seven one. That's my cell, the house phone's been, it's been dead since the storm. || callback_phone
  Nurse -> Oh no, okay. Good to know. So what do you need today?
  Caller -> So, we're low on stuff. Like the briefs, we have six left. I counted. And the barrier cream, the white tube, we are out. We're out of that. || cc, A1, A2
  Nurse -> Okay. What about wipes and gloves?
  Caller -> Those are fine. We're good on gloves. We got a whole box.
  Nurse -> And his foam dressings? The ones for his heel?
  Caller -> Two. We have two left. Two of the, the square ones. || A3
  Nurse -> Okay. When did you last change the dressing on his heel?
  Caller -> The weekday aide did it Friday I think. I haven't touched it. It looked fine, it was clean and dry when I checked on Saturday.
  Nurse -> Good. Leave it alone unless it's soiled or coming off. How's he been doing otherwise, his mood and his appetite?
  Caller -> He's in a good mood. He's eating good. His daughter came by yesterday and brought him those little butter cookies and he ate, like, four of them. He's fine.
  Nurse -> Ha, okay. As long as he's eating. Is he getting up and moving around at all, besides the chair?
  Caller -> Just to the bed and back. We do the transfer with the, the lift thing, the board. He does okay with it.
  Nurse -> Alright. Anything going on with his skin that I should know about?
  Caller -> Yeah, actually, that's, that's the other thing. So yesterday when I changed him, I saw like a red spot. On his tailbone. || A4
  Caller -> It's about the size of a quarter. || A4
  Nurse -> Okay. Is the skin open at all? Any drainage, any broken skin?
  Caller -> No. No, it's not open. It's just red. It's dry, no, no drainage or anything. || A5
  Nurse -> Does it go away when you press it, or stay red?
  Caller -> Um. I'm not sure. I didn't try that. It's, it kind of stays red I think.
  Nurse -> Okay. And how much is he sitting up in the chair?
  Caller -> Oh, a lot. He's in the wheelchair pretty much all day. He likes watching his shows, you know, he doesn't want to lie down. He's got the, the ones with the cooking. He loves the cooking competitions. || A6
  Nurse -> My husband too. He'd watch those all day if I let him.
  Caller -> Oh, mine too. And then they want to eat everything after.
  Nurse -> Right? Okay. So let me put in an order. I'm going to order more briefs and the barrier cream. Do you want the same size, the large? || R1
  Caller -> Yes, large. The same.
  Nurse -> I'll have those delivered Thursday. They'll drop it at the house, and since the phone's out, I'll have the driver knock. || R2
  Caller -> Thursday. Okay. I'm not here Thursday, but the weekday aide is. She'll get it.
  Nurse -> Perfect. I'll also message our wound nurse today about that red spot on his tailbone so she can look at it. || R3
  Caller -> Okay. Good.
  Nurse -> And I'm going to have a nurse come out Friday to check his skin in person. || R4
  Caller -> Friday. Okay.
  Nurse -> In the meantime, Tamika, I need your help. Turn him or reposition him every two hours, even in the chair. Shift his weight. And try not to have him sitting in the wheelchair for more than about an hour at a time. || E1
  Caller -> An hour. He's not going to like that.
  Nurse -> I know. Maybe a little time in the recliner or on his side, with a pillow. And after every change, put a thin layer of the barrier cream on that area. || E1
  Caller -> But we're out of the cream.
  Nurse -> Right. Okay. Do you have any zinc oxide, like diaper rash cream, at the house? That works for tonight.
  Caller -> I can run to the drugstore after my shift. I'll grab some.
  Nurse -> That's fine. And call us if the skin opens up, if there's any drainage or a smell, or if he runs a fever. || E2
  Caller -> Opens up, drainage, smell, fever. Okay. I'll write it down.
  Nurse -> Does he have a pressure cushion in the wheelchair? The gel or foam one?
  Caller -> He does. It's the gray one. It's kind of flat though. I think it's pretty old.
  Nurse -> Okay. Let me have the nurse look at it on Friday too. They might want to swap it out.
  Caller -> Yeah, that'd be good. I'll make sure it's on the chair when she comes.
  Nurse -> Anything else you need?
  Caller -> No, I think that's it. Thank you, Ana.
  Nurse -> Thanks for catching that spot, Tamika. That's good work.
  Caller -> Thank you.
