transcript: |
  Nurse -> Riverbend Hospice, this is Rhonda.
  Caller -> Hi, Rhonda. It's Gideon. Gideon Zielinski. I'm calling about my mom, um, my mother's been, she has a. || caller_name, relationship
  Nurse -> Okay, Gideon. What's your mom's name?
  Caller -> Helena. Helena Zielinski. But, no wait. No, no, sorry. I'm calling about my dad. I'm sorry. My dad. Arturo. || patient_name
  Nurse -> Okay. So it's Arturo and not Helena.
  Caller -> Right. Yes. Arturo. Mom is fine. She's asleep. They're both on your service and I, I get them mixed up when I'm tired. Sorry. || patient_name
  Nurse -> That's okay. It happens. Arturo Zielinski. What's his date of birth?
  Caller -> July seventh. Nineteen forty. || patient_dob
  Nurse -> And I'll use six oh six, five five five, zero one five eight for you? || callback_phone
  Caller -> Yeah. That's me. || callback_phone
  Nurse -> What's going on with your dad?
  Caller -> He has a fever. I took it a few minutes ago. It was a hundred point nine. || cc, A1
  Nurse -> Okay. Hundred point nine. And has he got any other symptoms?
  Caller -> He says it burns. When he pees. Since last night. He said it burns. || A2
  Nurse -> Mm-hm.
  Caller -> And it's dark. His urine. It's really dark. And it smells. It smells strong. || A3
  Nurse -> Okay.
  Caller -> I mean I only know because he's in the bathroom, I help him. Sorry. That's too much information.
  Nurse -> No, no. That's exactly what I need. Has he had anything for the fever?
  Caller -> I gave him a Tylenol. Six fifty. The, the two of the three twenty-fives. Around ten this morning. || A4
  Nurse -> Okay. About ten. So that was about, what, six hours ago?
  Caller -> I think so. It's a little after four now, right?
  Nurse -> Yes. Okay. How's his thinking? Is he confused, or is he himself?
  Caller -> He's himself. He knows who I am, he knows where he is. He's just tired. He's really tired. || A5
  Nurse -> Mm. And is he eating and drinking?
  Caller -> Barely. He had some toast. He's not drinking much. I keep telling him to drink. || A6
  Nurse -> Okay.
  Caller -> Mom's the one who, she's the one who always makes him drink. And now she's asleep, so.
  Nurse -> How much has he had to drink today, would you say? Like a cup? Two cups?
  Caller -> Um. Honestly, maybe a cup. A cup and a half. I'm not great at keeping track. I should have a chart or something.
  Nurse -> That's okay. We'll sort it out. Is he up and walking around, or is he mostly in bed today?
  Caller -> Bed. Mostly in bed today. He got up to the bathroom twice with me holding him and that was it.
  Nurse -> Okay. That's helpful. And do you have help at the house today? Is anybody there with you?
  Caller -> My wife is coming at five after work. Until then it's just me. And Mom, who's asleep.
  Nurse -> Okay. Is your mom okay?
  Caller -> She's fine. She's okay today. She's sleeping. She slept through all this. Yeah.
  Nurse -> Okay. Good. Gideon, I'm going to send a nurse to see your dad this afternoon. She'll check him and see if this looks like a urinary infection. || R1
  Caller -> Okay. This afternoon. Good.
  Nurse -> And I'm going to message his doctor about the fever and the burning. If he needs an antibiotic, they can order it. || R2
  Caller -> Okay. That would be great.
  Nurse -> Since it's been about six hours, you can give him another Tylenol, the same six fifty. || R3
  Caller -> Okay. Six fifty. Okay.
  Nurse -> And get fluids in. Small sips, water or juice, every hour. Even just a few sips. || E1
  Caller -> Every hour. Okay. I'll set a timer.
  Nurse -> That's a good idea. And call us if his temperature goes to a hundred and two or higher, if he gets shaking chills, if he gets confused, or if the pain gets bad. || E2
  Caller -> A hundred and two. Chills. Confused. Pain. Okay.
  Nurse -> Does your dad usually have trouble with his urine, or is this new?
  Caller -> New. It's new. He had an infection like a year ago, before hospice, I think. He ended up in the hospital for it. So I'm, I'm a little nervous.
  Nurse -> I understand. We're going to get on this early, so hopefully it doesn't come to that. And he told us he doesn't want to go back to the hospital, so we'll do everything we can here.
  Caller -> Yeah. That's what he wants. He's said that a lot.
  Nurse -> Okay. I'll also let the visiting nurse know your mom is a separate chart, so she knows to check them both while she's there.
  Caller -> Oh, that's good. Yeah. Mom's been a little more tired too, but I think that's just, you know. It's been a long week.
  Nurse -> We'll look at her as well. Let's keep this call about your dad. Anything else I can do?
  Caller -> No. Just, thanks. I'm sorry about the mix up at the start.
  Nurse -> Don't worry about it. You're doing great.
  Caller -> Thanks, Rhonda. Okay. Bye.
