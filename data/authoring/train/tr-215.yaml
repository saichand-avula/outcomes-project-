transcript: |
  Nurse -> Harbor Light Home Health, this is Marcus.
  Caller -> Marcus, it's Kwame Osei. It's my father, Walter. He can't breathe. He's gasping. He can only say two words at a time. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Kwame. Is he awake? Is he talking to you?
  Caller -> Yes, he's awake. But his lips, they look blue. Kind of blue. I gave him the albuterol twice. In the last half hour. It's not helping. || A2, A3, F1
  Nurse -> Okay. Kwame, I want you to hang up and call nine one one right now. This is an emergency. || R1, F2
  Caller -> Nine one one. Okay. Okay. You don't want me to stay on?
  Nurse -> No. Call right now. Sit him up straight, leaning forward a little, and loosen anything tight around his neck or chest. Stay right with him. || E1
  Caller -> Sit up. Lean forward. Loosen his shirt. Okay. Dad, Dad, sit up. Okay.
  Nurse -> Tell the dispatcher he has COPD and his lips are blue. Quickly, his birthday and your number, in case we need to reach you.
  Caller -> July nineteenth, nineteen fifty six. And two oh two, five five five, zero one six four. || patient_dob, callback_phone
  Nurse -> Got it. Is the front door unlocked so the paramedics can get in?
  Caller -> No. It's locked. I'll go unlock it. Hold on. Okay, it's open. The porch light's on. And the dog is in the back room, I'll shut her in.
  Nurse -> Good. Is he any better, any worse, since we started talking?
  Caller -> The same. He's sitting up now. He's holding the arms of the chair. His eyes are really big. He keeps trying to say something, but he doesn't have the breath.
  Nurse -> That's okay. Tell him the help is on the way and that he doesn't have to talk. Just breathe slow if he can, in through the nose and out through pursed lips, like blowing out a candle.
  Caller -> Dad, in through the nose. Out like a candle. Like the therapist showed you. Okay, he's trying. He's trying.
  Nurse -> Perfect. Go. Call now. I'll let the office know, and I'm here after.
  Caller -> Okay. I'm calling. Thank you, Marcus.
