transcript: |
  Nurse -> Pinecrest Hospice, this is Gwen.
  Caller -> Gwen, it's Nils Lindholm. It's my mother. Gerda Lindholm. I gave her too much of the oxycodone. I think. I mixed something up. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Nils. I'm here. Stay with me. Her date of birth?
  Caller -> June twenty second. Nineteen thirty eight. || patient_dob
  Nurse -> And is six five one, five five five, zero one one seven your number? || callback_phone
  Caller -> Yes. Yes. || callback_phone
  Nurse -> Okay. Tell me what you gave her.
  Caller -> The oxycodone liquid. The label says five milligrams. And the syringe says milliliters. I filled the syringe to one. One milliliter. And then I looked at the paper, and it says point two five. So I gave her four times. Twenty milligrams. || A1, F1
  Nurse -> Okay. When did you give it?
  Caller -> Ten minutes ago. About. I looked at the clock. || A1
  Nurse -> Okay. How is she right now? Is she awake?
  Caller -> She's very sleepy. She's not talking. But when I touch her shoulder she opens her eyes a little. And closes them. || A2
  Nurse -> Okay. Can you count her breaths for a full minute?
  Caller -> Hold on. One. Two. Okay. About ten. Ten in a minute. || A3
  Nurse -> Okay. Nils, I'm going to page our on-call nurse right now. || R1
  Caller -> Okay. Please. Should I call nine one one?
  Nurse -> Not yet, because she's waking to touch and breathing ten times a minute. But if that changes, yes. I'll call you back in five minutes. || R2
  Caller -> Five minutes. Okay.
  Nurse -> Don't give her anything else. Stay right next to her. Keep touching her shoulder and watch her breathing. || E1
  Caller -> Nothing else. Stay. Watch. Okay.
  Nurse -> If you can't wake her, if her breathing drops below eight a minute, or her lips turn blue, call nine one one right away. || E2
  Caller -> Can't wake. Below eight. Blue. Nine one one. Okay.
  Nurse -> I'll call you in five.
  Caller -> I'm so sorry. I'm so sorry, Mom.
