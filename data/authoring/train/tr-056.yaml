transcript: |
  Nurse -> Willow Creek Hospice, this is Carla. How can I help?
  Caller -> Hi. Hi, Carla. It's, um, it's Dennis. My dad's a patient. Marvin. Marvin Fitzwater. || caller_name, relationship, patient_name
  Nurse -> Hi, Dennis. Can you spell that last name for me?
  Caller -> F I T Z W A T E R. || patient_name
  Nurse -> Thank you. And his birthday?
  Caller -> September fourteenth. Nineteen thirty eight. || patient_dob
  Nurse -> Okay. And I have a number here, four oh seven, five five five, zero one two two.
  Caller -> That's the house. That's the house phone.
  Nurse -> Is there a better one?
  Caller -> Yeah, use my cell. Four oh seven, five five five, zero one one three. || callback_phone
  Nurse -> Four oh seven, five five five, zero one one three. Okay. So what's going on tonight, Dennis?
  Caller -> Okay. So. It's kind of a lot. His, his breathing sounds really wet. Like a rattle. || cc, A1
  Nurse -> Mm-hm. Since when?
  Caller -> Since this afternoon. Like three? Maybe three. And it keeps getting louder. || A1
  Nurse -> Does he look like he's struggling to breathe? Is he working hard, gasping?
  Caller -> No. No, I don't, I don't think so. It just sounds bad. He's not gasping or anything. || A7
  Nurse -> Okay.
  Caller -> But he's also been really restless tonight. Picking at the sheets. Pulling at his gown. || A2
  Nurse -> Okay. Has he had anything for that?
  Caller -> I gave him the lorazepam. The little tablet, under his tongue. At nine. || A3
  Caller -> Nine o'clock. || A3
  Nurse -> Do you remember the dose?
  Caller -> Point five. Half a milligram. It's on the bottle. || A3
  Nurse -> Okay. Did it help?
  Caller -> For an hour. Maybe an hour. And then he started up again. || A3
  Nurse -> Okay. What about the morphine? Has he had any of that? || A9
  Caller -> The liquid? Yeah. At six. For the breathing. I gave him the point two five. || A9
  Nurse -> The point two five milliliters. Okay, good. That's his dose. || A9
  Caller -> Yeah.
  Nurse -> Is he eating or drinking anything?
  Caller -> No. Not since Sunday. He hasn't had anything since Sunday. Maybe a sip. He just turns his head away. || A4
  Nurse -> That's very common at this stage. How does his mouth look?
  Caller -> Dry. It's really dry. His lips are all cracked. || A5
  Nurse -> And is he making any urine?
  Caller -> A little. Just a little today. And it was dark. Like tea. || A6
  Nurse -> Okay. And his last bowel movement?
  Caller -> Oh gosh. Thursday? So that's, that's four days. || A8
  Nurse -> Alright. And his skin. Do you see any color changes? His hands, his knees?
  Caller -> His knees. They look kind of blotchy. Purple-ish. And his feet are cold. They're really cold. || A11
  Nurse -> Mm-hm.
  Caller -> Is that bad? Is that, is that the end?
  Nurse -> It's a sign that his body is slowing down, Dennis. And I want to walk you through what you're seeing, because it's scary when you don't know what it means. || E2
  Caller -> Okay.
  Nurse -> That wet, rattly sound is from the little bit of saliva at the back of his throat that he can't swallow anymore. It sounds a lot worse to us than it feels to him. It doesn't mean he's in pain, and it doesn't mean he's suffocating. || E2
  Caller -> Okay. Okay.
  Nurse -> The blotchy knees and the cold feet are because his blood flow is going to the most important organs. The dark urine, not much of it, that's the same thing. And not eating or drinking is his body telling us he doesn't need it anymore. || E2
  Caller -> Okay. I just. I don't want him to be, I don't want him to feel anything.
  Nurse -> I know. That's what we're here for. Does he look like he's in pain? Is he grimacing, moaning?
  Caller -> No. Not really. He just, he's just restless. He doesn't look like he's hurting. || A7
  Caller -> Dad, it's okay. It's okay, Dad. Sorry. He's trying to sit up.
  Nurse -> That's okay. You go ahead. I'm right here.
  Caller -> Okay. He's okay. He's back down.
  Caller -> Sorry. The dog is going crazy. Hang on. Bailey, no. Bailey, quiet. Sorry.
  Nurse -> It's fine. Dogs know when something's different. Is he settled for a second?
  Caller -> Yeah. Yeah, he's lying there. His eyes are kind of half open.
  Nurse -> That's okay. That's common too.
  Nurse -> Good. Dennis, let's take care of the restlessness first. It's been a few hours since the lorazepam, so you can give him another one. Same dose, the half a milligram under his tongue. Go ahead and do that right now. || R1
  Caller -> Okay. Hold on. Let me get it. Hold on.
  Nurse -> Take your time.
  Caller -> Okay. I'm. It's, okay, I got it. I'm putting it under his tongue. Okay. Done.
  Nurse -> Perfect. Now, for the wet sound, do you have a little bottle of drops? Atropine, with the blue cap? It should be in the comfort kit. || R2
  Caller -> The blue one? Yes. Yeah, I see it. The atropine. || R2
  Nurse -> Okay. Two drops under his tongue. You can repeat that every four hours if the sound is bothering him. || R2
  Caller -> Two drops. Every four hours. Okay. Do I do that now?
  Nurse -> Yes, do that now too. And then turn him onto his side, with the head of the bed raised, or a few pillows under his head. That helps the secretions drain. || R2, E1
  Caller -> Okay. Okay. On his side. I'll get my brother to help me, he's down the hall.
  Nurse -> That's good. And another thing, his mouth. Take one of the little pink sponge swabs, dip it in water, and wipe his mouth and lips every hour. Then put some lip balm on his lips so they don't crack. || E1
  Caller -> We, we have the lip balm. I don't think we have the swabs. I think we ran out.
  Nurse -> Okay. Then use a clean damp washcloth for now. I'll order more swabs for you. || R6, E1
  Caller -> Okay. A washcloth. Thank you.
  Nurse -> And you don't need to push food or drinks. If he's awake and he asks, you can give him an ice chip or a tiny sip. But don't force anything. || E3
  Caller -> Okay. That's. That's good. My sister keeps trying to get him to drink. She's got the, the little cup.
  Nurse -> It's okay to tell her. It comes from love, but it's not going to help him right now, and it could make him choke.
  Caller -> Yeah. Yeah, she's, honestly that's the other thing. That's what I wanted to say. || A10
  Nurse -> Mm-hm. Go ahead.
  Caller -> So my sister, Joanna, she wants to call 911. She wants to take him to the hospital. She keeps saying we're not doing enough. And my brother and I, we're saying no. Dad said no hospital. He said it. He said it a hundred times. || A10
  Nurse -> I understand. And I want you to know, your dad's wishes are written in his plan. He wants to stay home and be comfortable. You're doing exactly what he asked. || A10
  Caller -> I know. I know that. I just. She's. She's screaming at us. She's crying and she's.
  Nurse -> It sounds like everybody is hurting right now.
  Caller -> Yeah. Yeah, we are. Can somebody come? Can somebody come out here tonight? Please. I don't, I can't do this by myself. || F1
  Nurse -> Yes. Yes, Dennis. I'm sending our on-call nurse out to you. She'll be there within ninety minutes. She can check him, and she can sit down with your sister too. || R3
  Caller -> Ninety minutes. Okay. Okay. Thank you. Thank you so much.
  Nurse -> And I'm going to call you back in an hour, to see how he's doing after the medicine. || R4
  Caller -> Okay. In an hour.
  Nurse -> I'd also like our social worker to call your family tomorrow, and our chaplain, if you'd want that. It helps with the hard parts, like this. || R5
  Caller -> Yeah. I think, yeah. Joanna would probably, yeah. I'll tell her.
  Nurse -> Good. Dennis, if anything changes, if he's in pain, if his breathing gets hard, if you're just scared, call us. Any hour tonight. You don't have to wait for me to call you. || E4
  Caller -> Okay. Okay. I will.
  Nurse -> Is there anything else, before we hang up?
  Caller -> No. I think, um, no. That's it. Thank you, Carla.
  Nurse -> You're doing a good job, Dennis. Okay.
  Caller -> Okay.
