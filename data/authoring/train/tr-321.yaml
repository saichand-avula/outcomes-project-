transcript: |
  Nurse -> Riverside Home Health, this is Dante.
  Caller -> Hey. I'm a driver with Tri-County Freight. I got a delivery for you. A pallet. Office supplies. I'm outside and I can't find the dock.
  Nurse -> Okay. Where are you right now? On Mill Street?
  Caller -> I'm on Mill. In front of a brick building. There's a sign that says Riverside Medical Center.
  Nurse -> That's the building next door. We're the white building behind it, number two eighteen. You need to go around the back.
  Caller -> Around the back. How do I get around?
  Nurse -> Go past the medical center, take the first left, and then it's the second driveway on the right. There's a gray garage door.
  Caller -> Gray garage door. Okay. Is there a bell?
  Nurse -> There's a buzzer on the right side. Hit it and somebody will come. They'll sign for it.
  Caller -> Do you have a forklift or a pallet jack?
  Nurse -> I think we have a hand truck. Not a forklift. You might need to break the pallet down.
  Caller -> Ugh. It's about forty boxes. Printer paper, mostly. That's gonna take me twenty minutes.
  Nurse -> I'm sorry. The guy who handles receiving is Marcus. I'll tell him you're coming. He might have a cart.
  Caller -> That'd be great. What's the back door hours? In case I'm late.
  Nurse -> Eight to four. You're fine. It's one now.
  Caller -> Okay. Good. I'll be there in two minutes. Thanks, buddy.
  Nurse -> No problem. Look for the gray door.
  Caller -> Gray door. Got it. Bye.
  Nurse -> Bye.
