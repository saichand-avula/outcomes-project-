transcript: |
  Nurse -> Willow Creek Hospice, this is Gwen.
  Caller -> Hi, Gwen. It's Declan Fitzsimmons. My mother is Maude Fitzsimmons, she's on your service. My sister went home tonight, so it's just me, and I don't know what I'm doing. || caller_name, relationship, patient_name, cc, A10
  Nurse -> Okay, Declan. You called the right place. Let me start with your mom's date of birth.
  Caller -> February fourteenth. Nineteen thirty five. Valentine's Day. || patient_dob
  Nurse -> And is six oh three, five five five, zero one seven seven your number? || callback_phone
  Caller -> Yes. My cell. || callback_phone
  Nurse -> Okay. What's happening with Mom tonight?
  Caller -> She's restless. She keeps picking at the sheets. She was sleeping all day and now she's, I don't know, agitated. She's moving her legs. And when I try to turn her, she moans. || A1, A2
  Nurse -> Okay. Can she tell you if she's in pain?
  Caller -> No. She can't talk anymore. I guess it's a five? If I had to guess. That's just my guess, from her face. || A2
  Nurse -> That's a good guess. We read faces when people can't speak. Anything else?
  Caller -> Her breathing is starting to sound wet. A rattle. Not loud yet, but it's starting. || A3
  Nurse -> Okay. Does she feel warm?
  Caller -> A little. I took her temperature under the arm. One hundred point two. || A4
  Nurse -> Okay. Thank you. Declan, you have a comfort kit in the refrigerator. Have you opened it?
  Caller -> Yes. It's on the kitchen counter now. I took it out. There are a bunch of little bottles. And I don't know what any of them are for. I'm afraid to give her the wrong one.
  Nurse -> That's okay. We'll go through them one by one. I have her orders in front of me. Pick up the bottle that says morphine. || A5
  Caller -> Okay. Hold on. Here. It says morphine concentrate, twenty milligrams per milliliter. There's a little syringe with it. || A5
  Nurse -> Right. The order is point two five milliliters, which is five milligrams, under the tongue every two hours if needed, for pain or for labored breathing. That's the morphine concentrate. || A5, E1
  Caller -> Point two five. On the syringe it's the line, the first line. Okay. Every two hours.
  Nurse -> Yes. And Declan, can I ask what you're most worried about with that one?
  Caller -> That I'll give her too much. That it'll, you know. That I'll be the one who makes it happen. || A11
  Nurse -> I'm so glad you said that. The dose we gave you is a comfort dose. It is meant to treat pain and the struggle to breathe. Given as ordered, it eases her. It does not cause her to die sooner. Her illness is what's happening.
  Caller -> Okay. Okay. That's what I needed to hear. I think I've been carrying that all day.
  Nurse -> I know. You're doing exactly what she needs. So, for the moaning when you turn her, I'd give the morphine about twenty minutes before you turn her, and use pillows to turn her slowly. || E4, A5
  Caller -> Twenty minutes before. Pillows. Slowly. Okay. Should I give it now?
  Nurse -> Yes. She's moaning and restless, and it's been at least two hours since she's had anything, hasn't it?
  Caller -> My sister gave her the last dose at ten. It's two now.
  Nurse -> Perfect. Give point two five of the morphine under her tongue now. And write down the dose and the time every time. || A5, E1
  Caller -> Okay. I'm doing it. Mom. Mom, it's Declan. Under your tongue. Okay. Done. It's two fifteen. I'm writing it.
  Nurse -> Good. Tell her what you're doing as you go. Even when she can't answer, she hears you and it helps.
  Caller -> I do. I told her it's me, and that she's okay. She squeezed my hand a little. I think that was her. Or I hope so.
  Nurse -> I think so too.
  Nurse -> Good. Thank you. Now pick up the one that says lorazepam. || A6
  Caller -> Lorazepam. Okay. Point five milligrams, little tablets. || A6
  Nurse -> Right. Lorazepam point five milligrams, one tablet under the tongue every four hours if needed. That one is for anxiety or restlessness. If she's still picking at the sheets after the morphine has had time to work, you can give the lorazepam. || A1, A5, A6, E2
  Caller -> After the morphine. Not at the same time. Okay. || A5, A6
  Nurse -> You can give both. But give the morphine first and see how she settles. And don't give the lorazepam more often than every four hours. || A5, A6, E2
  Caller -> Four hours. Okay. I'll watch the clock. I set an alarm on my phone for the morphine. Two hours from now. Four for the other one. || A5
  Nurse -> That's a smart idea. Label the alarms so you don't mix them up at three in the morning.
  Caller -> Good point. Morphine, Mom one. Other, Mom two. || A5
  Nurse -> Now the little dropper bottle. It says atropine drops. || A7
  Caller -> Atropine drops. Here. || A7
  Nurse -> The order for the atropine drops is two drops under the tongue every four hours if needed, for the rattle. It dries up the secretions. || A7
  Caller -> Two drops. For the rattle. Her breathing isn't very loud yet. Do I give it now?
  Nurse -> Not yet. Wait until the rattle is clearly there and bothers her, or you. It's fine to hold off for now.
  Caller -> Okay. Hold off. I'll listen.
  Nurse -> Next. Haloperidol. It's a small bottle of tablets, point five milligram. || A8
  Caller -> Haloperidol. Yes. Tablets. It says point five. Every six hours, as needed. || A8
  Nurse -> Yes. Haloperidol, point five milligrams, every six hours if needed. That's for severe agitation or confusion, or nausea. Don't use it unless the lorazepam doesn't settle her. If that happens, call me first. || A6, A8
  Caller -> Call you first. Okay. I won't use it on my own.
  Nurse -> Right. And the last one, the acetaminophen suppositories, six fifty milligrams. || A9
  Caller -> Acetaminophen. A box of suppositories. Six fifty. || A9
  Nurse -> The acetaminophen suppository, six fifty milligrams every six hours if needed, is for the fever. Her temperature of one hundred point two is only slightly high. I wouldn't give it yet. If it goes above one oh one, or if she looks hot and uncomfortable, give one suppository, and don't repeat it for six hours. || A4, A9, E3
  Caller -> Over one oh one. One suppository. Not again for six hours. Okay.
  Nurse -> Perfect. That's all five. You've got it. Do you want me to repeat any of them?
  Caller -> Can you say it one more time quick? Which one is for pain?
  Nurse -> Morphine is for pain and for labored breathing. Lorazepam is for anxiety and restlessness. Atropine drops are for the rattle. Haloperidol is for severe agitation, call me first. Acetaminophen suppository is for fever. || A5, A6, A7, A8, A9
  Caller -> Okay. Morphine, pain and breathing. Lorazepam, restless. Atropine, rattle. Haloperidol, call you. Acetaminophen, fever. I wrote it on the back of an envelope. || A5, A6, A7, A8, A9
  Nurse -> That's perfect. Tape the envelope to the counter.
  Caller -> I will.
  Nurse -> I'm going to message her provider about the restlessness, the pain with turning, and the fever, so they know what's going on tonight. || R2
  Caller -> Okay. Thank you.
  Nurse -> And a nurse will come out tomorrow morning to see her and go over this with you again. || R1
  Caller -> Tomorrow morning. Okay. My sister will be back by then too, I think.
  Nurse -> Good. And I'll call you back at nine tonight to see how she's doing. || R3
  Caller -> At nine. Okay. I'll have the phone on.
  Nurse -> Declan, call me at any hour if you have questions or if she seems uncomfortable. You don't have to wait for nine. || E5
  Caller -> Any hour. Okay. Even three in the morning?
  Nurse -> Even three in the morning.
  Caller -> Okay. That's a relief. I was afraid I'd be bothering you.
  Nurse -> You will never be bothering us. This is exactly what we're here for.
  Caller -> Thank you. Thank you, Gwen. I think I can do this.
  Nurse -> You can. And you're already doing it.
  Caller -> I'm going to sit with her. I'll hold her hand. She's calmer already. Maybe it's just me being here.
  Nurse -> It's probably both. Talk to her. She knows your voice.
  Caller -> I will. Okay. Thank you again.
