transcript: |
  Nurse -> Little Oaks Pediatric Home Care, this is Priya.
  Caller -> Hi. Hi, Priya. This is Tobias Renner. I'm Willa's dad. Willa Renner. I think I did something wrong. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Tobias, I'm here. What's her date of birth?
  Caller -> September second, twenty twenty one. || patient_dob
  Nurse -> And is six oh two, five five five, zero one two eight still your number? || callback_phone
  Caller -> Yes. Yes it is. || callback_phone
  Nurse -> Okay. Tell me what happened.
  Caller -> So she had a fever earlier. Around dinner. And I gave her the ibuprofen. The children's. The, the liquid. Nine milliliters. And then my wife, she came home and she didn't know, and she gave her another nine. || A1, F1
  Nurse -> How far apart were those?
  Caller -> Twenty minutes? Maybe twenty. Like, twenty minutes. I just found out. I just saw the cup on the counter. || A1, F1
  Nurse -> Okay. Is she awake? How is she acting?
  Caller -> She's fine. She's, she's playing. She's right here, she's doing a puzzle. || A4
  Nurse -> Has she vomited? Any stomach pain?
  Caller -> No. No throwing up. She hasn't said her stomach hurts. || A2, A3
  Nurse -> Okay. What strength is the bottle? Can you read me the label?
  Caller -> Hundred milligrams. Per five milliliters. || A1
  Nurse -> Okay. That matches her order, nine milliliters is her dose. So she got two doses close together. I want you to call Poison Control right now. They're open all night, and they'll tell you exactly what to watch for. || R1
  Caller -> Okay. What's the number?
  Nurse -> One, eight hundred, two two two, one two two two. Call them first. Do you want to write that down?
  Caller -> Yeah. Yes. Hang on. One eight hundred, two two two, one two two two. Got it.
  Nurse -> Don't give her any more ibuprofen or any other fever medicine tonight, not until they or the doctor say so. || R1
  Caller -> No. No more. Okay.
  Nurse -> I'm also going to page our on-call pediatric nurse about this right now. || R2
  Caller -> Okay.
  Nurse -> And I'll call you back in fifteen minutes to see what Poison Control said. || R3
  Caller -> Okay. Fifteen minutes.
  Nurse -> If she gets very sleepy and hard to wake up, if she throws up blood, has any trouble breathing, or has a seizure, call 911 right away. || E1
  Caller -> Okay. Sleepy, blood, breathing, seizure. Okay.
  Nurse -> And once things settle down, put a sheet on the fridge, write every dose and the time, so you and your wife can both see what she's had. || E2
  Caller -> Yeah. We're going to. I feel awful.
  Nurse -> It happens a lot, Tobias. You caught it fast. Go call them now.
  Caller -> Okay. Thank you, Priya.
