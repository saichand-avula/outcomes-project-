transcript: |
  Nurse -> Aspen Grove Palliative Care, this is Naomi.
  Caller -> Hi, Naomi. It's Priya Raman. I'm a patient. The pharmacy gave me the wrong medicine. I took one. || caller_name, relationship, patient_name, cc, F1
  Nurse -> Okay, Priya. I'm here. Let me get your date of birth.
  Caller -> April twelfth. Nineteen eighty. || patient_dob
  Nurse -> And is five one oh, five five five, zero one six eight your number? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. Tell me what happened.
  Caller -> I picked up my refill yesterday. It's supposed to be Celexa. Twenty milligrams. For my mood. I took it this morning and then I looked at the bottle, and it says Celebrex. Two hundred milligrams. That's the arthritis one. I took a Celebrex. || A1, A2, F1
  Nurse -> Okay. Thank you for catching it. So you took one Celebrex two hundred this morning, instead of your Celexa.
  Caller -> Yes. And I haven't had my Celexa. I've missed it today. I've never missed it. || A1, A2
  Nurse -> Okay. How do you feel right now? Any stomach pain, nausea, anything unusual?
  Caller -> No. Nothing. I feel the same as always. My stomach is fine. || A3
  Nurse -> Okay. That's reassuring. I already called the pharmacy while you were telling me, and they're going to bring the right bottle. || R1
  Caller -> Oh. Good. They can bring it here? I'm not supposed to drive after the last treatment.
  Nurse -> They'll arrange it. I'm also going to message your provider about the mix-up. || R2
  Caller -> Okay. Thank you. What do I do until then?
  Nurse -> Please don't take any more Celebrex, and keep that bottle so you can show the pharmacist. And hold off on the Celexa until the right bottle comes. || E1, A1, A2
  Caller -> Hold the Celexa until the new bottle. Keep the Celebrex bottle. Okay.
  Nurse -> I'll call you back this afternoon. || R3
  Caller -> This afternoon. Okay.
  Nurse -> And call us if you get stomach pain, black stools, vomiting, or if your mood dips because of the missed Celexa. || E2
  Caller -> Stomach pain, black stool, vomiting, mood. Okay. I will.
  Nurse -> Anything else?
  Caller -> No. Thank you, Naomi. I was so upset when I saw the bottle. I thought I'd done something terrible.
  Nurse -> You didn't. You caught it. That's what matters.
