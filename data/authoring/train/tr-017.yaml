transcript: |
  Nurse -> Bluebell Home Care, this is Joanne.
  Caller -> Hi. I'm calling for my grandma. Her name is Henrietta Osei. O S E I. || patient_name, relationship
  Nurse -> Okay, Henrietta Osei. And her date of birth?
  Caller -> May fifth, nineteen forty one. || patient_dob
  Nurse -> Thank you. And who am I talking to?
  Caller -> I'm Imani. I'm her granddaughter. || caller_name, relationship
  Nurse -> Hi, Imani. A number for you?
  Caller -> Four oh four, five five five, zero one two seven. || callback_phone
  Nurse -> Got it. What's going on tonight?
  Caller -> So, my grandma won't settle down. She keeps getting up and down. Out of bed, back in, out of bed. Like, all night, the last week. || cc, A1
  Nurse -> Okay. Is she confused when she gets up?
  Caller -> A little. In the evening, mostly. She'll ask where her husband is. || A2
  Nurse -> Okay. And what does she take at night?
  Caller -> She takes the Sarah quill. At bedtime. || A3
  Nurse -> The what, sorry?
  Caller -> The, the Seroquil. Hang on, I'm going to look at the bottle. It's, it's S E R O Q U E L. || A3
  Nurse -> Seroquel. Okay, got it. Seroquel. And what's the dose? || A3
  Caller -> Twenty five milligrams. One little pill. || A3
  Nurse -> Okay. And does it seem to help?
  Caller -> Not really. Not much. It's like she's sleepy, but she won't lie down. || A3
  Nurse -> Okay. When do you give it?
  Caller -> It's different. Sometimes seven, sometimes nine. Whenever I remember. Or whoever's here.
  Nurse -> Okay. That could be part of it. I'd like her to get the Seroquel at the same time every night, around eight. Consistency matters for it to work. || R2
  Caller -> Okay. Eight o'clock. Every night.
  Nurse -> Right. And I'm going to send a message to her provider about the restlessness, since it's been a week. They may want to change something. || R1
  Caller -> Okay. Thank you.
  Nurse -> In the evening, keep the lights dim, keep a calm routine, and try to limit naps in the afternoon, and any caffeine. || E1
  Caller -> She does have coffee at like four.
  Nurse -> Let's make that decaf, if she'll go for it.
  Caller -> She won't know. Ha.
  Nurse -> Also, put a night light on, keep the path to the bathroom clear, and stay close by at night so she doesn't fall. || E2
  Caller -> Okay. I'm sleeping on the couch.
  Nurse -> Perfect. If she gets aggressive, or she starts seeing things that aren't there, or she falls, call us right away. || E3
  Caller -> Okay. I will.
  Nurse -> Anything else, Imani?
  Caller -> No. Thank you.
