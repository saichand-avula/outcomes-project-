  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Hi, Tom. It's Lucille Marchetti. I've had this cough for three days, and now it's yellow-green. I wanted to check in before it gets worse. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Hi, Lucille. You did the right thing calling. What's your date of birth?
  Caller -> February twelfth, nineteen sixty. || patient_dob
  Nurse -> And I have six one oh, five five five, zero one three eight for you. || callback_phone
  Caller -> Yes. That's the house. || callback_phone
  Nurse -> Okay. Tell me about the cough. What are you bringing up?
  Caller -> Yellow-green phlegm. A lot more than usual. Thick. It started clear on Sunday and it turned yesterday. || A1
  Nurse -> Okay. Do you have a fever? Have you taken your temperature?
  Caller -> I did, just now. Ninety nine point eight. So it's not much. But I feel hot and cold. || A2
  Nurse -> Okay. Any chest pain?
  Caller -> No. No chest pain. I'm not, I don't feel like I'm dying or anything. It's just a bad cold on top of the COPD. || A3
  Nurse -> Okay. And your breathing? Is it worse than your normal?
  Caller -> About the same. I'm using the oxygen like always. I'm a little more winded on the stairs, but I'm not out of breath sitting here. || A4
  Nurse -> Okay. That's good. I'm going to message your provider about the cough and the color change, because you might need to be checked for an infection. || R1
  Caller -> Oh. Do you think I need antibiotics?
  Nurse -> That's for the provider to decide. I'm also going to send a nurse out tomorrow morning to listen to your lungs and check your oxygen. || R2
  Caller -> Tomorrow morning. Good. I'll be up. I'm always up by six.
  Nurse -> In the meantime, drink plenty of fluids. Warm drinks and a humidifier can help loosen the phlegm. || E1
  Caller -> Fluids. Warm tea. Humidifier. I have one in the closet. I'll put it in the bedroom.
  Nurse -> And call us if the fever gets to a hundred and one or higher, if you see blood in the phlegm, or if your breathing gets worse. If you have severe trouble breathing or chest pain, call nine one one. || E2
  Caller -> A hundred and one. Blood. Worse breathing. Nine one one for the chest. Okay. I have it.
  Nurse -> Anything else, Lucille?
  Caller -> No. Just thank you for calling me back so fast. Last time I waited all day.
  Nurse -> I'm glad. Take care.
