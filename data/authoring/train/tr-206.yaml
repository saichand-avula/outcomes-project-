  Nurse -> Riverbend Hospice, this is Alan.
  Caller -> Hi, Alan. This is Halina Kowalczyk. It's my husband, Tomasz. He's been throwing up since this morning. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Halina, I'm sorry to hear that. Let me pull up Tomas Kovalchik. Can you give me his date of birth?
  Caller -> September thirtieth, nineteen sixty nine. || patient_dob
  Nurse -> And what's a good callback number?
  Caller -> Seven one three, five five five, oh one nine one. || callback_phone
  Nurse -> Okay, seven one three, five five five, oh one nine seven. || callback_phone
  Caller -> Okay. Yes.
  Nurse -> Now, how many times has Tomas thrown up?
  Caller -> Three times. Since about, uh, eight. The last one was maybe an hour ago. || A1
  Nurse -> Okay. Is there any blood in it? Anything dark, like coffee grounds?
  Caller -> No. No blood. It's mostly what he drank, and some yellow. || A2
  Nurse -> Okay. Has he had his nausea medicine today?
  Caller -> Yes. The Zofran. He took it at seven. Before the first time he threw up. So I don't know if it stayed down. || A3
  Nurse -> Okay. I'm going to send a message to the hospice provider about the vomiting. || R1
  Caller -> Okay. Good. Thank you.
  Nurse -> And I'll call you back in two hours to see how he's doing. || R2
  Caller -> Two hours. Okay.
  Nurse -> In the meantime, let his stomach rest. Offer him small sips of clear fluid or an ice chip every few minutes, and hold off on food until he's kept the fluids down. || E1
  Caller -> Sips. Ice chips. No food. Okay. He likes the ice chips.
  Nurse -> Good. If you see blood in it, if he gets bad belly pain, or if he can't keep even the sips down, call us right away. || E2
  Caller -> Blood, belly pain, can't keep the sips down. Okay. I'll call.
  Nurse -> Is there anything else, Halina?
  Caller -> No. Just that I hate to see him like this. He's been so tired.
  Nurse -> I know. We'll keep a close eye on him.
