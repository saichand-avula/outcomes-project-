blueprint: "A 49-year-old woman with metastatic breast cancer calls her palliative nurse late at night, calm but flat, saying she has been giving things away and 'taking care of business', that she is 'done fighting' and has 'been thinking of ending it' by taking her stockpile of pills, and that she has not told anyone. She is not sure she will but says the thought is there every night. Pain is a four, she is sleeping badly. She lives alone; her sister is 90 minutes away. The nurse stays calm, asks about plan, means and timing, hears that she has about forty pills saved and no set date, convinces her to let the nurse pages on-call, arranges for a nurse and social worker to come, asks her to give the pills to her neighbor or leave them outside the door, gives 988, keeps her on the line until a plan is made. Suicidal statement with plan and means, self caller aged 18-64, long v2."
