  Nurse -> The liquid. The twenty milligram per milliliter? || A1
  Caller -> Yes. That one. He gets the point two five. And I thought we had another bottle. I thought. We didn't. || A1
  Nurse -> Okay. How's his pain right now?
  Caller -> He says a seven. He's hurting. He's hurting in his belly. || A2, F2
  Nurse -> Okay.
  Caller -> And he can't lie still. He keeps moving. He's restless. || A3
  Nurse -> Okay, Constance. Here's what I've done. I already called the pharmacy, and they're sending a courier with a new bottle. It'll be at your door within the hour. || R1
  Caller -> Oh. Oh, thank God. Within the hour. Okay.
  Nurse -> I'm also going to page our on-call nurse, so somebody is looking at him. || R2
  Caller -> Okay. Thank you.
  Nurse -> Until the bottle gets there, go to the comfort kit, the box in the fridge. There's an acetaminophen suppository. Give him one now. It should take the edge off. || R3
  Caller -> The suppository. In the, okay. Let me. Hold on. I see it. The box. Okay.
  Nurse -> Take your time.
  Caller -> Okay. I'll give it now.
  Nurse -> And Constance, going forward, check the morphine every couple of days, and call us when you're down to one day left. Don't wait until it's empty. || E1
  Caller -> I know. I'm so sorry. I should have counted.
  Nurse -> It's okay. It happens. We'll get you a refill schedule. You're doing the best you can.
  Caller -> Thank you, Rhonda. Thank you.
