transcript: |
  Nurse -> Harbor Light Home Health, this is Hector.
  Caller -> Hector, it's Octavio Benavides. I'm a patient. I think I took the wrong pill this morning. || caller_name, relationship, patient_name, cc, F1
  Nurse -> Okay, Octavio. Let's sort it out. Date of birth first?
  Caller -> October nineteenth. Nineteen fifty one. || patient_dob
  Nurse -> And two one oh, five five five, zero one four four? || callback_phone
  Caller -> Yeah. That's the house. || callback_phone
  Nurse -> What happened with the pill?
  Caller -> I have two bottles that sound the same. Hydro-something. One is for my blood pressure and one is for itching. I took the one for itching. I think. Hydroxyzine. Yes. I took the hydroxyzine. Instead of the blood pressure one. || A1, F1
  Nurse -> Okay. Let me look at your chart. I see hydralazine, twenty five milligrams, three times a day, for blood pressure. And hydroxyzine, ten milligrams, at night, for itching. Is that right? || A1, A2
  Caller -> Yes. That's right. The hydralazine is for the pressure. And the hydroxyzine is at night. But this morning I grabbed the wrong bottle. I took the hydroxyzine. Ten milligrams. || A1, A2
  Nurse -> Okay. How are you feeling right now?
  Caller -> A little drowsy. But I'm awake. I'm talking to you. I'm okay. || A3
  Nurse -> Okay. Do you have your blood pressure?
  Caller -> I took it. One fifty over ninety. || A4
  Nurse -> Okay. Octavio, take your hydralazine now, the twenty five. Skip the hydroxyzine tonight. || A1, A2, R1
  Caller -> Hydralazine now. Skip the hydroxyzine tonight. Okay. Let me get the right bottle. Hold on. This one. It says hydralazine. Okay. I'm taking it. || A1, A2
  Nurse -> Good. I'll message your provider about the mix-up. || R2
  Caller -> Okay. Thank you. Will I be okay?
  Nurse -> I think so. It's a small dose. I'll call you back this afternoon to check on you. || R3
  Caller -> This afternoon. Okay.
  Nurse -> Until then, don't drive or use the stove while you're drowsy. Sit down before you stand up. And keep those two bottles in different places, so they don't get mixed up again. || E1, A1, A2
  Caller -> Different places. Okay. I'll put the hydroxyzine in the bedroom. The hydralazine stays in the kitchen. || A1, A2
  Nurse -> Perfect. And call us if you get very sleepy, confused, or your heart is pounding. If you can't stay awake, call nine one one. || E2
  Caller -> Okay. I understand. Thank you, Hector.
