transcript: |
  Nurse -> Lakeshore Home Health, this is Rhonda.
  Caller -> Rhonda, please help me. It's my husband. He can't breathe. This is Ngozi Okonkwo. || caller_name, relationship, cc, F1
  Nurse -> Okay, Nozzy. I'm here. Tell me what's happening.
  Caller -> It's Ngozi. N G O Z I. Please. It's my husband, Raymond Okonkwo. He can hardly breathe. || caller_name, patient_name
