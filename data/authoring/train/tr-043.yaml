  Nurse -> Okay. And your phone number, in case we get cut off?
  Caller -> Three oh two, five five five, zero one five six. || callback_phone
  Nurse -> Got it. Three oh two, five five five, zero one five six. || callback_phone
  Caller -> Yes. Yes.
  Nurse -> Alright. Tell me about his breathing. When did this start?
  Caller -> It's been getting worse since last night. But the last hour is so much worse. He's working so hard. His shoulders are going up and down. || A1, F1
  Nurse -> Okay. Is he able to talk to you?
  Caller -> Only a few words. He can't finish a sentence. He says a word, and then he has to stop. || A5
  Nurse -> Okay. What color are his lips?
  Caller -> They look blue. A little blue. Maybe purple. I noticed in the last hour. || A2, F1
  Nurse -> Okay. Does he have an oxygen meter?
  Caller -> Yes. The little one on his finger. It says eighty four. || A4, F1
  Nurse -> Okay. Eighty four. Is he wearing his oxygen?
  Caller -> Yes. The nose tube. At two liters. It's on. And he still is eighty four. || A4
  Nurse -> Okay. Has he used his nebulizer?
  Caller -> Yes. The albuterol. I gave him a treatment thirty minutes ago. || A3
  Nurse -> Okay. How much?
  Caller -> The two point five. In the machine. He's had one every two hours since last night. Like the doctor said, if he needs it. || A3
  Nurse -> And did it help?
  Caller -> A little. Just a little. It doesn't last. || A3
  Nurse -> Okay. Does he have chest pain?
  Caller -> No. He says no chest pain. It's just his breathing. || A6
  Nurse -> Okay. Is he coughing?
  Caller -> A lot. And more phlegm than usual. Yellow. Since yesterday. || A7
  Nurse -> Okay.
  Nurse -> He says he can't talk. He doesn't want to go to the hospital. || A8, label_error
  Caller -> Raymond, please. Shh. Don't try to talk. Rhonda, he says he hates the hospital. He says he's not going. || A8
  Nurse -> Okay. Ngozi, listen to me carefully. I understand that. But Raymond's oxygen is at eighty four, even with his oxygen on, his lips are blue, and he can't speak a full sentence. This is an emergency. I need you to call nine one one right now. || R1, F2
  Caller -> But he said no. He's so stubborn.
  Nurse -> I know. And this is your decision to make, along with him. But I would be doing you a disservice if I didn't tell you plainly: he needs to go. Now. Please call nine one one. || R1, F2
  Caller -> Okay. Okay. I'll call. I'll call them. Raymond, honey, I'm calling the ambulance. I know, I know.
  Nurse -> Ngozi, can you put me on speaker, and call nine one one on another phone? Or do you have a cell phone nearby?
  Caller -> I have my cell. Hang on. I'll put you down.
  Caller -> Okay. I'm calling. Hello? Yes, I need an ambulance. My husband can't breathe. Three twelve Maple Court. Yes. Yes. He has COPD. Okay.
  Caller -> They're sending someone. They said about eight minutes.
  Nurse -> Okay. Good. That's good. Now, while you wait. Is he sitting up?
  Caller -> He's in his chair. The recliner. But he's leaning back.
  Nurse -> Okay. I want him sitting upright, leaning forward a little, with his elbows on his knees or on a pillow on a table. That helps the breathing. || E2
  Caller -> Okay. Raymond, sit up. Lean forward. Here, put your arms on the pillow. There.
  Nurse -> Good. And coach him to breathe in slowly through his nose, and out slowly through pursed lips, like he's blowing out a candle. || E2
  Caller -> In through the nose. Out like a candle. Raymond, like this. Like this. Good.
  Nurse -> Keep his oxygen on. Don't take it off.
  Caller -> It's on. It's on.
  Nurse -> Okay. Is the front door unlocked? And can you turn on the porch light?
  Caller -> No, I'll do that. Wait. Okay. Unlocked. The light is on. || E1
  Nurse -> Good. Now, can you get his medication list, or the pill bottles, and put them in a bag for the paramedics? || E1
  Caller -> Yes. They're on the kitchen counter. I'll grab them. I have the list on the fridge.
  Nurse -> Perfect. And his inhaler and the nebulizer medicine, bring those too.
  Caller -> Okay. I'm getting a bag.
  Nurse -> I'll stay on the line. Take your time.
  Caller -> Okay. Okay. I have it. It's all in the bag.
  Nurse -> Is anyone else with you in the house?
  Caller -> No, it's just us. Our son lives in Houston. I'll call him once we're in the ambulance.
  Nurse -> That sounds like a good plan.
  Caller -> He's going to be upset that I didn't call him sooner. He always says, Mom, call me first.
  Nurse -> You called for help, and that's what matters.
  Caller -> I know. I keep thinking, did I wait too long? Last night I thought it would pass.
  Nurse -> You didn't wait too long. You're calling now, and help is on the way.
  Caller -> He had pneumonia last winter. Two weeks in the hospital. He hated every minute.
  Nurse -> That's probably why he's reluctant. It's understandable.
  Caller -> He said, never again. But this is different. I can see it's different.
  Nurse -> It is different. You're right to push.
  Caller -> He's trying to say something. He says, tell her I'm sorry for being difficult.
  Nurse -> Tell him there's nothing to be sorry for. We just want him to breathe easier.
  Caller -> I told him. He nodded.
  Nurse -> Ngozi, while we wait, can you tell me how long you two have been married?
  Caller -> Fifty one years in June. We met in Lagos, in nineteen seventy four. He was a young engineer, and I was a student nurse.
  Nurse -> A student nurse! So you know your way around this.
  Caller -> A little. But not when it's my own husband. Then I just panic.
  Nurse -> That's completely normal. Everybody does. You're doing great.
  Caller -> Thank you. He's gripping my hand. He's squeezing really hard.
  Nurse -> That's okay. Let him. It helps him feel safe.
  Caller -> I know. I'm not going anywhere. Is it okay if I hum to him? He likes it when I hum.
  Nurse -> Of course. Whatever calms him down.
  Caller -> It's an old song from home. He used to sing it to our babies.
  Nurse -> That sounds lovely. Go ahead.
  Nurse -> Good. Don't drive him yourself. Let the paramedics take him. And don't leave him alone. || E3
  Caller -> I won't. I'll go with him in the ambulance.
  Nurse -> That's good. They'll let you ride along. I'm going to call the hospital's emergency room now, and tell them he's coming, and what's going on. || R2
  Caller -> Oh, thank you. Thank you so much.
  Nurse -> Which hospital do they usually take you to?
  Caller -> St. Mary's. That's the closest.
  Nurse -> Okay. I'll call St. Mary's.
  Caller -> Raymond, how are you doing? He's a little pinker. Maybe. I think. Maybe it's the sitting up.
  Nurse -> That can help. But he still needs to be seen. Keep him calm. Keep talking to him.
  Caller -> I'm talking. I'm talking. I'm telling him it's okay. That we're going to the hospital just to get his breathing straight.
  Nurse -> That's good. That's exactly right. Ngozi, how are you holding up?
  Caller -> I'm shaking. I'm so scared. This is the third time this year.
  Nurse -> I know. It's scary. You're doing everything right. You called, you got the ambulance, you're keeping him calm.
  Caller -> Thank you. I'm so glad I called you.
  Nurse -> Me too. I'll call you tomorrow, later in the morning, to see how he's doing. || R3
  Caller -> Okay. Thank you. Oh, I hear the siren. I hear it.
  Nurse -> Good. That's them. Open the door, and let them in. Go ahead. I'll let you go.
  Caller -> Okay. Thank you, Rhonda. Thank you. Bye.
  Nurse -> Bye, Ngozi. Take care of yourself.
