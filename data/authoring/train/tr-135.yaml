transcript: |
  Nurse -> Aspen Grove Palliative Care, this is Naomi.
  Caller -> Hi, Naomi. It's Gianna Santoro. I'm calling about my mom. Imelda Santoro. She's been throwing up. || caller_name, relationship, patient_name, cc, A2
  Nurse -> Oh no. Okay, Gianna. I'm here. What's your mom's date of birth?
  Caller -> January twenty fourth. Nineteen fifty. || patient_dob
  Nurse -> And is six one oh, five five five, zero one seven seven a good number for you? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. Tell me what's been happening.
  Caller -> She's been nauseous for two days. Really queasy. And yesterday she threw up twice. Once in the morning and once in the evening. || A1, A2
  Nurse -> Okay. Has she vomited today?
  Caller -> Not today. Not yet. But she says she feels like she's going to. All the time. She just lies there with her eyes closed. || A1
  Nurse -> Okay. Does she have anything for nausea?
  Caller -> Yes, the ondansetron. The little melt-in-your-mouth ones. Four milligrams. She can have one every eight hours if she needs it. || A3
  Nurse -> Okay. When did she last take the ondansetron? || A3
  Caller -> This morning. About eight. It helps a little. It takes the edge off for a few hours, but it doesn't make it go away. || A3
  Nurse -> Okay. Is she eating anything?
  Caller -> A few bites. That's it. A bite of toast, a couple of crackers. Nothing else. She says the smell of food makes it worse. || A4
  Nurse -> Okay. And how about drinking?
  Caller -> Sips. Very small. I keep offering water and she keeps pushing it away. And her urine is dark. Dark yellow, almost brown. || A5
  Nurse -> Okay. Any fever?
  Caller -> No. I checked this morning. She was normal. || A6
  Nurse -> Any belly pain, or cramping?
  Caller -> No. No pain in her belly. She says it's just the nausea. || A7
  Nurse -> Okay. Gianna, did anything change with her medicines recently?
  Caller -> Well. Yes. She started the patch last Thursday. The fentanyl patch. The twelve one. For her back. We put one on and it's supposed to last three days. || A8
  Nurse -> Okay. So the fentanyl patch, twelve micrograms an hour, changed every seventy two hours. That's useful to know, because nausea can be a side effect when we start one. || A8
  Caller -> Oh. I didn't think of that. She's been on the other pain medicine for months and never got sick. I thought it was a stomach bug. Her neighbor's grandson had one.
  Nurse -> It could be. I can't say for sure. I'll message her palliative provider about the nausea and the patch together. || R1
  Caller -> Okay. Please. I just want her to stop feeling sick.
  Nurse -> I know. I'll call you back this afternoon after I hear from the provider. || R2
  Caller -> This afternoon. Okay. I'll be here. I'm working from home today so I'm right next to her.
  Nurse -> That's good. And a nurse will come see her tomorrow. || R3
  Caller -> Tomorrow. Okay. What time, do you know?
  Nurse -> The scheduler will call you with a time window. Is that okay?
  Caller -> Yes. That's fine. Thank you.
  Nurse -> Now, in the meantime, offer very small amounts of fluid. A sip, or an ice chip, or a bite of a popsicle every few minutes. Crackers or dry toast if she wants something. || E1
  Caller -> Ice chips. Popsicles. She might like that. She likes the orange ones.
  Nurse -> Orange is a good choice. Cold things often go down easier than warm ones when she's queasy.
  Caller -> That makes sense. She won't touch her tea anymore. She used to have it with honey, three times a day. Now she says the smell turns her stomach.
  Nurse -> That's very common. Smells can be the worst part. If you can, keep cooking smells away from her room, and maybe let the food cool down before you bring it in.
  Caller -> Okay. I made soup yesterday and the whole house smelled. I think that didn't help. I'll stop. I'll just do cold things.
  Nurse -> Perfect. And keep the room cool with a little fresh air, a cool cloth on her forehead, and keep her head raised after she drinks. || E2
  Caller -> Cool cloth. Head up. Okay. I'll open the window.
  Nurse -> And Gianna, take care of yourself too. Are you eating, are you sleeping a little?
  Caller -> Sort of. I keep waking up to check on her. My brother lives in Phoenix so it's mostly me. It's fine. I just worry.
  Nurse -> It's a lot to carry. You're allowed to call us just to ask a question, you don't need a crisis to call.
  Caller -> Thank you. That really helps. I always feel like I'm bothering somebody.
  Nurse -> Good. Gianna, I want you to call us if she can't keep any fluids down for twelve hours, if she hasn't passed urine in eight hours, if she gets belly pain, or if she seems confused. || E3
  Caller -> Twelve hours. Eight hours. Belly pain. Confused. Okay. I'm writing it on a sticky note.
  Nurse -> Perfect. Anything else I can help you with?
  Caller -> No. I don't think so. Thank you, Naomi. It helps just to talk to someone.
  Nurse -> Of course. Hang in there. We'll talk this afternoon.
  Caller -> Okay. Bye.
