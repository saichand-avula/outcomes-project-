  Nurse -> They do. In the meantime, you can put a chime or a bell on the door too. And a night light on the path to the bathroom, so she's less confused in the dark. || E1
  Caller -> A night light. Okay.
  Nurse -> And if you can, put a lock or a latch high up on the front door, above her eye level. A lot of people with dementia don't look up. || E1
  Caller -> Oh. That's smart. I have a slide bolt. I'll put it up top.
  Nurse -> Good. And Dwight, call us any time. Even if it's two in the morning and you just need to talk. || E2
  Caller -> I might. Thank you. Thank you, Joanne.
  Nurse -> Take care of yourself.
  Caller -> I'll try.
