transcript: |
  Nurse -> Aspen Hollow Hospice, this is Renata.
  Caller -> Hi there. This is Greg from Riverside Pharmacy. I'm calling to confirm your account for the new e-prescribing system. Who handles that?
  Nurse -> That would be our pharmacy liaison. Her name is Janelle. I can give you her direct line.
  Caller -> That'd be great. Is she in?
  Nurse -> She's out until Wednesday. She's at a conference.
  Caller -> Oh. Okay. Can I leave a message?
  Nurse -> Sure. What's your message?
  Caller -> Just that Riverside is migrating accounts on the first of the month. And we need a confirmation of the fax number and the prescriber list. If she could call me back or email me.
  Nurse -> Okay. Do you have a number for her to call?
  Caller -> Yeah. It's eight hundred, five five five, oh one three three. Extension four one.
  Nurse -> Eight hundred, five five five, zero one three three, extension forty one. Got it.
  Caller -> That's right. And my email is on the, I'll send it. I'll email her directly. Do you have her email?
  Nurse -> I'm not allowed to give out emails over the phone. But if you send it to the general pharmacy inbox, it goes to her.
  Caller -> Okay. That's fine. What is the inbox?
  Nurse -> It's pharmacy at aspenhollowhospice dot org.
  Caller -> Pharmacy at aspen hollow hospice dot org. Got it. Thanks.
  Nurse -> No problem. I'll let her know when she's back.
  Caller -> Appreciate it. Is it nice up there? I've never been to your area.
  Nurse -> It's lovely this time of year. Leaves are turning.
  Caller -> I bet. I'm stuck in a basement office. I don't see sunlight till five.
  Nurse -> Ha. Take a lunch walk.
  Caller -> I should. Okay. Thanks, Renata. Have a good one.
  Nurse -> You too.
