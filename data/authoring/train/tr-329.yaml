blueprint: "Evening call from a daughter at the bedside of her 84-year-old father, a hospice patient with dementia and cancer who has declined over a week. Since afternoon he has been thrashing, pulling at the sheets, moaning and grimacing; lorazepam 0.5 mg at two and again at six has not settled him; no urine since the morning and his breathing has long pauses. She is frightened and holds the phone while talking to him. The nurse pages on-call, sends a nurse within the hour, has her give the haloperidol from the comfort kit (a quarter mL of the 2 mg per mL), coaches repositioning and calm, explains what may be happening gently, and calls back in thirty minutes. Uncontrolled symptom flag, adult child caller, long v2."
