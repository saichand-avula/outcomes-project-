  Nurse -> Linden Park Home Health, this is Mei.
  Caller -> Hi, Mei. Can you hear me? It's Genevieve Thibodeaux. I'm calling about my husband. Maurice Thibodeaux. T H I B O D E A U X. || caller_name, patient_name, relationship
  Nurse -> Barely. Is there a better spot in the house?
