transcript: |
  Nurse -> Meadowbrook Home Care, this is Samantha.
  Caller -> Hi, Samantha. This is Pearl Gutierrez. I'm one of your patients. I started a new pill and I think it's making me dizzy. || caller_name, relationship, patient_name, cc
  Nurse -> Hi, Pearl. Let me get your date of birth.
  Caller -> August eighth. Nineteen fifty three. || patient_dob
  Nurse -> And is nine seven two, five five five, zero one four one your number? || callback_phone
  Caller -> Yes. The cell. || callback_phone
  Nurse -> Okay. What's the pill?
  Caller -> Gabapentin. Three hundred milligrams. Three times a day. For the burning in my feet. I started it Friday, so four days. || A1
  Nurse -> Okay. When did you last take it?
  Caller -> This morning. About nine. I'm due for the noon one but I haven't taken it yet. I wanted to call first. || A1
  Nurse -> That's a good instinct. Tell me about the dizziness.
  Caller -> It's like the room tilts a little when I stand up. Or sometimes just sitting. It started the day after I started the pill. Not terrible. But it's every day. || A2
  Nurse -> Okay. Are you eating and drinking normally?
  Caller -> Yes. I eat well. I might be drinking a bit less, I forget, because I'm so sleepy. I'll make an effort.
  Nurse -> Good idea. Water helps with the dizziness too. And are you sleepy?
  Caller -> Very. I fell asleep in my chair at ten in the morning. I never do that. And I fell asleep in the middle of my show last night, and I was awake all night after. || A3
  Nurse -> Okay. How about the foot pain? Is the gabapentin helping? || A1
  Caller -> It is. That's the thing. It was an eight, and now it's about a four. The burning isn't as bad. I'd hate to lose that. But I'm scared with the dizziness. || A4
  Nurse -> That makes sense. Have you fallen?
  Caller -> No. But yesterday I stumbled in the kitchen. I grabbed the counter. I didn't fall. I didn't hit anything. Nothing hurts. || A5, A6
  Nurse -> Okay. Thank you for telling me. I'm glad you didn't get hurt. Is there a rug or anything in the kitchen that you might have caught your foot on?
  Caller -> A throw rug by the sink. It slides. My daughter said to take it up. I keep forgetting. I'll pull it up right now, after I hang up.
  Nurse -> That's a great idea. Pearl, I'm going to message your provider about the dizziness and sleepiness on the gabapentin. || R1
  Caller -> Okay. Thank you. Will they take me off it?
  Nurse -> I can't say. It might be that the dose needs to change, or the timing. They'll decide. I'll call you back tomorrow to tell you what they say. || R2
  Caller -> Tomorrow. Okay. What should I do about the noon pill?
  Nurse -> Don't stop the gabapentin on your own, and don't take extra. Stopping suddenly can cause problems. Take the noon dose as prescribed, with a little snack, and sit down for a while afterward. || E2, A1
  Caller -> Take it with a snack. Sit down after. Okay. So I shouldn't skip the noon one. I was going to skip it.
  Nurse -> Please don't skip it. If you're so dizzy you can't stand, call me instead of deciding on your own. || A1
  Caller -> Okay. I'll call you. I have a cracker and some peanut butter. That's a snack.
  Nurse -> In the meantime, use your walker for everything, even short trips. Stand up slowly, sit on the edge of the bed or chair for a moment first, and please don't drive. || E1
  Caller -> I don't drive anymore. My daughter takes me. But yes, walker, slow, sit first. I've been using the cane, I'll switch to the walker. It's steadier.
  Nurse -> That's a good idea. And call us if you fall, faint, get confused, or are too sleepy to stay awake. If you fall and hit your head, call nine one one. || E3
  Caller -> Fall, faint, confused, too sleepy. Head, nine one one. Okay.
  Nurse -> Does anything else bother you with the pill, like an upset stomach, or swelling in your ankles?
  Caller -> No. Nothing like that. My ankles are the same. Just the dizzy and the sleepy. And maybe my mouth is a little dry.
  Nurse -> A dry mouth can go with it. Sips of water or sugar free candy help. Anything else?
  Caller -> My daughter wants to know if this is normal. Is it?
  Nurse -> Dizziness and sleepiness are common with gabapentin, especially in the first week. It isn't unusual. It just needs to be managed. || A1
  Caller -> That's good to hear. I told her. She worries.
  Nurse -> That's what daughters do. Does she live nearby?
  Caller -> Ten minutes away. She comes every day after work. She brings me soup. She's a good girl. She's fifty one.
  Nurse -> Ha. Still a girl. Please let her know I said hello, and that she's welcome to call me too.
  Caller -> I will. She likes you. She says you have a nice voice. She says the other agency never called back and you always do.
  Nurse -> Thank you. That's kind. I'll talk to you by two.
  Caller -> Thank you, Samantha.
