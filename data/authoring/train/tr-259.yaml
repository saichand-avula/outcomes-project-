  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Tom, it's Walter Penhaligon. My wife has a nosebleed and it won't stop. It's been forty minutes. || caller_name, relationship, cc, A1, F1
  Nurse -> Okay, Walter. I'm here. What's her name?
