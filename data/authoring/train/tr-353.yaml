transcript: |
  Nurse -> Oakhaven Home Health, this is Priscilla.
  Caller -> Hi, yes, this is Karin Brandvold. I'm calling about my dad, Walter Brandvold. I think the pharmacy made a mistake. || caller_name, patient_name, relationship
  Nurse -> Hi Karin. Okay. Let's look at it together. Can I get Walter's date of birth first?
  Caller -> August fourth, nineteen forty three. || patient_dob
  Nurse -> Thank you. And the best number for you?
  Caller -> Three one four, five five five, zero one five three. || callback_phone
  Nurse -> Three one four, five five five, zero one five three. Did I get that right? || callback_phone
  Caller -> Yes. That's the cell.
  Nurse -> Okay. Tell me what happened.
  Caller -> So, um. Dad takes a blood pressure pill. He's supposed to. And I was, I was setting up his pill box last night and I looked at the new bottle. And it says hydroxyzine. But his list from the doctor says hydralazine. They look the same, almost. || cc, A1, A2
  Nurse -> Okay. They do look alike. Read me the whole label, if you can. Slowly.
  Caller -> H Y D R O X Y Z I N E. Twenty five milligrams. One tablet three times a day. It says, take with food. The pharmacy sticker is, it's from the new place. The one by the grocery store. || A1
  Nurse -> Okay. Hydroxyzine twenty five milligrams, three times a day. And what does his list say? || A1
  Caller -> The list says hydralazine. H Y D R A L A Z I N E. Twenty five milligrams. Three times a day. So same dose, same schedule, different word. || A2
  Nurse -> Okay. Thank you. That's what the doctor ordered, hydralazine. For the pressure. Hydroxyzine is a different medicine, an antihistamine, for itching or anxiety. || A2
  Caller -> Oh no. Oh no. That's what I was afraid of.
  Nurse -> Okay. Stay with me. How long has he been taking the new bottle?
  Caller -> Since Saturday. So, three days. I picked it up Friday. Before that he had the old bottle, the right one, but it ran out. So three days of the new one. || A1, F1
  Nurse -> And when did he last take one?
  Caller -> This morning. At eight. With his oatmeal. Eight o'clock. || A1
  Nurse -> Okay. Has anything seemed different with him these three days?
  Caller -> He's been sleepy. A lot. He sleeps in the chair all afternoon. And his mouth is dry. He keeps asking for water. I thought it was the weather. || A4
  Nurse -> That fits with hydroxyzine. Did you take his blood pressure? || A1
  Caller -> I did this morning. One sixty eight over ninety two. That's higher than usual. Usually it's one thirty something. || A3
  Nurse -> Okay. That makes sense too, since he hasn't had the right medicine. Any chest pain, any falls?
  Caller -> No chest pain. No falls. He's been steady, just slow. He's not complaining of anything. || A5
  Nurse -> Good. Is he awake now?
  Caller -> He's right here. He's watching the game show. He's awake. He just yelled an answer at the TV.
  Nurse -> Ha. Okay. Good. I'd like to tell you what to do now.
  Caller -> Okay. Please.
  Nurse -> Don't give him any more of the hydroxyzine. Not the afternoon dose, not tonight. And keep the bottle, don't throw it out. We'll need the label. || R1
  Caller -> Don't give any more. Keep the bottle. Okay. I'll put it in a bag.
  Nurse -> Good. I'm paging the on-call clinician right now, because he's been on the wrong medicine and his pressure is up. The clinician will tell us what to do about the blood pressure medicine. || R2
  Caller -> Okay. Should I give him the old one? The hydralazine? I don't have any left. || A2
  Nurse -> No. Don't give him anything else for now. Wait for the clinician. I'll also be calling the pharmacy to straighten this out and get the right bottle. || R3
  Caller -> Thank you. I was so upset last night. I almost called at ten.
  Nurse -> Ten last night? You could have called the after hours line. It's always open.
  Caller -> I didn't want to bother anyone. I figured I'd wait until morning.
  Nurse -> It's never a bother. Next time, call.
  Caller -> Okay. I will.
  Nurse -> I'm glad you caught it. It's a very common mix up. They look so similar on paper.
  Caller -> I only caught it because Dad's list is taped to the fridge. I read it every time.
  Nurse -> That's a good habit.
  Caller -> My mom started it. She made the list ten years ago.
  Nurse -> It's saving you now.
  Caller -> I know.
  Nurse -> I'm also going to send someone out this afternoon, to check his pressure and see how sleepy he is. || R4
  Caller -> This afternoon. Okay. I'll be here. I work from home on Tuesdays.
  Nurse -> Great. Until then, keep him seated or lying down, help him up slowly, and stay with him when he walks. He may be unsteady because of the sleepiness. || E1
  Caller -> Slowly. Stay with him. Okay.
  Nurse -> And call us right away, or 911, if he has chest pain, trouble breathing, a really bad headache, confusion, or if he gets hard to wake up. || E2
  Caller -> Chest pain, breathing, headache, confusion, hard to wake. Okay. Okay. I'm writing it on my hand. I don't have paper.
  Caller -> I have a pen. Hold on. I'm writing on my hand. Okay.
  Nurse -> Ha. That works.
  Caller -> My handwriting on my hand is terrible.
  Nurse -> As long as you can read it.
  Caller -> Can he eat lunch?
  Nurse -> Yes. Lunch is fine. Plenty of water too, since his mouth is dry.
  Caller -> Okay. I'll make him a sandwich.
  Nurse -> Is he eating okay, other than the dry mouth?
  Caller -> He ate his oatmeal. Half of it. He's a slow eater these days.
  Nurse -> And Karin, you did the right thing calling.
  Caller -> Thank you. I feel better. I was kicking myself.
  Nurse -> Don't. The pharmacy is the one who should feel bad.
  Caller -> Ha. I'm going to have words with them.
  Nurse -> I'll have words first. I'll keep you posted.
  Caller -> Thank you. Thank you so much.
  Nurse -> Bye now.
  Caller -> Bye.
