  Nurse -> Okay. Has he fallen?
  Caller -> No. No, no. He's been in his chair. || A4
  Nurse -> Good. What medicines does he take for the Parkinson's?
  Caller -> The, um. The cinnamet. I think it's cinnamet? || A1
  Nurse -> Let me look at his chart. I see Sinemet. Twenty five, one hundred, one tablet, three times a day. Is that the one you mean? || A1
  Caller -> Yes! Yes, that's it. Sinemet. That's what it says on the bottle. || A1
  Nurse -> Okay. When was his last dose?
  Caller -> The morning one, I gave him that at eight. But the lunchtime one, I. I'm not sure. I was on the phone with my sister and I, I can't remember if I gave it to him. || A1
  Nurse -> Okay. Look at the pill box. Is the midday slot empty?
  Caller -> Hold on. It's, no. It's still there. It's still in there. I didn't give it. Oh. Oh no. It's almost three. || A1
  Nurse -> Okay, it's okay, Joyce. That explains a lot. Give him the midday dose right now, with a few sips of water, and then go back to the regular schedule. || R1
  Caller -> Okay. Now. Okay. Giving it now.
  Nurse -> And I'll message his prescriber about today, and what we should do with the evening dose. || R2
  Caller -> Okay.
  Nurse -> I'll also send a nurse tomorrow to see him. || R3
  Caller -> Tomorrow. Okay. Good.
  Nurse -> Stay with him when he stands up or walks around, and make sure he uses the walker. He's more unsteady when he's stiff. || E1
  Caller -> I'll stay right here. I'm not going anywhere.
  Nurse -> And for the next few days, it would help to put a little chart on the fridge. Write the time every time he takes a dose. || E2
  Caller -> I'll do that. I'll do that today. I feel terrible.
  Nurse -> Don't. You caught it. That's what matters.
  Caller -> Thank you, Carla.
