  Nurse -> That's fine. We'll come to you.
  Caller -> I go to the store. He stays.
  Nurse -> Perfect. I'll also send the team a message about the weight gain and the swelling. || R2
  Caller -> I'll send a message to the team about the weight gain and the swelling. Okay. Thank you. || R2, label_error
  Nurse -> Marguerite, can you write this down? Weigh him every morning after he uses the bathroom and before breakfast. Same scale. Write it down. And keep his feet up when he sits. || E1
  Caller -> Every morning. After the bathroom. Before breakfast. Write it. Feet up. Okay. We have a notebook.
