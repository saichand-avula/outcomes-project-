blueprint: "A 58-year-old man calls home health from his sister's phone: last night he took a leftover tramadol 50 mg at ten instead of his usual trazodone 50 mg at bedtime, after grabbing the wrong bottle in the dark. He slept badly, is dizzy and a little nauseated this morning, not confused, no tremor or seizure. He does not know his own number by heart because he is on his sister's phone and says to use the one on file. The nurse asks about the symptoms, messages the provider, tells him not to take any tramadol and to take the trazodone as prescribed tonight unless told otherwise, and plans a callback this afternoon. Wrong medication (look-alike pair), phone not given, self caller aged 18-64, v2 short."
