transcript: |
  Nurse -> Cottonwood Home Health, this is Ruth.
  Caller -> Hi, Ruth. It's Leland Ashworth. I'm calling about the pills. I messed up last night. I took the wrong one. I took the tramadol instead of the sleeping pill. || caller_name, patient_name, cc, A1, F1
  Nurse -> Okay. Take your time. Are you somewhere safe right now?
  Caller -> I'm at my sister's, sitting on her couch. She's making tea. She's fine. She says I'm being dramatic.
  Nurse -> Hi, Leland. I'm glad you called. Let me find your chart. What's your date of birth?
  Caller -> March twenty fourth. Nineteen sixty eight. || patient_dob
  Nurse -> Got it. And a number to reach you?
  Caller -> Oh, I'm on my sister's phone. I don't have mine. It's dead and the charger is at my house. I don't know my own number by heart. Can you use the one in the file?
  Nurse -> Sure. I have one on file. I'll use that.
  Caller -> Great. Thanks.
  Nurse -> What's the name of the surgery you had? Just so I know the context.
  Caller -> A hernia repair. Six weeks ago. I'm doing well. I only needed the tramadol for the first couple weeks. || A1
  Nurse -> Okay. Good. Healing well.
  Nurse -> Okay. Tell me what happened last night.
  Caller -> I took the pill in the dark. I didn't turn on the light because I didn't want to wake my sister. She's staying with me. I reached into the drawer and I grabbed a bottle. And I thought it was the trazodone. And it was the tramadol. I looked at it this morning and it was the wrong bottle. The tramadol is left over from my surgery. I'm not supposed to take it anymore. || A1
  Nurse -> Okay. And you took one fifty-milligram tablet?
  Caller -> One. Fifty milligrams. At about ten. I just took one. I'd like to say that. Just one. I'm not trying to hurt myself. I want to be clear. It was a mistake. I didn't know. || A1
  Nurse -> I understand. I'm glad you said it. Thank you for being clear.
  Caller -> I just didn't want you to think that. It's not that.
  Nurse -> I don't. I believe you.
  Nurse -> I appreciate you telling me. I believe you. And your usual bedtime pill is the trazodone, fifty milligrams? || A2
  Caller -> Yes. Trazodone. Fifty. At bedtime. For sleep. I didn't take it. So I missed my sleeping pill. || A2
  Nurse -> Okay. How did you sleep?
  Caller -> Terrible. I tossed and turned. I woke up four, five times. I was hot. I couldn't get comfortable. I'm wiped out today. || A4
  Nurse -> Did you take anything else for sleep, like an over-the-counter sleep aid?
  Caller -> No. Nothing else. I just lay there.
  Nurse -> Okay. That helps me know.
  Nurse -> Okay. How are you feeling right now?
  Caller -> Dizzy. When I stand up. And a little queasy. Not throwing up. Just a mild nausea. It started this morning when I got up. I had some toast and it stayed down. || A3
  Nurse -> Okay. Dizzy on standing and mild nausea. Are you confused at all? Any shaking, jerking, anything like a seizure?
  Caller -> No. No. Nothing like that. I'm clear. I know where I am. I know what day it is. No shakes. No jerking. I don't have a history of seizures. I'm just tired and dizzy. || A5
  Nurse -> Do you have anyone with you today?
  Caller -> My sister. She took the week off. She's been great. She makes me eat vegetables.
  Nurse -> Ha. Good sister.
  Nurse -> Have you eaten and had fluids today?
  Caller -> Toast and coffee. Some water. I've been drinking. I'll eat more at lunch.
  Nurse -> Good. Keep drinking water.
  Nurse -> Good. Is your heart racing? Are you sweating, agitated?
  Caller -> No. My heart's normal. I took my pulse. Seventy something. I'm not sweaty. I'm just tired.
  Nurse -> Okay. That's all reassuring. Leland, I'm going to message your provider today about the mix-up. They'll decide if there's anything to do. || R1
  Caller -> Okay. Good. Should I take the trazodone tonight? || A2
  Nurse -> Yes, unless the provider says otherwise. Take your usual trazodone fifty at bedtime. And do not take any more tramadol. Not tonight, not any other night, until the provider tells you. || R2
  Caller -> No tramadol. Trazodone tonight. Okay. || A1, A2
  Nurse -> And I'll call you this afternoon, on the number on file, to let you know what the provider says. || R3
  Caller -> This afternoon. I'll be at my sister's. I'll have her phone. I'll charge mine too.
  Nurse -> If you miss my call, I'll leave a message and try again.
  Caller -> Okay. Her ringer is loud. I'll hear it.
  Nurse -> Good idea. Now let's make it safer. Put the old tramadol in a bag and get it away from your bedside pills. Keep the trazodone right by the bed with a light on. And read each label before you take anything at night. || E1
  Caller -> Away from the bed. Light on. Read the label. I'll take the tramadol to the pharmacy to throw away. I don't need it. || A1
  Nurse -> Good. Many pharmacies take back unused medicines.
  Caller -> Yes. The one on Elm has a box. I'll drop it this afternoon.
  Nurse -> That's a good plan. Also, call nine one one for a seizure, a fast heartbeat with agitation, severe confusion or trouble breathing. And call us if the dizziness gets worse or you start vomiting. || E2
  Caller -> Seizure, fast heartbeat, confused, breathing, nine one one. Dizzy worse or vomiting, call you. Okay. I don't think so. But okay.
  Nurse -> Good. Anything else?
  Caller -> Nope. Just that. Well, tell the nurse who's coming Friday I said thank you for the dressing change last week.
  Nurse -> I'll pass it along.
  Caller -> Actually, one more. What if I can't sleep tonight, even with the trazodone? Can I take something else? || A2
  Nurse -> Please don't add anything on your own. If you have trouble, call us and we'll sort it out.
  Caller -> Okay. I'll call.
  Caller -> No. Thanks, Ruth. I feel dumb.
  Nurse -> Don't feel dumb. It's easy in the dark. You called, and that's right.
  Caller -> I'm going to keep a little flashlight on the nightstand. A reading light. Nothing fancy.
  Nurse -> That's a great idea.
  Caller -> My sister already ordered me one that clips on.
  Caller -> Thank you. Bye.
  Nurse -> Bye.
