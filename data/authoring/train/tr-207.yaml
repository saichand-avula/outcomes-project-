transcript: |
  Nurse -> Evergreen Hospice, this is Gail.
  Caller -> Hi, Gail. This is Anders Lindqvist. My mother is Beatrix Lindqvist. I just found out she stopped her metoprolol. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Anders. Thank you for telling me. What's her date of birth?
  Caller -> January fifteenth. Nineteen forty one. || patient_dob
  Nurse -> And is six one two, five five five, zero one six six still the best number? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. Tell me what you found out.
  Caller -> I was sorting her pills for the week and the metoprolol was all still there. The twenty five milligram ones. She's supposed to take them twice a day. I asked her, and she said she stopped taking them three days ago. || A1, F1
  Nurse -> Did she say why?
  Caller -> She said they made her dizzy. And she didn't want to bother anyone. But she's still dizzy. She said it today when she got up. Not terrible. A little. When she stands. || A2
  Nurse -> Okay. Has she fallen? Or almost fallen?
  Caller -> No. No falls. She holds onto the furniture, though. I've seen her do that. || A3
  Nurse -> Okay. I'm going to message the hospice provider about this, since she stopped it on her own. || R1, A1
  Caller -> Should I give it to her now? Since I'm here? She hasn't had any today.
  Nurse -> No. Please don't restart it and don't change anything until the provider answers. Stopping a heart medicine and then starting it again can be a problem, so we want a clinician to decide. || E1, A1
  Caller -> Don't give it. Wait for the provider. Okay. That makes sense. I'll put the pills away.
  Nurse -> I'll call you back this afternoon. || R2
  Caller -> This afternoon. Okay.
  Nurse -> And until then, have her sit for a minute before she stands, and have someone next to her when she walks. || E2
  Caller -> Sit first. Someone next to her. I'm staying until tonight. Okay.
  Nurse -> Is there anything else?
  Caller -> No. I wish she'd just told me. She's like that. She doesn't want to be a trouble.
  Nurse -> That's very common. I'm glad she has you.
