transcript: |
  Nurse -> Maple Lane Home Care, this is Hortense.
  Caller -> Hi. Hello. Um. I'm sorry, I'm not calling about a patient. I have a, it's about a job. Is this the right number?
  Nurse -> It might be. What kind of job are you asking about?
  Caller -> I'm a nursing student. I graduate in December. I was wondering if you hire per diem nurses. Or new grads.
  Nurse -> Congratulations on graduating. We do hire. I'm not the one who handles it, but I can point you in the right direction.
  Caller -> Oh, that would be great. I looked on your website, but I couldn't tell if the postings were current.
  Nurse -> The careers page is updated every Monday. Look for the home care nurse and the per diem nurse listings.
  Caller -> Okay. Per diem. And do I apply right on the page?
  Nurse -> Yes. There's an application and a place to upload a resume. HR will contact you.
  Caller -> Okay. And is there a person I can call? In case I want to follow up?
  Nurse -> The HR office is open Monday through Thursday, nine to three. I don't have a direct line, but they answer the main number, press three.
  Caller -> Monday through Thursday. Nine to three. Press three. Got it.
  Nurse -> Do you have your license yet?
  Caller -> I take the board exam in January. I've done my clinical hours. I did my last rotation in home health, actually, that's why I'm calling. I loved it.
  Nurse -> That's nice to hear. Home care is a special kind of nursing.
  Caller -> I loved being in people's houses. The patients were so sweet. One lady made me tea every visit.
  Nurse -> Ha. We have patients like that.
  Caller -> I drove forty minutes to get there and I didn't mind.
  Nurse -> That's a good sign. You'd be a good fit.
  Caller -> Thank you. I'm a little nervous about the exam.
  Nurse -> Everybody is. Take practice tests. You'll do fine.
  Caller -> I'm doing about a hundred questions a day. My roommate says I talk in my sleep. Rationales.
  Nurse -> Ha. That's real dedication.
  Caller -> Thanks. Okay. I won't keep you. Thank you so much.
  Nurse -> Good luck. I hope we see you here.
  Caller -> Me too. Bye.
  Nurse -> Bye now.
