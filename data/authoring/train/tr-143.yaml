  Nurse -> And the calcium. Is that a tablet, a chew?
  Caller -> A tablet. A big one. I take it with the thyroid one so I don't forget either of them. || A2
  Nurse -> I understand. It makes sense to pair them. But the thyroid medicine doesn't work as well when it's taken with coffee or with calcium. || R1, A1, A2
  Caller -> Oh. I didn't know that. Is that why I'm still so tired?
  Nurse -> It could be part of it. I can't say for sure. I'm going to message your prescriber to confirm the dose, because they may want to check your levels. || R2
