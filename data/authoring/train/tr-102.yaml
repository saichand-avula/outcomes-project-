transcript: |
  Nurse -> Cedar Point Hospice, this is Gwen.
  Caller -> I need somebody to come now. Please. It's my dad. Maurice Delacroix. I'm Simone. I can't handle him. || caller_name, relationship, patient_name, F1
  Nurse -> Okay, Simone, I'm here. Take a breath. What's his date of birth?
  Caller -> May fourth. Nineteen forty five. || patient_dob
  Nurse -> And is five oh four, five five five, zero one three eight your number? || callback_phone
  Caller -> Yes. Yes. That's me. || callback_phone
  Nurse -> What's happening?
  Caller -> He's been shouting since like nine. He's agitated. He's yelling at people who aren't there. And he keeps trying to leave. He's trying to open the front door. || cc, A1, A2
  Nurse -> Okay.
  Caller -> I can't. He's so strong when he's like this. I can't hold him. I can't be here by myself. || A3
  Nurse -> Is anybody else in the house?
  Caller -> No. It's just us. My husband's at work, he works nights. || A3
  Nurse -> Okay. Is he in pain? Did he fall? Is he hurt?
  Caller -> No. No, he didn't fall. He's not saying anything hurts. He's just, he's just scared, I think. He's not himself. || A4
  Nurse -> Okay. Simone, I'm going to page our on-call nurse right now. || R1
  Caller -> Okay. Please.
  Nurse -> She'll call you back in about ten minutes. || R2
  Caller -> Ten minutes. Okay.
  Nurse -> And she'll come out to the house. She'll be there within ninety minutes. || R3
  Caller -> Ninety. Okay. That's, okay. Okay.
  Nurse -> Until then, talk to him calmly and slowly. Turn the lights down. Turn off the TV. Don't argue with him about what he's seeing. || E1
  Caller -> Okay. Calm. Lights.
  Nurse -> If he's walking, walk with him. Don't stand in front of the door and block him. That can make it worse. || E1
  Caller -> Walk with him. Okay.
  Nurse -> And lock the outside doors, the deadbolt, so he can't get out. And move anything he could trip on. || E2
  Caller -> Okay. Deadbolt. I'll do it right now.
  Nurse -> I'll stay on until you've done that. || E2
  Caller -> Okay. Okay. Done. It's locked.
  Nurse -> Good job. The on-call nurse will call you very soon.
  Caller -> Thank you. Thank you so much, Gwen.
