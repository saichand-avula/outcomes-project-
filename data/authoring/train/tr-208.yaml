transcript: |
  Nurse -> Pinecrest Hospice, this is Mina.
  Caller -> Hi. It's, um, it's Everett Dahlgren. I'm a patient. I'm sorry to call so late. || caller_name, relationship, patient_name
  Nurse -> Don't be sorry, Everett. I'm glad you called. What's going on tonight?
  Caller -> I don't know. I'm just really low. Lately. And I keep thinking everyone would be better off if I just didn't wake up. || cc, A1, F1
  Nurse -> Thank you for telling me that. That's hard to say. I'm going to stay right here with you. Can I ask you something directly?
  Caller -> Okay.
  Nurse -> Are you thinking about hurting yourself? Do you have a plan, or something with you that you'd use?
  Caller -> No. No, nothing like that. I don't have a plan. I just, I think it, and I don't know what to do with it. || A2
  Nurse -> Okay. That's honest, and it helps me. Is anybody there with you tonight?
  Caller -> No. I live alone. My brother's in Oregon, we talk on Sundays. That's about it. || A3
  Nurse -> Okay. So it's quiet there, and it's late, and that's a lonely combination. Everett, can I get your birth date and a number to reach you?
  Caller -> August third, nineteen seventy three. || patient_dob
  Nurse -> And I have four two five, five five five, zero one one five. Is that right? || callback_phone
  Caller -> Yeah. That's my cell. || callback_phone
  Nurse -> Okay. Everett, I'm going to page the on-call clinician now so someone is looking at this tonight. || R1
  Caller -> Okay. I don't want to be a trouble.
  Nurse -> You're not. This is exactly what we're here for. I'm also going to ask our social worker to reach out to you. || R2
  Caller -> Okay. I'd like that. I think I'd like to talk to somebody.
  Nurse -> Good. And I'll call you back tonight myself, to check in. || R3
  Caller -> Tonight. Okay.
  Nurse -> If these thoughts get stronger, or you feel like you might act on them, call nine one one. You can also call or text nine eight eight any time, and you can always call our line, any hour. || E1
  Caller -> Nine eight eight. Nine one one. Your line. Okay. I wrote it down.
  Nurse -> Is there something you can do for the next little while, like a cup of tea, or the radio?
  Caller -> I could put the radio on. The ball game replay is on. That helps.
  Nurse -> Do that. I'm here. I'll talk to you soon.
