transcript: |
  Nurse -> Harbor Light Home Health, this is Marcus.
  Caller -> Hi, Marcus. It's Rhonda Quillen. I'm a patient. I'm calling because I'm not eating, and I'm wiped out. || caller_name, relationship, patient_name, cc, A1, A2
  Nurse -> Hi, Rhonda. Thanks for calling. Let me get your chart up. What's your date of birth?
  Caller -> October sixth, nineteen seventy two. || patient_dob
  Nurse -> And is six oh two, five five five, zero one four three still the best number? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. Tell me about the appetite. When did it start?
  Caller -> Since the chemo. I had it last Tuesday. I eat a few bites and I'm done. Everything tastes like metal. || A1
  Nurse -> That's very common. How about the tiredness?
  Caller -> I sleep ten hours and I'm still dragging. I made it to the couch and back. That's about it. || A2
  Nurse -> Okay. Any fever? Any vomiting?
  Caller -> No. No fever. I haven't thrown up. Just no appetite. || A5
  Nurse -> Okay. Rhonda, how are your spirits? Sometimes this part of the treatment gets heavy.
  Caller -> I'm a little sad. I missed my granddaughter's recital on Saturday because I couldn't get off the couch. I cried about it. That's silly. || A3
  Nurse -> It's not silly at all. Can I ask you a direct question? Any thoughts of hurting yourself, or that you'd be better off gone?
  Caller -> Oh, no. No, no, nothing like that. I'm sad, I'm not, I'm not that. I want to see her next recital. I just wish I had felt better for this one. || A4
  Nurse -> Okay. Thank you for telling me. I'm glad. I'm going to message your provider about the appetite and the low mood since the chemo. || R1, A1
  Caller -> Okay. Do you think they'll change something?
  Nurse -> They might have options for the appetite. I'm also going to ask our social worker to call you. A lot of people find it helps to have someone to talk to. || R2
  Caller -> Yes. I think I'd like that. Thank you.
  Nurse -> I'll call you back in two days to see how you're doing. || R3
  Caller -> Two days. Okay.
  Nurse -> In the meantime, try small meals every two to three hours instead of three big ones. Cold or bland foods sometimes go down easier. And keep sipping fluids. || E1
  Caller -> Small meals. Cold food. Fluids. I can do cold. I could eat a popsicle. I've been eating those.
  Nurse -> That's fine. And Rhonda, if you start to feel hopeless, or not safe, call or text nine eight eight any time, or call us any hour. || E2
  Caller -> Nine eight eight. Call you. Okay. I won't, but I'll remember.
  Nurse -> Good. That's all I ask. Anything else?
  Caller -> No. Thank you, Marcus. It helps to talk to a real person.
