  Caller -> Oh. I thought it was you. Is there a number?
  Nurse -> The scheduling desk is on the main line, press two when it answers. They're open until five.
  Caller -> Press two. Okay. It's just that she has a hair appointment Thursday and I forgot to tell them. She's very particular about her hair.
  Nurse -> I understand completely. The desk will sort it out in a minute.
  Caller -> Great. Is it okay if I call right now?
  Nurse -> Sure. Go ahead and press two when it picks up.
  Caller -> Okay. Thank you. Sorry, I called the wrong department.
  Nurse -> No problem at all. Have a good afternoon.
  Caller -> You too. Bye.
