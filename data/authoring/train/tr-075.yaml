transcript: |
  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Hi, Tom. It's Frank Vandersteen. I'm calling about my wife. Maureen. || caller_name, relationship, patient_name
  Nurse -> Hi, Frank. Her date of birth?
  Caller -> April third, nineteen forty six. || patient_dob
  Nurse -> And is five eight six, five five five, zero one three four your number? || callback_phone
  Caller -> Yeah, that's the house. || callback_phone
  Nurse -> What can I do for you?
  Caller -> I have a, kind of a dumb question. I want to know if she took her heart pill. The digoxin. This morning. || cc, A1
  Nurse -> Okay. What makes you unsure?
  Caller -> Well, she took it. She took it, I watched her. She took her pills at breakfast. Yeah. She took it. || A1
  Nurse -> Okay.
  Caller -> No. Wait. I don't know. I'm not sure now. She might've said she'd take it after her shower. And then. Let me go look. Hold on. I'll look at the box.
  Nurse -> Take your time.
  Caller -> Okay. I'm back. Okay, so the Tuesday slot is empty. It's empty. But I think I might've taken it out myself, when I was filling the, when I was doing next week. I don't know. || A1
  Nurse -> Okay. So the slot's empty, but you're not sure if she took it or you removed it.
  Caller -> Right. Right. I don't know. I feel stupid.
  Nurse -> You're not stupid, Frank. This happens a lot. Is she having any dizziness, or a slow heartbeat, anything unusual?
  Caller -> No. She's fine. She's sitting here doing her crossword. She says she feels fine. || A2
  Nurse -> Okay. What's her dose?
  Caller -> It's the point one two five. Once a day, in the morning. || A1
  Nurse -> Alright. Here's what I want you to do. Don't give her another pill today to make up for it. With a heart medicine, giving an extra one can be worse than missing one. || R1
  Caller -> Okay. I was worried about that. I was worried I'd double her up. Or that she missed it. I don't know which one's worse. || A3
  Nurse -> Don't double it. That's the safe rule. I'll have a nurse come out tomorrow and go through the pill box with you both. || R2
  Caller -> Okay. That would help. Thank you.
  Nurse -> And going forward, have her mark a calendar every time she takes it. And before she takes any pill, you both look in the slot together. || E1
  Caller -> Yes. The calendar. We have one on the fridge.
  Nurse -> Perfect. And call us if her heartbeat feels very slow or racing, if she's nauseous, her vision looks off, or she faints. || E2
  Caller -> Slow, racing, sick, vision, faint. Okay.
  Nurse -> Anything else?
  Caller -> No. Thanks for not making me feel dumb.
  Nurse -> Anytime.
