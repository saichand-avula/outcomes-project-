transcript: |
  Nurse -> Rowan Home Health, this is Ezra.
  Caller -> Hello? Ezra? It's hard to hear myself think. I'll talk slowly.
  Nurse -> Take your time.
  Caller -> Hi, Ezra. It's Isolde Brannigan. I'm a patient. I finished my chemo cycle yesterday and I'm very nauseous. I want to check on my nausea medicine. || caller_name, patient_name, relationship, cc
  Nurse -> Hi, Isolde. I'm sorry you're feeling rough. Tell me what you've taken.
  Caller -> Thank you. I'm lying on the couch with a bucket. Just in case.
  Nurse -> Smart to keep one close.
  Caller -> The ondansetron. The dissolving one. I took an eight milligram last night at about ten. No. Four. Four milligrams. The bottle says four. I always get that mixed up. It's the little tablet. Yes. Four. || A1
  Nurse -> Thanks.
  Nurse -> Ondansetron, four milligrams, last night at ten. Okay. How often are you allowed to take it? || A1
  Caller -> It's the one in the green box. My daughter wrote four on the lid.
  Nurse -> Good idea.
  Caller -> Every eight hours as needed. That's what the label says. I haven't taken any today. I'm almost eight hours. It's a little before six. No, it's noon. Hold on. I took it at ten last night so it's been fourteen hours. I haven't taken any today. I'm nervous about it.
  Caller -> I wrote the times on a card. I do that every cycle. Ten at night, six in the morning.
  Nurse -> Okay.
  Nurse -> Okay. Fourteen hours. That's well past eight. Tell me how the nausea is.
  Caller -> Sorry for the math. My head is foggy.
  Nurse -> Totally fine.
  Caller -> Moderate. It's there all the time. A rolling feeling. It's worse when I smell food. I vomited once this morning at seven. Just once. It was mostly water. And then I drank a little water, and it stayed down. || A2
  Nurse -> I'm sorry. That's miserable.
  Caller -> It's okay. I've had worse. The first cycle was terrible.
  Nurse -> It helps that you know what to expect.
  Nurse -> Okay. One episode of vomiting. Are you keeping sips down?
  Caller -> It was early. Seven. I haven't thrown up since.
  Nurse -> That's a good sign.
  Caller -> Yes. A few sips of water every ten minutes. And some ginger ale. It's flat. It stays down.
  Nurse -> Good. Keep doing that.
  Nurse -> Good. Any belly pain? Fever?
  Caller -> I keep checking. I'm a champion checker.
  Nurse -> Ha. Good.
  Caller -> No pain. My stomach is just queasy. No fever. I took it a while ago and it was normal. || A3
  Nurse -> Okay.
  Caller -> It's more like seasick. Like a boat ride that never ends.
  Nurse -> That's a good way to describe it.
  Nurse -> Okay. Isolde, what's your date of birth?
  Caller -> Sure. February something. I'm foggy. I'll get it.
  Caller -> February eleventh. Nineteen sixty. || patient_dob
  Nurse -> And your number?
  Caller -> Seven oh four, five five five, oh one eight one. || callback_phone
  Nurse -> Seven oh four, five five five, oh one eight one. Right? || callback_phone
  Caller -> Yes.
  Nurse -> Okay. Let me tell you about the tablet. It's a dissolving one. Put it on your tongue and let it melt. No water needed. Wait at least eight hours before the next one, and don't take more than three in a day. || E1
  Caller -> Please. I never read the little leaflet.
  Nurse -> Ha. Nobody does.
  Caller -> Let it melt. Eight hours. No more than three. Okay. I'll have the next one once we hang up. The bottle is right here on the table.
  Nurse -> Sounds good.
  Nurse -> Okay. I'm going to send a message to the team about the nausea and the vomiting after your chemo, so they can see it. || R1
  Caller -> Thank you. They might have something stronger. Last cycle I had a second pill.
  Nurse -> The team will look at what's best.
  Nurse -> They'll decide. I'll also call you tomorrow to see how you're doing. || R2
  Caller -> Tomorrow. Okay. What time?
  Caller -> I'll have my phone on the couch cushion. I fall asleep with it.
  Nurse -> Ha.
  Nurse -> Late morning.
  Caller -> Good. I'll be on the couch.
  Nurse -> In the meantime, take small sips of water or ginger ale every few minutes. When the nausea settles a bit, try bland foods, like crackers. || E2
  Caller -> Sips. Ginger ale. Crackers. Okay. I have saltines. I have a whole sleeve.
  Caller -> I wish I could eat the soup my neighbor brought. The smell is too much.
  Nurse -> That will pass in a day or two.
  Nurse -> Perfect. And call us if you vomit more than three times, if you can't keep fluids down for eight hours, if you get a fever, dizziness, or very little urine. || E3
  Caller -> More than three. Eight hours. Fever. Dizzy. Little urine. Okay. I wrote it on my hand. Just kidding. On a sticky note.
  Nurse -> Ha. A sticky note is better.
  Nurse -> And keep the note somewhere you'll see it.
  Caller -> I put it on the lamp. It's the first thing I'll see.
  Caller -> Thank you, Ezra.
  Caller -> You have a calm voice. It helps.
  Nurse -> I appreciate that. Rest now.
  Nurse -> You're welcome. Rest.
  Caller -> I will. Bye.
  Nurse -> Feel better.
