  Nurse -> What's going on?
  Caller -> My mom is really sleepy today. The aide called me. She says she's been sleeping since morning, and she's hard to get going. || cc, A2
  Nurse -> Okay. Did she have anything new last night?
  Caller -> The aide gave her a pill. At bedtime. For her nerves. One of those Z pills. The Xanax. Or the Zantac. Something with a Z. || A1
  Nurse -> Okay. Do you know what it says on the bottle?
  Caller -> No, I can't see it. I'm at work. The aide has it. I don't know the name. I just remember a Z. || A1
  Nurse -> Okay.
  Caller -> Honestly, I think it was the Xanax. But I don't know. || A1
  Nurse -> Okay. Is she waking up when someone says her name?
  Caller -> The aide says yes. She opens her eyes and then falls back asleep. || A2
  Nurse -> Is she eating or drinking anything?
  Caller -> A few sips of water. Half of a banana. That's it.
  Nurse -> Okay. And her breathing?
  Caller -> Normal, the aide says. She said it's regular. Not slow or anything. || A3
  Nurse -> Alright. I'm going to call the aide right now and have her read me the bottle. And how much she gave. || R1
  Caller -> Oh, good. Okay. I should have asked her.
  Nurse -> It's okay. And I'll send a nurse to see your mom this afternoon. || R2
  Caller -> This afternoon. Okay. Thank you.
  Nurse -> Until then, the aide should keep checking that she wakes to her name, that she takes sips, and that her breathing stays regular. || E1
  Caller -> Okay. I'll tell her.
  Nurse -> And if she can't be woken up, or her breathing gets slow, call us right away. || E2
  Caller -> Okay. Can't wake. Slow breathing. I will.
  Nurse -> Anything else?
  Caller -> No. Thanks, Gwen.
