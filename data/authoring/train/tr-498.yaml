transcript: |
  Nurse -> Cedar Row Home Health, this is Gideon.
  Caller -> Hello? Is this the nurse? I hope this is the right number. I've been rehearsing what to say.
  Nurse -> It's the right number. Go ahead.
  Caller -> Hi, Gideon. It's Anneke Strathmore. I'm Philippa Strathmore's daughter. I need to tell you something, and I want to say first that I didn't stop her blood pressure pill. I stopped the other one. The water pill. I probably shouldn't have. || caller_name, patient_name, relationship, cc, F1
  Nurse -> Hi, Anneke. How are you?
  Caller -> Nervous. I'll get to the point. It's about her pills.
  Nurse -> Hi, Anneke. Thank you for telling me. Let's go through it. What is she taking?
  Caller -> Thank you for answering. I wasn't sure about calling this late in the day.
  Nurse -> It's fine. We take calls until nine.
  Caller -> I made a list. It's on an index card. I'll read it from there.
  Caller -> I feel nervous. I don't want to get in trouble.
  Nurse -> You're not in trouble. Let's talk.
  Caller -> She's on two. The amlodipine, five milligrams, once a day. That's the blood pressure one. I did not stop that one. I give it every morning. I gave it today. || A1
  Nurse -> Okay.
  Caller -> I keep them in a pillbox, one of the big ones with the days. I fill it on Sundays.
  Nurse -> That's great.
  Nurse -> Amlodipine, five milligrams, every morning, and she had it today. And the other one? || A1
  Caller -> I'm very careful with that one. I check it twice. I don't want to mix anything up.
  Nurse -> That's good.
  Caller -> The hydrochlorothiazide. Twenty five milligrams. Once a day. The water pill. I haven't given it for three days. I stopped it Saturday. || A2
  Nurse -> Okay. And you took it out of the pillbox?
  Caller -> Yes. Saturday. I took it out of all the days.
  Nurse -> Okay.
  Nurse -> Okay. Why did you stop it?
  Caller -> I should have called you. I'm sorry. I was panicking.
  Nurse -> It's okay.
  Caller -> She was dizzy. Really dizzy on Friday. She stood up from the couch and grabbed the wall. I got scared. I read online that water pills can make you dizzy. So I stopped it. I didn't call anyone. I didn't want to bother you on a weekend.
  Caller -> She was making tea. I heard the cup rattle. She had to sit on the kitchen floor.
  Nurse -> That sounds scary.
  Caller -> It was. For both of us.
  Nurse -> I'm sorry. That must have been frightening.
  Caller -> It was. She went pale. I thought she'd faint.
  Nurse -> Okay.
  Nurse -> Okay. I understand why you did that. It came from a good place. How is she now?
  Caller -> Thank you for understanding.
  Caller -> Better. The dizziness isn't gone, but it's less. It's not every time she stands. Maybe once a day. She says it's like a little wave. It passes. || A3
  Caller -> When she stands she pauses. Counts to five. Then she goes. I taught her that trick.
  Nurse -> That's a good one.
  Nurse -> Mm hm.
  Nurse -> Okay. Has she fainted, or fallen?
  Caller -> No. She hasn't fainted. She hasn't fallen. Not once. I'm always next to her. || A5
  Nurse -> Good. That's reassuring.
  Caller -> I'm learning. Slowly. Thank you for being patient.
  Nurse -> Good. Have you checked her blood pressure?
  Caller -> This morning, before her pill. One forty two over eighty four. That's higher than it was in the hospital. But she hasn't had the water pill for three days. || A4
  Nurse -> Okay.
  Caller -> I used the cuff the nurse showed me. It beeps when it's done. I did it twice. Same both times.
  Nurse -> Good.
  Nurse -> Okay. One forty two over eighty four. Thank you. I'm glad you checked. Anneke, what's your mom's date of birth?
  Caller -> Her usual is one thirty something. So it's a bit up.
  Nurse -> Okay. Good to know.
  Caller -> I wrote it down right away. The number. And the time.
  Nurse -> That's useful.
  Caller -> Is that really high? I wasn't sure.
  Nurse -> It's a little higher than we'd like, but not dangerous.
  Caller -> Okay.
  Caller -> October twenty seventh. Nineteen forty nine. || patient_dob
  Nurse -> And your number?
  Caller -> Four oh four, five five five, oh one seven three. || callback_phone
  Nurse -> Four oh four, five five five, oh one seven three. Right? || callback_phone
  Caller -> Yes. That's my cell.
  Nurse -> Great. Thanks.
  Caller -> I'll keep it with me all day. Even in the garden.
  Nurse -> Perfect.
  Caller -> Mom just asked who I'm talking to. I said the nurse. She said, tell him hello.
  Nurse -> Hello, Mrs. Strathmore.
  Caller -> She waved at the phone. She does that.
  Nurse -> Ha. A friendly wave.
  Caller -> Is there anything else I might be doing wrong that I don't know about?
  Nurse -> Not from what you've described. You're being careful. Just keep checking with us.
  Nurse -> Thanks.
  Nurse -> Okay. Here's the honest answer. I'm glad you called, and I'm not upset. But you shouldn't stop a medicine without checking with us first. Stopping the water pill can raise her pressure, and the dizziness could have another cause. || E1
  Caller -> I'm bracing myself.
  Nurse -> No need.
  Caller -> Please. Be honest.
  Nurse -> I will.
  Caller -> I know. I know. I feel terrible. I didn't mean to do anything wrong.
  Nurse -> It's okay. Let's focus on the next step.
  Nurse -> You didn't do anything wrong on purpose. You were trying to help. What matters now is that the clinician knows. I'm going to send a message to the team right away, and ask whether to restart the water pill. || R1
  Caller -> Thank you. That means a lot.
  Caller -> Okay. Please. Should I give it tonight? Or wait?
  Nurse -> Please wait for the clinician. Don't restart it on your own either. Keep giving the amlodipine every morning. || A1
  Caller -> I put the bottle in a drawer. Away from the pillbox. Just so I don't do it by habit.
  Nurse -> That's a smart move.
  Caller -> I will. I promise. I won't do anything.
  Nurse -> Thank you.
  Caller -> Wait. Don't restart. Keep the amlodipine. Okay. I will. || A1
  Nurse -> Right.
  Nurse -> I'll call you back tomorrow to let you know what they say. || R2
  Caller -> Is it all right if I call you first if I hear back from anyone else?
  Nurse -> Of course.
  Caller -> Tomorrow. Okay. What time?
  Caller -> I'll be here. I took the week off.
  Nurse -> That helps.
  Nurse -> Late morning.
  Caller -> Eleven's perfect.
  Caller -> Okay. That works. We have breakfast at eight and she naps at ten.
  Nurse -> Then I'll call at eleven.
  Caller -> Good. I'll be home with her.
  Nurse -> In the meantime, check her blood pressure in the morning and the evening, sitting down. Write the numbers down. And have her stand up slowly. || E2
  Caller -> Sitting. Same arm. I remember that part.
  Nurse -> Good.
  Caller -> Morning and evening. Sitting. Write it down. Stand up slowly. Okay. I have the cuff. And a notebook.
  Nurse -> Good.
  Caller -> I'll make a chart on graph paper. A friendly one.
  Nurse -> Ha.
  Nurse -> Perfect.
  Nurse -> Call us if she faints, or falls, if her pressure goes over one hundred eighty, if she has a bad headache, or her legs swell up. || E3
  Caller -> Faints. Falls. Over one eighty. Bad headache. Swelling. Okay. I'll write that on the first page.
  Nurse -> Right. Those are the ones to remember.
  Caller -> I'll tape this to the fridge. Right at eye level.
  Nurse -> Good.
  Nurse -> Right.
  Nurse -> Good.
  Caller -> Thank you for not yelling at me.
  Nurse -> Never. Mistakes like this are common.
  Nurse -> Of course.
  Caller -> My brother would have. He yells.
  Nurse -> Ha.
  Nurse -> I'd never. You did something very human. You reached out, which is what counts.
  Caller -> I just love her. And I got scared.
  Nurse -> That's what this is. Love and fear. It's normal.
  Caller -> Thank you, Gideon.
  Nurse -> You're doing right by her.
  Caller -> I hope so. I try.
  Nurse -> You're welcome. Talk tomorrow.
  Caller -> Thank you again. I'm going to go sit with Mom.
  Caller -> Bye.
