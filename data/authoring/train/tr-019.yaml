  Nurse -> Okay, great. That matches. And what else does he have?
  Caller -> He has oxycodone, five milligrams, every four hours as needed. || A3
  Nurse -> Okay. And when was the last time he had the oxycodone? || A3
  Caller -> Eight this morning. || A3
  Nurse -> Alright. So here's what I'd like to do. About thirty minutes before the dressing change, give him the oxycodone. That's the breakthrough dose, and it's there for exactly this. || R1
  Caller -> Okay. Thirty minutes before. We can time that.
  Nurse -> Yes. And when you do the dressing, go slow, position him gently, and stop for a minute if he winces. || E1
  Caller -> Okay. We'll take our time.
  Nurse -> I'm also going to send a nurse to see him tomorrow to look at the wound and reassess the pain. || R2
  Caller -> Oh good. That'd be great.
  Nurse -> If his pain stays over a seven even after the oxycodone, or he gets really sleepy, call us. || E2
  Caller -> Okay. Seven or really sleepy. Got it.
  Nurse -> Anything else?
  Caller -> No. Thank you.
  Nurse -> Thanks, Teresa.
