  Caller -> Yesterday. I think it was yesterday afternoon. He's usually sharp as a tack. He does the crossword. || A1
  Nurse -> And you said he hasn't eaten?
  Caller -> Barely. Since yesterday he's picked at a cracker. That's all I've seen. || A2
  Nurse -> Okay. Did you see him fall? Any bruises, any injury?
  Caller -> No. No, nothing like that. I looked around. No blood. He was in his chair. || A3
  Nurse -> Okay. Do you happen to know his date of birth?
  Caller -> Oh, no, honey. I don't know that. I know his birthday's in the spring, but not the year. I'm sorry.
  Nurse -> That's all right. I have him in the system. And a number for you, in case I need to reach you?
  Caller -> Six one five, five five five, zero one eight four. That's my kitchen phone. || callback_phone
  Nurse -> Okay. Do you know what medicines he takes?
  Caller -> No. I wouldn't know that. I'm sorry. I just know he has a lot of bottles on the table.
  Nurse -> That's all right. I'm going to send a nurse out to see him this afternoon. || R1
  Caller -> Oh, thank goodness. Should I stay with him until then?
  Nurse -> If you can sit with him for a bit, that would help. If he can't be woken up, if he falls, or if he has any trouble breathing before the nurse gets there, call nine one one. || E1
  Caller -> Not wake up, falls, breathing. Nine one one. Okay. I'll go over now.
  Nurse -> And I'll call you this evening to let you know what the nurse found. || R2
  Caller -> This evening. Okay. Thank you, Tom. He doesn't have anyone else, you know. His son is in Oregon.
  Nurse -> I know. It's good he has you, Marlene.
