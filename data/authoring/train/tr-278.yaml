transcript: |
  Nurse -> Harbor Light Palliative Care, this is Gus.
  Caller -> Yes, hello. This is Leonard Szymanski. I'm calling about my wife. Her feet are all swollen up. Her legs. More than they were. || caller_name, relationship, cc
  Nurse -> Okay, Mr. Szymanski. Sorry to hear that. What's your wife's name?
  Caller -> Marguerite. Marguerite Szymanski. M A R G U E R I T E. And Szymanski is S Z Y M A N S K I. People always get it wrong. || patient_name
  Nurse -> Okay. Margaret Shimanski. Let me pull up her chart. Hold on.
  Caller -> Marguerite. With the, the U E.
  Nurse -> Got it. I see her. What's her date of birth?
  Caller -> November fourth. Nineteen forty eight. No. Wait. Forty seven. Nineteen forty seven. I'm sorry. I'm eighty, my brain. She's older than me. She's forty seven. || patient_dob
  Nurse -> November fourth, nineteen forty seven. Okay. And a good number for you?
  Caller -> The house phone is dead half the time. Use my cell. Four one four. Five five five. Zero one two eight. || callback_phone
  Nurse -> Four one four, five five five, zero one two eight. Great. || callback_phone
  Caller -> That's it.
  Nurse -> Alright, tell me about the swelling. When did you notice it?
  Caller -> Well, she's had a little. A little puffiness. Always. Ever since the heart thing. But last week it was just the ankles, like the sock line. And now it's up past the ankle. It's up the shin. It's, I pressed on it and my finger left a dent. || A1
  Nurse -> A dent that stays for a bit?
  Caller -> Stays. Stays a while. I counted. I counted to ten and it was still there.
  Nurse -> Okay. Both legs?
  Caller -> Both. The left is worse. A little.
  Nurse -> And how's she doing otherwise? How's she feeling?
  Caller -> Tired. She's always tired. She's sitting in the chair. She won't go out to the porch. Her friend Dolores came by and she said she didn't feel like talking.
  Nurse -> Okay. Has she been weighing herself?
  Caller -> I weigh her. I do the weighing. We have the scale in the bathroom. Every morning. And she was, the number I wrote down, she was one forty one on Sunday. And this morning she was one forty five. That's four pounds. In three days. || A2
  Nurse -> Okay. Four pounds in three days. Thank you for keeping track.
  Caller -> Well I'm not stupid. The nurse told us to. I just don't always understand what the number means.
  Nurse -> No, you're doing it right. That weight gain is likely fluid, and that's what the provider needs to look at.
  Caller -> Fluid. That's what I thought.
  Nurse -> Now. Is her breathing different? Any chest pain?
  Caller -> No. No chest pain. She says no. And the breathing is the same as it always is. She's a little short on the stairs but she doesn't do the stairs anymore. She sleeps with two pillows. Same as always. || A5
  Nurse -> Okay. Same as usual. That's good to hear.
  Caller -> It's good.
  Nurse -> Mr. Szymanski, let me ask about her medicines. Can you read me what she's taking, from the bottles?
  Caller -> Sure. Sure. Hold on. I have them in the, the little basket. Let me get my glasses. Okay. These two look alike. They give me a headache. One is hydroxyzine. H Y D R O X Y Z I N E. Twenty five milligrams. At bedtime, if needed, for the itching. || A3
  Nurse -> Okay. Hydroxyzine, twenty five milligrams, bedtime as needed for itching. || A3
  Caller -> Yes. She hardly uses it. And the other one. Hydralazine. H Y D R A L A Z I N E. Twenty five milligrams. Three times a day. That's her blood pressure one. || A4
  Nurse -> Okay. Hydralazine twenty five, three times a day. Did she get her dose this morning? || A4
  Caller -> This morning, yes. At eight. And she'll get one at two and one at bedtime. I do the pillbox. I'm very careful because the names are alike.
  Nurse -> That's smart. Those two get mixed up a lot.
  Caller -> I put a sticker on the hydroxyzine. A blue dot. For the itch. || A3
  Nurse -> That's a great idea.
  Caller -> Dolores gave me the stickers. She's a retired teacher.
  Nurse -> Ha. That's lovely.
  Caller -> Is she okay? The swelling. Should I be worried?
  Nurse -> I don't think it's an emergency right now, because she's breathing the same and has no chest pain. But I do want the provider to know about it today. I'll send a message to the palliative provider about the ankle swelling and the four pound weight gain. || R1
  Caller -> Will they change the water pill?
  Nurse -> They might. That's the sort of thing they'd decide. I don't want to promise.
  Caller -> No, no. I know.
  Nurse -> I'm also going to send a nurse to see her tomorrow, to listen to her heart and lungs, check her legs, and weigh her. || R2
  Caller -> Tomorrow. What time?
  Nurse -> The scheduler will call you in the morning with a window.
  Caller -> Okay. I'm home. I'm always home.
  Nurse -> And I'll call you back this evening to let you know what the provider says. || R3
  Caller -> This evening. Okay. After supper?
  Nurse -> Probably around six or seven. I'll try.
  Caller -> That's fine. We eat at five.
  Nurse -> Okay. In the meantime, Mr. Szymanski, keep weighing her every morning. Right after she uses the bathroom and before breakfast, same scale, same clothes. Write it down. If she goes up two pounds in a day, call us. || E1
  Caller -> Every morning after the bathroom. Write it down. Two pounds in a day. Okay. Two pounds. I'll put it on the fridge.
  Nurse -> Good. And when she's sitting or lying down, put her legs up on pillows. That helps the swelling. || E2
  Caller -> Up on pillows. She has the footstool but it's too low. I'll use the couch pillows.
  Nurse -> The couch pillows are perfect.
  Caller -> She'll complain. But she'll do it.
  Nurse -> Ha. Tell her it's doctor's orders.
  Caller -> I will. I'll say Gus said.
  Nurse -> There you go. And one more thing. Call nine one one if she has chest pain, if she has trouble breathing sitting still or lying down, or if she gets confused. || E3
  Caller -> Chest pain, can't breathe lying down, confused. Nine one one. I've got it.
  Nurse -> Good. Do you have any questions for me?
  Caller -> Just, will the swelling go down?
  Nurse -> It often does when the provider adjusts the water pill. We'll see what they say.
  Caller -> Okay. Okay. Thank you. I feel better. I was worried I was missing something.
  Nurse -> You're not missing anything. You're paying attention. That's what she needs.
  Caller -> Thank you, Gus. I'll wait for your call.
  Nurse -> Talk to you this evening, Mr. Szymanski.
  Caller -> Bye now.
