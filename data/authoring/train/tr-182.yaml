transcript: |
  Nurse -> Cedar Point Hospice, this is Beth.
  Caller -> Beth, it's Marit Engstrom. My husband is Rolf Engstrom. His pain pills ran out. || caller_name, relationship, patient_name, cc, F1
  Nurse -> Oh no. Okay, Marit, I'm here. What's his date of birth?
  Caller -> March fourteenth. Nineteen forty four. || patient_dob
  Nurse -> And is three two oh, five five five, zero one three eight the best number? || callback_phone
  Caller -> Yes. || callback_phone
  Nurse -> Okay. Tell me what happened.
  Caller -> The oxycodone. The five milligram tablets. He takes one every four hours. I gave him the last one last night at eleven. There are none left. Zero. The refill was supposed to come on Monday, the pharmacy said, and it never came. || A1, A2, A4, F1
  Nurse -> Okay. And how is his pain now?
  Caller -> It's getting worse. He said a six when he woke up and now it's more. He's been holding his side for an hour. I think it's a seven or an eight now. But he said six, so I'll say six. || A3
  Nurse -> Okay. Marit, I'm going to page our on-call nurse right now to get an emergency supply. || R1
  Caller -> Thank you. Oh, thank you. I didn't know who to call.
  Nurse -> You did the right thing. We'll get the oxycodone delivered to you tonight. || R2
  Caller -> Tonight. Okay. Does somebody have to bring it? I can't leave him.
  Nurse -> Yes. A driver will bring it to the door. I'll call you back within the hour to give you the time. || R3
  Caller -> Within the hour. Okay.
  Nurse -> Until it arrives, help him into the most comfortable position, and try a warm pack on the sore area. Keep the room quiet. || E1
  Caller -> Warm pack. Quiet. Okay. I have the rice sock. I'll warm it.
  Nurse -> And call me any hour if his pain gets worse before the oxycodone comes. || E2
  Caller -> Any hour. Okay. Thank you, Beth. I'm so sorry to bother you.
  Nurse -> You're not bothering me. This is exactly what we're here for.
  Caller -> I know. I just hate asking for help. We've always done everything ourselves.
  Nurse -> It's okay to ask now. Talk to you within the hour.
