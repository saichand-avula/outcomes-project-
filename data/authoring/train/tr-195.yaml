transcript: |
  Nurse -> Riverbend Hospice, this is Rhonda.
  Caller -> Hi, Rhonda. It's Irma Harmon. I'm calling about my husband, Floyd Harmon. || caller_name, relationship, patient_name
  Nurse -> Hi, Irma. What's Floyd's date of birth?
  Caller -> October twenty sixth. Nineteen thirty eight. || patient_dob
  Nurse -> And is nine three six, five five five, zero one one eight a good number? || callback_phone
  Caller -> Yes. That's the house. || callback_phone
  Nurse -> What's going on?
  Caller -> He's been sick to his stomach. After he eats. For two days. Not all the time, just after meals. || cc, A1
  Nurse -> Okay. Has he vomited?
  Nurse -> Once. Yesterday, after supper. Just once. It was mostly food. || A2, label_error
  Nurse -> Okay. Does he take anything for nausea?
  Caller -> The ondansetron. Four milligrams. He takes it every eight, if he needs it. He took one this afternoon around two. It helps. It takes the edge off. || A3
  Nurse -> Okay. Any belly pain?
  Caller -> No. Just nauseous. He doesn't feel like eating but I keep pushing. || A1
  Nurse -> Okay. I'll message his provider about the nausea after meals. || R1
  Caller -> Okay. Thank you.
  Nurse -> And I'll call you tomorrow to see how he's doing. || R2
  Caller -> Tomorrow. Okay.
  Nurse -> Irma, try six small meals a day instead of three big ones. Keep the food bland, with sips in between, and keep him sitting up for thirty minutes after he eats. || E1
  Caller -> Six small ones. Bland. Sips. Sitting up thirty minutes. Okay. I've been giving him big plates. That's probably my fault.
  Nurse -> It's not your fault. Small amounts are just easier on the stomach. Anything else?
  Caller -> No. Thank you, Rhonda. It's nice to hear a friendly voice.
  Nurse -> Anytime. Take care.
