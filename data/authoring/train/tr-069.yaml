transcript: |
  Nurse -> Summit Palliative Care, this is Denise.
  Caller -> Hello? Hello, is this the nurse?
  Nurse -> Yes, this is Denise. Who am I speaking with?
  Caller -> This is Winnie. Winnie Abernathy. I think I did something silly with my pills. || patient_name, caller_name, relationship
  Nurse -> Okay, Winnie. Let me pull up your chart. What's your date of birth?
  Caller -> February eleventh. Nineteen thirty four. || patient_dob
  Nurse -> Thanks. And is nine five four, five five five, zero one four three your number? || callback_phone
  Caller -> Yes, that's the one, dear. || callback_phone
  Nurse -> Okay. Tell me what happened.
  Caller -> Well. This morning I took my pill, my blood pressure pill, I thought. The hydroxy-something. And I looked at the bottle just now and it says hydroxyzine. That's the one for my itching. || cc, A1, F1
  Nurse -> Okay. Let me look at your list. I see hydralazine, twenty five milligrams, three times a day, for your blood pressure. And hydroxyzine, twenty five milligrams, for the itching. Those two names sound so alike. || A1, A2
  Caller -> They do! They sound the same. Oh. So I took the itching one. The hydroxyzine. One tablet. || A1
  Nurse -> One tablet of the hydroxyzine, twenty five. Okay. And did you take your hydralazine this morning? || A1, A2
  Caller -> No. No, I didn't. I thought I did. That's what I thought I took. || A2
  Nurse -> Okay. How are you feeling right now?
  Caller -> Sleepy. A little. A little sleepy. I'm sitting in my chair. I'm talking to you. || A3
  Nurse -> Okay. Is your blood pressure cuff nearby?
  Caller -> Yes. Hold on. Let me, hold on. It says one fifty over eighty two. || A4
  Nurse -> Okay. That's okay, thank you. Winnie, I want you to stay in your chair. Don't take the next hydralazine until the pharmacist or the doctor calls you back. || R3
  Caller -> Okay. Don't take it. Okay.
  Nurse -> I'm going to message the pharmacist and your prescriber right now about the mix-up and the missed blood pressure pill. || R1
  Caller -> All right. Thank you, dear.
  Nurse -> And I'll call you back within the hour. || R2
  Caller -> Within the hour. Okay.
  Nurse -> Please stay seated or in bed. Don't walk around by yourself, since the hydroxyzine can make you sleepy and unsteady. And keep the phone right next to you. || E1
  Caller -> I have the phone right here. In my lap.
  Nurse -> Good. And when this is sorted out, keep those two bottles in different places, and ask the pharmacy about a pill organizer. || E2
  Caller -> Oh, that's a good idea. My daughter said that too.
  Nurse -> Okay. Anything else?
  Caller -> No, dear. Thank you. I feel so silly.
  Nurse -> It happens a lot, with those names. You did the right thing. Okay.
  Caller -> Okay. Bye.
