transcript: |
  Nurse -> Cedar Point Hospice, this is Joel.
  Caller -> Joel, it's Ruth Quillfeather. My husband Abner won't stop throwing up. Six times since this morning, and I gave him the Zofran twice and it isn't working. || caller_name, relationship, patient_name, cc, A1, A2, F1
  Nurse -> Okay, Ruth. I'm sorry. I'm going to help. What's Abner's date of birth?
  Caller -> December nineteenth, nineteen forty nine. || patient_dob
  Nurse -> Thanks. And I have four oh five, five five five, zero one one four? || callback_phone
  Caller -> Yes. Yes, that's the house. || callback_phone
  Nurse -> Okay. Can he keep anything down, even a few sips?
  Caller -> No. I tried water an hour ago and it came right back. Even a sip. He can't keep a thing down. || A3
  Nurse -> Okay. When did he last have the Zofran? || A2
  Caller -> The second one was about two hours ago. I don't know if it stayed down either. Maybe it did. He threw up a bit after. || A2
  Nurse -> Okay. How is he otherwise? Is he alert? Weak?
  Caller -> He's weak. He's lying there and he doesn't want to move. He's so tired. He can't lift his head without it spinning. || A4
  Nurse -> Okay, Ruth. This isn't being controlled, so I'm going to page the on-call clinician right now. || R1
  Caller -> Please. Please. What do I do? Do I give him more of the Zofran? || A2
  Nurse -> Please don't give another Zofran until the on-call clinician tells you. And hold the food and drinks. Just ice chips, a few at a time, and keep his head up on pillows. || E2, E1, A2
  Caller -> No more Zofran. Ice chips. Head up. Okay. I'll get the ice. || A2
  Nurse -> I'm also going to send a nurse out within two hours. || R2
  Caller -> Within two hours. Okay. Okay. Thank you so much.
  Nurse -> I'll call you back in thirty minutes, whether or not you've heard from the on-call clinician. || R3
  Caller -> Thirty minutes. Okay. I'll keep the phone with me.
  Nurse -> Is there anyone with you?
  Caller -> No. Just me. Our daughter is two hours away. I haven't called her. I didn't want to scare her.
  Nurse -> I'd call her. She'd want to know, and you shouldn't be alone tonight.
  Caller -> You're right. I'll call her after I give him the ice. Thank you, Joel.
  Nurse -> Of course. Talk soon.
