transcript: |
  Nurse -> Pinecrest Hospice, this is Carla.
  Caller -> Hi, Carla. Gladys Pritchard. I'm calling about Eldon. My husband. Eldon Pritchard. || caller_name, relationship, patient_name
  Nurse -> Hi, Gladys. Date of birth?
  Caller -> September twenty third. Nineteen forty two. || patient_dob
  Nurse -> And I have four seven nine, five five five, zero one zero nine. || callback_phone
  Caller -> That's right. || callback_phone
  Nurse -> What's going on tonight?
  Caller -> Well. He said something. A little while ago. And I don't, I don't know if I'm overreacting. || cc
  Nurse -> Tell me what he said.
  Caller -> He said, I'd be better off dead. He said I wish I'd just go in my sleep. || A1, F1
  Nurse -> Okay.
  Caller -> And he's never said that. He's never said anything like that. He's been so quiet this week. He won't eat with us. He just looks out the window. || A3
  Nurse -> Mm-hm. Okay. Gladys, thank you for calling me. You're not overreacting.
  Caller -> Okay.
  Nurse -> Did he say anything about doing something? Any kind of plan? Hurting himself?
  Caller -> No. No. Just that. He didn't say anything like that. I asked him, I said Eldon are you thinking of doing something and he said no, he said I'm just tired. || A2
  Nurse -> Okay. Is he calm right now?
  Caller -> He's calm. He's in bed. He's awake but he's calm.
  Nurse -> Okay. Where are his medicines kept?
  Caller -> In the kitchen. In a basket. On the counter. All of them. The morphine too. || R3
  Nurse -> Okay. I want you to put all of them in a box with a lock, or somewhere he can't reach. And you give him every dose yourself. || R3
  Caller -> A lock. I think we have a, a tackle box. With a lock.
  Nurse -> That works.
  Caller -> Okay. I'll do it right now.
  Nurse -> And I don't want you to leave him alone tonight. Can you stay in the room, or is there someone else who can? || E2
  Caller -> I'll stay. I'm not going anywhere. My son's here too.
  Nurse -> Good. Gladys, tomorrow I'm sending our social worker and our chaplain to talk with you both. || R1
  Caller -> Okay. I think he'd talk to the chaplain. He likes Father Dominic.
  Nurse -> And a nurse will come tomorrow morning too. || R2
  Caller -> Tomorrow morning. Okay.
  Nurse -> If he ever talks about a plan, or tries to hurt himself, call nine one one. And you can call or text nine eight eight any time, or just call us. Any hour. || E1
  Caller -> Nine one one. Nine eight eight. Okay.
  Nurse -> You did the right thing.
  Caller -> Thank you, Carla. Thank you. I was so scared.
