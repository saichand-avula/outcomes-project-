transcript: |
  Nurse -> Cedar Point Hospice, this is Gwen.
  Caller -> Hi, Gwen. It's Mitch. Mitch Rudkin. I'm calling about my dad, Anselm. Anselm Rudkin. || caller_name, relationship, patient_name
  Nurse -> Hi, Mitch. Can I get his date of birth?
  Caller -> February nineteenth, forty two. Nineteen forty two. || patient_dob
  Nurse -> Thanks. And I have nine oh one, five five five, zero one three three for you. || callback_phone
  Caller -> Yep. That's my cell. || callback_phone
  Nurse -> What's going on tonight?
  Caller -> So he won't take his pill. The blood pressure one. The, the amlodipine. He's been spitting it out. It's been, what, three days now. || cc, A1, F1
  Nurse -> Okay. What dose is that?
  Caller -> Five milligrams. Once a day. In the morning. || A1
  Caller -> And I checked him a little while ago and it was one sixty eight over ninety four. || A2
  Nurse -> Okay. Any chest pain? Headache? Anything like that?
  Caller -> No. No chest pain. He says he feels fine. He says he feels fine and I'm, I'm a nag. || A3
  Nurse -> Mm-hm. Has he told you why he won't take it?
  Caller -> He says it's junk. He says he's not taking any more of that junk. I mean, I, honestly, Gwen, I could strangle him sometimes. I swear. He's killing me with this. || A4
  Nurse -> It sounds like you're really worn out.
  Caller -> I am. I'm up at five every day, I do everything, and then it's a fight over a pill. I don't know what to do. I don't know what I'm supposed to do. || A4
  Nurse -> I hear you. First, please don't force it, and don't crush it up and hide it in his food. Not until the doctor tells us what he wants to do. || R4
  Caller -> Okay. Okay. I wasn't going to hide it. I just, yeah.
  Nurse -> I'm going to send a message to his doctor tonight about whether we should keep this pill at all, given his goals. || R1
  Caller -> Okay. Okay, that, that makes sense.
  Nurse -> And I'll have a nurse come out tomorrow morning to see him and check his pressure. || R2
  Caller -> Tomorrow morning. Okay.
  Nurse -> I'd also like our social worker to call you. She helps caregivers. You're doing a lot. || R3
  Caller -> Yeah. Yeah, I think that would help. Honestly.
  Nurse -> If he gets a really bad headache, chest pain, he seems confused, or one side of his body looks weak, call us right away. || E1
  Caller -> Headache, chest pain, confused, weak. Okay.
  Nurse -> And you can call us anytime, Mitch. Anytime. The social worker will reach out too. || E2
  Caller -> Thank you, Gwen. I appreciate it.
  Nurse -> Take care.
