transcript: |
  Nurse -> Evergreen Hospice, this is Bridget.
  Caller -> Bridget, it's Zofia Kowalczuk. My mother is Berenice. Berenice Kowalczuk. I made a mistake with her patch. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Zofia, I'm here. Tell me what happened. First, her date of birth.
  Caller -> February fifth. Nineteen forty two. || patient_dob
  Nurse -> And is nine one oh, five five five, zero one six two the best number? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. What did you do with the patch?
  Caller -> This morning I put on a new patch. The fentanyl patch. The twenty five micrograms an hour. We change it every three days and today is the day. And just now, I was giving her a bath, and I saw another patch on her back. The old one. I forgot to take it off. She has two on. || A1, F1
  Nurse -> Okay. Thank you for telling me right away. When did you put the new one on?
  Caller -> This morning. About eight. So nine hours. Maybe a bit less. || A1
  Nurse -> Okay. How is she right now?
  Caller -> Very sleepy. She's been sleepy all afternoon, I thought it was just her usual. But now I know. When I say her name she opens her eyes and looks at me. And she goes back. || A2
  Nurse -> Okay. Can you count her breaths for a full minute?
  Caller -> Hold on. One, two. Okay. I counted eleven. Eleven in a minute. It's slow but steady. || A3
  Nurse -> Okay. Zofia, take both patches off right now. Peel them off, fold them in half with the sticky sides together, and put them in a bag. || R1
  Caller -> Both off. Right now. Okay. Hold on, I'm doing it. Mom, I'm going to turn you. Okay. The old one is off. The new one is off. They're folded. In the bag. Done.
  Nurse -> Good. I'm going to page our on-call nurse right now. || R2
  Caller -> Okay. Thank you. Will she be okay?
  Nurse -> We're going to watch her closely. I'll call you back in ten minutes. || R3
  Caller -> Ten minutes. Okay.
  Nurse -> Until then, stay beside her. Keep saying her name and see if she wakes up. Keep counting her breathing. And don't put another patch on. || E1
  Caller -> Stay. Name. Breathing. No patch. Okay.
  Nurse -> And Zofia, if you can't wake her, if her breathing drops below eight a minute, or her lips turn blue, call nine one one right away. || E2
  Caller -> Can't wake. Below eight. Blue. Nine one one. Okay.
  Nurse -> I'll call in ten.
  Caller -> I'm so sorry. I'm so careful with these. I just. I changed it on autopilot.
  Nurse -> It happens to the most careful people. You caught it, and you told us. That's what counts.
