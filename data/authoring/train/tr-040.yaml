transcript: |
  Nurse -> Summit Palliative Care, this is Denise.
  Caller -> Hi. Hi, Denise. This is Nate Szabo. I'm calling about my dad. Everett. || caller_name, relationship, patient_name
  Nurse -> Hi, Nate. Everett's date of birth?
  Caller -> August eighth, nineteen forty nine. || patient_dob
  Nurse -> And your number, Nate?
  Caller -> Seven one nine, five five five, zero one four four. || callback_phone
  Nurse -> Okay. What's going on tonight?
  Caller -> I'm worried about him. He said something, a couple of hours ago, and it's really bothering me. || cc
  Nurse -> Okay. Take your time. What did he say?
  Caller -> He said, he said I'd be better off gone. And that he doesn't want to be here anymore. || cc, A1, F1
  Nurse -> Okay. Thank you for telling me, Nate. That sounds scary.
  Caller -> It was. It is. He's never said anything like that.
  Nurse -> Okay. Is your dad with you right now?
  Caller -> Yes. He's in the living room. I'm in the kitchen, with the phone. I'm staying here tonight. || A5
  Nurse -> Okay, good. Did he say he was going to do something? Did he talk about a plan, or a way?
  Caller -> No. No, I don't think so. He didn't say anything like that. I don't think he did. || A3
  Nurse -> Okay. Does your dad have any guns in the house?
  Caller -> He does. A couple. But they're in the gun safe, and I'm the only one with the code. I changed it last year. || A4
  Nurse -> Okay. That's very good. And what about his medications, are they locked?
  Caller -> No, they're just in the cabinet. I can lock them up.
  Nurse -> I'd do that tonight. How has his mood been the last few days?
  Caller -> Quiet. He's been really quiet. Withdrawn. Maybe two weeks? Ever since the doctor said the heart is worse. || A2
  Nurse -> Okay. That makes sense. That's a hard thing to hear. Nate, I want to make sure he gets support. I'm going to have our social worker call you today. || R1
  Caller -> Okay. Today. Okay.
  Nurse -> And I'm going to let our doctor know about this tonight. || R2
  Caller -> Okay. Thank you.
  Nurse -> I'll call you back within the hour to check on how things are. || R3
  Caller -> Okay. Thank you, Denise.
  Nurse -> A few things. Please stay with him tonight, keep the guns locked, and lock up any extra medicine. || E2
  Caller -> I will. I'm not going anywhere.
  Nurse -> And you can call or text nine eight eight any time, day or night. That's the crisis line, for him or for you. If he says he has a plan, or he tries to hurt himself, or you can't keep him safe, call nine one one right away. || E1
  Caller -> Nine eight eight. Nine one one if he has a plan. Okay. I've got it.
  Nurse -> You did the right thing by calling. Talk to you within the hour.
  Caller -> Thank you.
