blueprint: "A daughter calls hospice the day after the comfort kit was delivered for her 82-year-old father, who is sleeping more but comfortable, to learn which medicine is for which symptom: morphine concentrate five milligrams (a quarter of a milliliter of the twenty per milliliter), lorazepam half a milligram under the tongue for restlessness, haloperidol one milligram for agitation or nausea, atropine two drops under the tongue for rattly secretions, and a Tylenol suppository six hundred fifty milligrams for fever. None has been used yet. Nurse reviews each as needed medicine, the written log, storage, and plans a nurse visit Thursday and a message to the team for a one-page cheat sheet. Comfort kit teaching with multiple as-needed medicines and a liquid concentration, adult child caller, patient 65+, v2 long."
