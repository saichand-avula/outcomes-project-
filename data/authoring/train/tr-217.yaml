transcript: |
  Nurse -> Lakeshore Home Health, this is Tom.
  Caller -> Hey, Tom. This is Dominic Fabbri. I'm staying with my aunt, Lorraine Fabbri. She's on oxygen, and we're about out of the portable tanks. The delivery never came. || caller_name, relationship, patient_name, cc, A1
  Nurse -> Okay, Dominic. Thanks for calling. Can I get her date of birth?
  Caller -> April fourteenth. Nineteen forty seven. || patient_dob
  Nurse -> And a number for you. Is it seven seven three, five five five, zero one one seven? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. How many tanks do you have left?
  Caller -> One. One full one. The rest are empty. I'm not sure if they're all empty. I've just got them lined up by the door. || A1
  Nurse -> Okay. Is she using the concentrator right now, the machine in the house?
  Caller -> Yes. It's running. It's making that noise. The tank is only for when we go out.
  Nurse -> Good. Do you have a way to check her oxygen level?
  Caller -> Yes, there's the little clip thing. It says ninety two right now. || A2
  Nurse -> Okay. That's fine for her. Is she more short of breath than usual?
  Caller -> No. She's good. She's doing her puzzle. She's the same as she's been. || A3
  Nurse -> Okay. I've put the order in for portable tanks. It's done. || R1
  Caller -> Oh, good. Because the guy last time said it would come Friday and it didn't.
  Nurse -> I'm going to call the supplier and push for delivery today by five. || R2
  Caller -> Today by five. I'll be here. I'll keep the porch light on.
  Nurse -> Perfect. Until then, keep the concentrator running at home. Save the full tank for when you leave the house. And no flames, no smoking, no candles near the oxygen. || E1
  Caller -> No candles. She does like her candles. I'll move them. Okay.
  Nurse -> If her reading drops under eighty eight, or she's more short of breath, call us right away. || E2
  Caller -> Under eighty eight. More short of breath. Okay. I wrote it on the fridge.
  Nurse -> Anything else, Dominic?
  Caller -> No. Just glad it's getting handled. Thanks, Tom.
