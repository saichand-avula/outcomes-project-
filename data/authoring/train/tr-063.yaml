transcript: |
  Nurse -> Summit Palliative Care, this is Denise.
  Caller -> Hi, Denise. This is Sofia, I'm Concepcion's granddaughter. Concepcion Villareal. || caller_name, relationship, patient_name
  Nurse -> Hi, Sofia. Her date of birth?
  Caller -> November twenty fifth, nineteen forty. || patient_dob
  Nurse -> Thanks. Is seven five four, five five five, zero one six five still good for you? || callback_phone
  Caller -> Yes, that's mine. || callback_phone
  Nurse -> What's going on?
  Caller -> So my grandma, she ran out of her blood thinner. The, um, the Zarelto. The pharmacy was supposed to bring it Monday and it never came. || cc, A2, F1
  Nurse -> Okay. When did she last take it?
  Caller -> Two nights ago. She took the last one two nights ago, with dinner. So she's missed, like, two. Two nights. || A2, F1
  Nurse -> Let me look at her list. I see Xarelto, twenty milligrams, once a day with dinner. Is that the one you mean? || A2
  Caller -> Yes! Yes, that's the one. Xarelto. That's what it is. || A2
  Nurse -> Okay. And I see her metoprolol too. Is she out of that, or is that okay?
  Caller -> Oh, no, that one's fine. We have plenty of that.
  Caller -> And her ankles are really puffy too. Both of them. || A1
  Nurse -> Is she taking her water pill?
  Caller -> I think so. It's the, um, lay six? Lay six, I think it's called. I'm not sure, my aunt does the pills. || A3
  Nurse -> Okay. Any chest pain, trouble breathing?
  Caller -> No, no. She's okay. She's just tired.
  Nurse -> Alright. I'm worried about the missed blood thinner too, so let's get on it. I'm going to call the pharmacy first thing, and see why that refill is late and get it to you today. || R1
  Caller -> Oh, thank God. I've been so worried. It's a blood thinner, it's, if she misses it, it's dangerous, right? || A4
  Nurse -> I'm going to message her doctor about the two missed nights and the ankles, and he'll tell us what to do. || R2
  Caller -> Okay.
  Nurse -> Please don't double up on any of it to catch up. Wait for the doctor's instructions. || E1
  Caller -> Okay. No doubling. I wouldn't.
  Nurse -> I'll call you back tonight with what the pharmacy and the doctor say. || R3
  Caller -> Okay. Tonight. Thank you.
  Nurse -> And if she gets chest pain, sudden trouble breathing, weakness on one side, or trouble speaking, call 911. || E2
  Caller -> Chest pain, breathing, one side, speaking. Okay.
  Nurse -> Anything else?
  Caller -> No. Thank you, Denise.
