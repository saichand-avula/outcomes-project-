transcript: |
  Nurse -> Pinecrest Hospice, this is Mina.
  Caller -> Hi, Mina. It's Duncan Wetherby. My father is Josiah Wetherby. I just want to give an update. He's weaker, and he's not eating like he was. || caller_name, relationship, patient_name, cc, A3, A4
  Nurse -> Okay, Duncan. Thanks for calling. What's his date of birth?
  Caller -> September seventeenth, nineteen thirty three. || patient_dob
  Nurse -> And is two one five, five five five, zero one zero eight a good number? || callback_phone
  Caller -> Yes. That's my cell. || callback_phone
  Nurse -> Okay. Tell me about the weakness. Has he fallen?
  Caller -> No. No falls. He's been careful. Mostly in the chair and the bed. || A3
  Nurse -> Okay. And when did you notice he was weaker?
  Caller -> This week. It's been gradual. He used to be able to stand with the walker. Now he needs me to hold him up. || A3
  Nurse -> Okay. And you said he's eating less?
  Caller -> A lot less. Half a piece of toast this morning. He drinks his tea. That's about it. || A4
  Nurse -> Okay. Any other changes? Sleeping more? Any new pain?
  Caller -> He's sleeping a little more. No pain. Well, actually, wait. I should say. He did slide off the chair on Tuesday. I said no falls, but he did slide down onto the floor. Right onto the rug. || A1
  Nurse -> Okay. I'm glad you told me. What happened?
  Caller -> I was in the kitchen. I heard a thump. He had slid forward off the seat and he was sitting on the rug against the chair. He wasn't hurt. He said he was fine. He laughed about it. || A1
  Nurse -> Okay. Any bruising, any pain in his hip or his back since then?
  Caller -> No. I checked him. No bruises. He says nothing hurts. I got him up with the neighbor's help. || A2
  Nurse -> Okay. Thank you for checking. I'm going to send a nurse out tomorrow to see him and look at his strength. || R1
  Caller -> Tomorrow. Good. I'll be here after ten.
  Nurse -> I'm also going to message the hospice team about the slide and the weakness. || R2
  Caller -> Okay. Thank you. I didn't want to say the fall thing at first. I didn't want you to think I wasn't watching him.
  Nurse -> I don't think that at all. These things happen even with the best care. For now, please have someone next to him whenever he stands or moves. Clear the floor of clutter. And if he does fall, call us. Don't try to lift him alone. || E1
  Caller -> Someone next to him. Clear the floor. Call, don't lift. Okay. I'll move the little rug.
  Nurse -> Good idea. Anything else, Duncan?
  Caller -> No. Thank you, Mina.
