  Caller -> No. No, she's not throwing up. || A4
  Nurse -> Okay. Is she taking anything for constipation?
  Caller -> I don't, I think she has something. I don't know the names. My brother does her medicine.
  Nurse -> Okay. Here's the thing. Without confirming her chart, I can't tell you to give or change any medicine. I'm going to look up that phone number and see if I can find her. I'll call you back in fifteen minutes. || R1
