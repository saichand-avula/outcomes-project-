  Nurse -> And if she starts vomiting, if the pain gets bad, or her belly gets hard and swollen, call us right back. || E2
  Caller -> Hard and swollen. Okay.
  Nurse -> Anything else for now?
  Caller -> No. Thank you.
  Nurse -> Okay. Talk to you in fifteen.
