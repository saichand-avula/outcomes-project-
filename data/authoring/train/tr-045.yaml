transcript: |
  Nurse -> Bluebell Home Care, this is Joanne.
  Caller -> Joanne, it's Denzel, I'm the aide for Mrs. Tran. She fell. Beverly Tran. || caller_name, relationship, patient_name, cc
  Nurse -> Okay, Denzel. Is she conscious? Is she talking?
  Caller -> She's awake, she's talking. She fell in the bathroom, she hit her head on the sink. There's a cut on her forehead and it's bleeding. A lot. || A1, A2, F2
  Nurse -> Okay. When did this happen?
  Caller -> About five minutes ago. She was getting up off the toilet. || A1
  Nurse -> Okay. Does she take a blood thinner?
  Caller -> Yes. The, um, the apixaban. Five milligrams, twice a day. || A3
  Nurse -> Okay. Did she pass out, even for a second?
  Caller -> I don't think so. I heard the thump and came in and she was awake. || A5
  Nurse -> Okay. Is she confused?
  Caller -> A little, I think? She knows her name, she knows me. But she asked me what day it was twice. || A4
  Nurse -> Okay. Denzel, listen to me. Should I call nine one one? I mean, you should call nine one one right now. || R1, E1
  Caller -> Okay. I was going to ask if I should.
  Nurse -> Yes. Hang up with me and call nine one one. A head injury on a blood thinner, with bleeding, needs to be checked in the emergency room. || R1, E1, F1
  Caller -> Okay.
  Nurse -> Before you do, grab a clean towel and press firmly on the cut. Keep pressing, don't peek. || E1
  Caller -> Okay. I'm getting a towel.
  Nurse -> And keep her lying still. Don't move her if she says her neck or back hurts. || E2
  Caller -> Okay. She says her neck is fine. It's just her head.
  Nurse -> Okay. Still, keep her still until the paramedics get there. And tell them she takes apixaban. || E1, A3
  Caller -> Apixaban. Okay. I'll tell them. || A3
  Nurse -> I'll call her family and let them know she's on her way to the hospital. || R2
  Caller -> Okay. Thank you. I'm calling now.
  Nurse -> Go. Call nine one one now.
