transcript: |
  Nurse -> Summit Palliative Care, this is Denise.
  Caller -> Denise, it's Caleb Teller. My wife Winona is throwing up and it won't stop. Winona Teller. || caller_name, relationship, patient_name, cc, A1, F1
  Nurse -> Okay, Caleb, I'm here. I need her date of birth.
  Caller -> July twenty first. Nineteen seventy four. || patient_dob
  Nurse -> And nine seven oh, five five five, zero one two two for you? || callback_phone
  Caller -> Yes. || callback_phone
  Nurse -> Okay. How many times has she vomited?
  Caller -> Eight. Since this morning. I lost count. It's just coming up even when there's nothing in her stomach. || A1, F1
  Nurse -> Did she take her nausea medicine?
  Caller -> The ondansetron. The eight milligram. She took it two hours ago. It came right back up, I think, because she threw up twenty minutes later. || A2
  Nurse -> Okay. Can she keep any water down?
  Caller -> No. Not even a sip. She tries and it comes back. || A3, F1
  Nurse -> Okay. Is she dizzy? How is her mouth?
  Caller -> Dizzy, yes. When she stands she holds onto the wall. And her mouth is dry, her lips are cracked. She says she feels weak. || A4
  Nurse -> Okay. Caleb, this is more than we can fix over the phone. I want you to take her to the emergency room right now. || R1, F2
  Caller -> Right now? Okay. Should I call an ambulance?
  Nurse -> If she can walk to the car with your help, you can drive. If she can't stand, or she's too dizzy to walk, call nine one one. Bring her medicine list, and bring a bucket for the car. || E1
  Caller -> Okay. Car if she can walk. Nine one one if she can't. List. Bucket. Okay.
  Nurse -> I'm going to call the emergency room ahead of you, so they know she's coming. || R2
  Caller -> Oh, thank you. Thank you, Denise.
  Nurse -> Go ahead. Take care of her.
  Caller -> I'm going. Winona, we're going to the hospital. Come on. Okay. Thank you.
